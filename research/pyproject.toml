[project]
name = "shadowseed-research"
version = "0.7.1"
description = "Repository-only benchmark and evaluation tooling for Shadowseed"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
