<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 266" width="770" height="266"><defs><marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker><marker id="arrow-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs><rect width="770" height="266" fill="#fff"/><rect x="20" y="20" width="222" height="78" rx="10" fill="#fff" stroke="#c9d1d6" stroke-width="1.5"/><circle cx="44" cy="44" r="13" fill="#0f6e5f"/><text x="44" y="49" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="66" y="50" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1d2327" text-anchor="start">You ask</text><text x="66" y="72" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">a question in the chat</text><line x1="246" y1="59.0" x2="272" y2="59.0" stroke="#5b6670" stroke-width="1.8" marker-end="url(#arrow-m)"/><rect x="276" y="20" width="222" height="78" rx="10" fill="#fff" stroke="#c9d1d6" stroke-width="1.5"/><circle cx="300" cy="44" r="13" fill="#0f6e5f"/><text x="300" y="49" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="322" y="50" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1d2327" text-anchor="start">The model answers</text><text x="322" y="72" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">as in any chat</text><line x1="502" y1="59.0" x2="528" y2="59.0" stroke="#5b6670" stroke-width="1.8" marker-end="url(#arrow-m)"/><rect x="532" y="20" width="222" height="78" rx="10" fill="#fff" stroke="#c9d1d6" stroke-width="1.5"/><circle cx="556" cy="44" r="13" fill="#0f6e5f"/><text x="556" y="49" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="578" y="50" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1d2327" text-anchor="start">Shadowseed notes</text><text x="578" y="72" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">open points as seeds</text><rect x="20" y="144" width="222" height="78" rx="10" fill="#eef6f4" stroke="#0f6e5f" stroke-width="2"/><circle cx="44" cy="168" r="13" fill="#0f6e5f"/><text x="44" y="173" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="66" y="174" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1d2327" text-anchor="start">You check a source</text><text x="66" y="196" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">and record it</text><line x1="246" y1="183.0" x2="272" y2="183.0" stroke="#5b6670" stroke-width="1.8" marker-end="url(#arrow-m)"/><rect x="276" y="144" width="222" height="78" rx="10" fill="#eef6f4" stroke="#0f6e5f" stroke-width="2"/><circle cx="300" cy="168" r="13" fill="#0f6e5f"/><text x="300" y="173" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="322" y="174" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1d2327" text-anchor="start">The Gate promotes</text><text x="322" y="196" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">the seed</text><line x1="502" y1="183.0" x2="528" y2="183.0" stroke="#5b6670" stroke-width="1.8" marker-end="url(#arrow-m)"/><rect x="532" y="144" width="222" height="78" rx="10" fill="#fff" stroke="#c9d1d6" stroke-width="1.5"/><circle cx="556" cy="168" r="13" fill="#0f6e5f"/><text x="556" y="173" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="578" y="174" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1d2327" text-anchor="start">A later answer</text><text x="578" y="196" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">uses it when relevant</text><path d="M643.0,102 V121 H131.0 V140" fill="none" stroke="#5b6670" stroke-width="1.8" marker-end="url(#arrow-m)"/><text x="385" y="252" font-family="'Source Sans 3', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="middle">Steps 1–3 happen in every turn. A seed gains influence only through steps 4 and 5.</text></svg>
