name: Workbench Portability

on:
  pull_request:
    paths:
      - "src/shadowseed/adapters/**"
      - "src/shadowseed/application/**"
      - "src/shadowseed/storage/**"
      - "src/shadowseed/workbench/**"
      - "src/shadowseed/cli.py"
      - "src/shadowseed/cli_dispatch.py"
      - "tests/test_workbench_*.py"
      - "tests/test_production_*_phase4.py"
      - "tests/test_production_*_phase5.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.workbench"
      - ".github/workflows/workbench-portability.yml"
  push:
    branches: [main]
    paths:
      - "src/shadowseed/adapters/**"
      - "src/shadowseed/application/**"
      - "src/shadowseed/storage/**"
      - "src/shadowseed/workbench/**"
      - "src/shadowseed/cli.py"
      - "src/shadowseed/cli_dispatch.py"
      - "tests/test_workbench_*.py"
      - "tests/test_production_*_phase4.py"
      - "tests/test_production_*_phase5.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.workbench"
      - ".github/workflows/workbench-portability.yml"

permissions:
  contents: read

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  portable-install:
    name: ${{ matrix.os }} clean install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Install locked Workbench and test extras
        run: uv sync --locked --extra workbench --extra test
      - name: Installed CLI contract
        run: uv run --no-sync python -m shadowseed.cli workbench --help
      - name: End-to-end fixture, exports, and headless UI
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import tempfile
          from shadowseed.workbench.controller import WorkbenchController
          from shadowseed.workbench.app import build_app

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              controller = WorkbenchController(root / "workspace")
              session_id = controller.create_session(
                  title="Portability smoke",
                  profile_id="demo",
                  backend="fixture",
              )
              controller.send_turn(session_id, "What uncertainty remains?")
              report = controller.export_report(session_id, root / "report.zip")
              support = controller.export_support_bundle(session_id, root / "support.zip")
              assert controller.verify_export(report)["valid"]
              assert controller.verify_export(support)["valid"]
              assert build_app(controller=controller) is not None
              controller.workspace.backup(root / "backup.sqlite")
              assert (root / "backup.sqlite").is_file()
          print("portable Workbench smoke OK")
          PY
      - name: Phase 4/5 production-local adversarial acceptance
        shell: bash
        run: >-
          uv run --no-sync pytest -q
          tests/test_production_*_phase4.py
          tests/test_production_*_phase5.py

  docker-build:
    name: Workbench container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Workbench image
        run: docker build -f Dockerfile.workbench -t shadowseed-workbench:ci .
      - name: Check installed CLI in image
        run: docker run --rm --entrypoint shadowseed shadowseed-workbench:ci workbench --help
