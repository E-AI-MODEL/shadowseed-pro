name: Temporary PR 111 marker durability updater

on:
  push:
    branches: [fix/production-local-integrity-guards]

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  patch-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Apply marker durability fix
        run: |
          python - <<'PY'
          from pathlib import Path

          sqlite_path = Path("src/shadowseed/storage/sqlite.py")
          sqlite_text = sqlite_path.read_text(encoding="utf-8")

          anchor = '''    def _bootstrap_marker_path(self) -> Path:\n'''
          helper = '''    @staticmethod\n    def _fsync_directory(path: Path) -> None:\n        if os.name == "nt":\n            return\n        flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)\n        try:\n            fd = os.open(path, flags)\n        except OSError as exc:\n            raise WorkspaceStorageError(\n                "protected integrity directory is unavailable for durability sync"\n            ) from exc\n        try:\n            os.fsync(fd)\n        except OSError as exc:\n            raise WorkspaceStorageError(\n                "protected integrity directory durability sync failed"\n            ) from exc\n        finally:\n            os.close(fd)\n\n'''
          if sqlite_text.count(anchor) != 1:
              raise SystemExit("bootstrap marker helper anchor changed")
          if "def _fsync_directory(" in sqlite_text:
              raise SystemExit("directory fsync helper already exists")
          sqlite_text = sqlite_text.replace(anchor, helper + anchor)

          old_replace = '''            os.replace(temporary, path)\n            try:\n                path.chmod(0o600)\n'''
          new_replace = '''            os.replace(temporary, path)\n            self._fsync_directory(path.parent)\n            try:\n                path.chmod(0o600)\n'''
          if sqlite_text.count(old_replace) != 1:
              raise SystemExit("marker replace target changed")
          sqlite_text = sqlite_text.replace(old_replace, new_replace)

          old_unlink = '''        try:\n            path.unlink()\n        except OSError as exc:\n            raise WorkspaceStorageError(\n                "protected bootstrap marker could not be cleared"\n            ) from exc\n'''
          new_unlink = '''        try:\n            path.unlink()\n            self._fsync_directory(path.parent)\n        except OSError as exc:\n            raise WorkspaceStorageError(\n                "protected bootstrap marker could not be cleared"\n            ) from exc\n'''
          if sqlite_text.count(old_unlink) != 1:
              raise SystemExit("marker unlink target changed")
          sqlite_path.write_text(sqlite_text.replace(old_unlink, new_unlink), encoding="utf-8")

          tests_path = Path("tests/test_production_persistence_phase3.py")
          tests_text = tests_path.read_text(encoding="utf-8")
          old_setup = '''    root = tmp_path / "workspace"\n    workspace = WorkspaceService(root)\n\n    def interrupt_genesis(*, workspace_id: str, bootstrap_actor_id: str) -> None:\n'''
          new_setup = '''    root = tmp_path / "workspace"\n    workspace = WorkspaceService(root)\n    durability_barriers: list[Path] = []\n    original_fsync_directory = SQLiteWorkspaceRepository._fsync_directory\n\n    def record_fsync_directory(path: Path) -> None:\n        durability_barriers.append(path)\n        original_fsync_directory(path)\n\n    monkeypatch.setattr(\n        SQLiteWorkspaceRepository,\n        "_fsync_directory",\n        staticmethod(record_fsync_directory),\n    )\n\n    def interrupt_genesis(*, workspace_id: str, bootstrap_actor_id: str) -> None:\n'''
          if tests_text.count(old_setup) != 1:
              raise SystemExit("interrupted-bootstrap setup target changed")
          tests_text = tests_text.replace(old_setup, new_setup)

          old_assert = '''    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    assert not marker.exists()\n    assert reopened.repository.verify_production_integrity()["sequence_no"] >= 2\n'''
          new_assert = '''    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    assert not marker.exists()\n    assert durability_barriers == [integrity_dir, integrity_dir]\n    assert reopened.repository.verify_production_integrity()["sequence_no"] >= 2\n'''
          if tests_text.count(old_assert) != 1:
              raise SystemExit("interrupted-bootstrap durability assertion target changed")
          tests_path.write_text(tests_text.replace(old_assert, new_assert), encoding="utf-8")
          PY
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run targeted regressions
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Lint changed Python files
        run: >-
          uv run --no-sync ruff check
          src/shadowseed/storage/sqlite.py
          tests/test_production_persistence_phase3.py
          src/shadowseed/application/operations.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Commit clean final diff
        run: |
          rm .github/workflows/_tmp_fix_111_codex3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/storage/sqlite.py \
                  tests/test_production_persistence_phase3.py \
                  .github/workflows/_tmp_fix_111_codex3.yml
          git commit -m "fix: make bootstrap marker transitions durable"
          git push origin HEAD:fix/production-local-integrity-guards
