name: Apply production live runtime

on:
  push:
    branches:
      - agent/production-live-runtime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Repair unique evaluation report marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_live_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              path,
              "            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
              "            \\"runtime_mode\\": \\"evaluation\\",\\n            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
          )'''
          new = '''replace_once(
              path,
              "        report = {\\n            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
              "        report = {\\n            \\"runtime_mode\\": \\"evaluation\\",\\n            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
          )'''
          if old not in text:
              raise SystemExit('expected patcher marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply guarded patch
        run: python .github/scripts/apply_live_runtime.py
      - name: Complete test setup
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture_path = Path('tests/test_ssl_session_suite.py')
          fixture_text = fixture_path.read_text(encoding='utf-8')
          if 'import pytest\n' not in fixture_text:
              marker = 'import numpy as np\n'
              if marker not in fixture_text:
                  raise SystemExit('numpy import marker not found')
              fixture_text = fixture_text.replace(marker, marker + 'import pytest\n', 1)
              fixture_path.write_text(fixture_text, encoding='utf-8')

          live_path = Path('tests/test_live_runtime.py')
          live_text = live_path.read_text(encoding='utf-8')
          old = '''    seed_id = session.manager.add_or_update_seed(seed_text)\n    for index in range(3):\n'''
          new = '''    seed_id = session.manager.add_or_update_seed(seed_text)\n    session.born_turn[seed_id] = -1\n    for index in range(3):\n'''
          if old not in live_text:
              raise SystemExit('live test setup marker not found')
          live_path.write_text(live_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Static checks
        run: |
          git diff --check
          ruff check src tests/test_live_runtime.py tests/test_ssl_session_suite.py
      - name: Focused runtime tests
        run: |
          pytest -q \
            tests/test_live_runtime.py \
            tests/test_shadow_chat.py \
            tests/test_ssl_session_suite.py \
            tests/test_lifecycle_ttl.py
      - name: Materialize clean product commit
        run: |
          rm .github/scripts/apply_live_runtime.py
          rm .github/workflows/apply-production-live-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add production-oriented live runtime"
          git push
