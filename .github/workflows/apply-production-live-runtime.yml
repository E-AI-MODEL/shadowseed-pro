name: Apply production live runtime

on:
  push:
    branches:
      - agent/production-live-runtime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Repair unique evaluation report marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_live_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              path,
              "            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
              "            \\"runtime_mode\\": \\"evaluation\\",\\n            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
          )'''
          new = '''replace_once(
              path,
              "        report = {\\n            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
              "        report = {\\n            \\"runtime_mode\\": \\"evaluation\\",\\n            \\"turn\\": turn,\\n            \\"question\\": question,\\n",
          )'''
          if old not in text:
              raise SystemExit('expected patcher marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply guarded patch
        run: python .github/scripts/apply_live_runtime.py
      - name: Static checks
        run: |
          git diff --check
          ruff check src tests/test_live_runtime.py tests/test_ssl_session_suite.py
      - name: Focused runtime tests
        run: |
          pytest -q \
            tests/test_live_runtime.py \
            tests/test_shadow_chat.py \
            tests/test_ssl_session_suite.py \
            tests/test_lifecycle_ttl.py
      - name: Materialize clean product commit
        run: |
          rm .github/scripts/apply_live_runtime.py
          rm .github/workflows/apply-production-live-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add production-oriented live runtime"
          git push
