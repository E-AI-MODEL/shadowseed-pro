name: Temporary - materialize Ollama model discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ollama-discovery-materialize.yml
      - src/shadowseed/adapters/ollama_client.py
      - tests/test_ollama_model_discovery.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ollama-model-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire discovery into controller and chat-first UI
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('src/shadowseed/workbench/controller.py')
          text = controller.read_text(encoding='utf-8')
          anchor = '''    @staticmethod
    def default_embedding_backend(backend: str) -> str:
        """Return the safe product default for a model backend."""

        if backend == "fixture":
            return "lexical"
        return "sentence-transformers"

'''
          addition = anchor + '''    @staticmethod
    def discover_models(backend: str) -> list[str]:
        """Discover locally available models without changing provider state."""

        if backend == "ollama":
            from shadowseed.adapters.ollama_client import list_ollama_models

            return list_ollama_models()
        # Hosted providers and arbitrary HF repositories keep a custom-value
        # field. Fixture needs no model id.
        return []

'''
          if text.count(anchor) != 1:
              raise SystemExit('controller discovery insertion anchor changed')
          controller.write_text(text.replace(anchor, addition), encoding='utf-8')

          app = Path('src/shadowseed/workbench/app.py')
          text = app.read_text(encoding='utf-8')

          old_functions = '''    def backend_defaults(backend: str):
        note = next(
            (item["note"] for item in ctl.backends() if item["backend"] == backend),
            "",
        )
        return ctl.default_embedding_backend(backend), note

'''
          new_functions = '''    def model_discovery_update(backend: str, current_model: str | None):
        note = next(
            (item["note"] for item in ctl.backends() if item["backend"] == backend),
            "",
        )
        if backend != "ollama":
            return gr.update(choices=[], value=current_model or None), note
        try:
            models = ctl.discover_models(backend)
        except Exception as exc:
            return (
                gr.update(choices=[], value=current_model or None),
                note + f"\\n\\nLocal model discovery unavailable: {exc}",
            )
        selected = current_model if current_model in models else (models[0] if models else current_model or None)
        discovery = (
            f"Detected {len(models)} local Ollama model(s)."
            if models
            else "Ollama is reachable but no local models were reported."
        )
        return gr.update(choices=models, value=selected), note + f"\\n\\n{discovery}"

    def backend_defaults(backend: str, current_model: str | None):
        model_update, note = model_discovery_update(backend, current_model)
        return ctl.default_embedding_backend(backend), note, model_update

    def refresh_models(backend: str, current_model: str | None):
        return model_discovery_update(backend, current_model)

'''
          if text.count(old_functions) != 1:
              raise SystemExit('app backend-default function anchor changed')
          text = text.replace(old_functions, new_functions)

          old_component = '''                    model_id = gr.Textbox(
                        label="Model id",
                        placeholder="Use the exact model id configured for your provider",
                    )
                    backend_note = gr.Markdown(
'''
          new_component = '''                    model_id = gr.Dropdown(
                        choices=[],
                        value=None,
                        allow_custom_value=True,
                        label="Model",
                        info="Local Ollama models can be detected automatically; custom IDs remain allowed.",
                    )
                    refresh_models_button = gr.Button("Detect local models", variant="secondary")
                    backend_note = gr.Markdown(
'''
          if text.count(old_component) != 1:
              raise SystemExit('app model component anchor changed')
          text = text.replace(old_component, new_component)

          old_event = '''            backend.change(
                backend_defaults,
                inputs=[backend],
                outputs=[embedding_backend, backend_note],
            )
'''
          new_event = '''            backend.change(
                backend_defaults,
                inputs=[backend, model_id],
                outputs=[embedding_backend, backend_note, model_id],
            )
            refresh_models_button.click(
                refresh_models,
                inputs=[backend, model_id],
                outputs=[model_id, backend_note],
            )
'''
          if text.count(old_event) != 1:
              raise SystemExit('app backend event anchor changed')
          app.write_text(text.replace(old_event, new_event), encoding='utf-8')
          PY

      - name: Install Workbench test stack
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,workbench]'

      - name: Run discovery and Workbench regressions
        run: |
          ruff check src/shadowseed/adapters/ollama_client.py src/shadowseed/workbench tests/test_ollama_model_discovery.py tests/test_workbench_*.py
          pytest -q tests/test_ollama_model_discovery.py tests/test_workbench_*.py
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from shadowseed.workbench.app import build_app
          with tempfile.TemporaryDirectory() as tmp:
              assert build_app(Path(tmp) / 'workspace') is not None
          print('headless Workbench discovery build OK')
          PY
          git diff --check

      - name: Run full repository quality gate
        run: |
          pytest -q --cov=shadowseed --cov=shadowseed_agent --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Commit verified product wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shadowseed/workbench/controller.py src/shadowseed/workbench/app.py
          git diff --cached --check
          git commit -m 'Discover local Ollama models in Workbench'
          git push origin HEAD:agent/ollama-model-discovery
