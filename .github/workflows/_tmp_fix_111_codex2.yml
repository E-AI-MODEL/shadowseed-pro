name: Temporary PR 111 protected marker updater

on:
  push:
    branches: [fix/production-local-integrity-guards]

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  patch-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Apply protected bootstrap marker fix
        run: |
          python - <<'PY'
          from pathlib import Path

          sqlite_path = Path("src/shadowseed/storage/sqlite.py")
          sqlite_text = sqlite_path.read_text(encoding="utf-8")

          helper_anchor = "    def bind_production(\n"
          if "    def _bootstrap_marker_path(" in sqlite_text:
              raise SystemExit("protected marker helpers already exist")
          helpers = '''    def _bootstrap_marker_path(self) -> Path:\n        if self._integrity_dir is None:\n            raise WorkspaceStorageError("production integrity directory is not bound")\n        return self._integrity_dir / "bootstrap.pending"\n\n    def _read_bootstrap_marker(self) -> str | None:\n        path = self._bootstrap_marker_path()\n        if not path.exists():\n            return None\n        if not path.is_file():\n            raise WorkspaceStorageError("protected bootstrap marker is invalid")\n        if os.name != "nt":\n            try:\n                mode = path.stat().st_mode & 0o777\n            except OSError as exc:\n                raise WorkspaceStorageError(\n                    "protected bootstrap marker is unavailable"\n                ) from exc\n            if mode & 0o077:\n                raise WorkspaceStorageError(\n                    "protected bootstrap marker permissions are too broad"\n                )\n        try:\n            value = path.read_text(encoding="utf-8").strip()\n        except OSError as exc:\n            raise WorkspaceStorageError(\n                "protected bootstrap marker is unavailable"\n            ) from exc\n        if not value.startswith("workspace::"):\n            raise WorkspaceStorageError("protected bootstrap marker is invalid")\n        return value\n\n    def _ensure_bootstrap_marker(self, workspace_id: str) -> None:\n        path = self._bootstrap_marker_path()\n        existing = self._read_bootstrap_marker()\n        if existing is not None:\n            if existing != workspace_id:\n                raise WorkspaceStorageError(\n                    "protected bootstrap marker does not match workspace identity"\n                )\n            return\n\n        path.parent.mkdir(parents=True, exist_ok=True)\n        try:\n            path.parent.chmod(0o700)\n        except OSError:\n            pass\n        temporary = path.with_name(path.name + ".tmp")\n        temporary.unlink(missing_ok=True)\n        flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL\n        fd = os.open(temporary, flags, 0o600)\n        try:\n            if os.name != "nt":\n                os.fchmod(fd, 0o600)\n            handle = os.fdopen(fd, "w", encoding="utf-8", newline="\\n")\n            fd = -1\n            with handle:\n                handle.write(workspace_id + "\\n")\n                handle.flush()\n                os.fsync(handle.fileno())\n            os.replace(temporary, path)\n            try:\n                path.chmod(0o600)\n            except OSError:\n                pass\n        finally:\n            if fd >= 0:\n                os.close(fd)\n            temporary.unlink(missing_ok=True)\n\n        if self._read_bootstrap_marker() != workspace_id:\n            raise WorkspaceStorageError("protected bootstrap marker could not be verified")\n\n    def _clear_bootstrap_marker(self, workspace_id: str) -> None:\n        path = self._bootstrap_marker_path()\n        if self._read_bootstrap_marker() != workspace_id:\n            raise WorkspaceStorageError(\n                "protected bootstrap marker is missing or does not match workspace identity"\n            )\n        try:\n            path.unlink()\n        except OSError as exc:\n            raise WorkspaceStorageError(\n                "protected bootstrap marker could not be cleared"\n            ) from exc\n\n'''
          if sqlite_text.count(helper_anchor) != 1:
              raise SystemExit("bind_production anchor changed")
          sqlite_text = sqlite_text.replace(helper_anchor, helpers + helper_anchor)

          block_start = sqlite_text.index(
              '        bootstrap_marker_key = "production_bootstrap_pending"\n'
          )
          block_end = sqlite_text.index("\n    def _create_production_genesis(", block_start)
          replacement = '''        with self._connect() as connection:\n            stored_workspace = connection.execute(\n                "SELECT value FROM workspace_meta WHERE key='workspace_id'"\n            ).fetchone()\n            ledger_count = int(\n                connection.execute("SELECT COUNT(*) FROM production_ledger").fetchone()[0]\n            )\n\n        pending_workspace = self._read_bootstrap_marker()\n        if stored_workspace is not None and stored_workspace["value"] != workspace_id:\n            raise WorkspaceStorageError(\n                "workspace identity does not match the production database"\n            )\n        if pending_workspace is not None and pending_workspace != workspace_id:\n            raise WorkspaceStorageError(\n                "protected bootstrap marker does not match workspace identity"\n            )\n\n        if ledger_count == 0:\n            if self._anchor_path.exists():\n                raise WorkspaceStorageError(\n                    "production ledger history is missing while protected integrity "\n                    "material exists; explicit recovery is required"\n                )\n            if self._key_path.exists() and pending_workspace != workspace_id:\n                raise WorkspaceStorageError(\n                    "production ledger history is missing while protected integrity "\n                    "material exists; explicit recovery is required"\n                )\n            if pending_workspace is None:\n                self._ensure_bootstrap_marker(workspace_id)\n                pending_workspace = workspace_id\n\n            key = create_integrity_key(self._key_path)\n            self._create_production_genesis(\n                workspace_id=workspace_id,\n                bootstrap_actor_id=bootstrap_actor_id,\n            )\n            report = self._verify_chain_only()\n            write_anchor(\n                self._anchor_path,\n                AnchorState(\n                    workspace_id=workspace_id,\n                    audit_epoch=str(report["audit_epoch"]),\n                    sequence_no=int(report["sequence_no"]),\n                    head_hash=str(report["head_hash"]),\n                    key_id=key_id(key),\n                ),\n                key,\n            )\n            verified = self._verify_bound_integrity(recover_anchor=False)\n            self._clear_bootstrap_marker(workspace_id)\n            return verified\n\n        if stored_workspace is None:\n            raise WorkspaceStorageError(\n                "production ledger exists without bound workspace identity"\n            )\n\n        if pending_workspace is not None:\n            with self._connect() as connection:\n                bootstrap_events = connection.execute(\n                    "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n                ).fetchall()\n            if (\n                len(bootstrap_events) != 1\n                or bootstrap_events[0]["event_type"] != "production.bootstrap"\n            ):\n                raise WorkspaceStorageError(\n                    "incomplete production bootstrap cannot be resumed safely; "\n                    "explicit recovery is required"\n                )\n            if not self._key_path.is_file():\n                raise WorkspaceStorageError(\n                    "protected integrity material is missing; explicit recovery is required"\n                )\n            key = load_integrity_key(self._key_path)\n            if self._anchor_path.is_file():\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            else:\n                report = self._verify_chain_only()\n                write_anchor(\n                    self._anchor_path,\n                    AnchorState(\n                        workspace_id=workspace_id,\n                        audit_epoch=str(report["audit_epoch"]),\n                        sequence_no=int(report["sequence_no"]),\n                        head_hash=str(report["head_hash"]),\n                        key_id=key_id(key),\n                    ),\n                    key,\n                )\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            self._clear_bootstrap_marker(workspace_id)\n            return verified\n\n        if not self._key_path.is_file() or not self._anchor_path.is_file():\n            raise WorkspaceStorageError(\n                "protected integrity material is missing; explicit recovery is required"\n            )\n        return self._verify_bound_integrity(recover_anchor=True)\n'''
          sqlite_path.write_text(
              sqlite_text[:block_start] + replacement + sqlite_text[block_end:],
              encoding="utf-8",
          )

          tests_path = Path("tests/test_production_persistence_phase3.py")
          tests_text = tests_path.read_text(encoding="utf-8")

          old_first = '''    key_before = key.read_bytes()\n    assert not anchor.exists()\n    with sqlite3.connect(workspace.paths.database) as connection:\n        ledger_count = connection.execute(\n            "SELECT COUNT(*) FROM production_ledger"\n        ).fetchone()[0]\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert ledger_count == 0\n    assert pending == (workspace_id,)\n\n    reopened = WorkspaceService(root)\n    reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    with sqlite3.connect(reopened.paths.database) as connection:\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert pending is None\n'''
          new_first = '''    marker = integrity_dir / "bootstrap.pending"\n    key_before = key.read_bytes()\n    assert not anchor.exists()\n    with sqlite3.connect(workspace.paths.database) as connection:\n        ledger_count = connection.execute(\n            "SELECT COUNT(*) FROM production_ledger"\n        ).fetchone()[0]\n    assert ledger_count == 0\n    assert marker.read_text(encoding="utf-8").strip() == workspace_id\n\n    reopened = WorkspaceService(root)\n    reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    assert not marker.exists()\n'''
          if tests_text.count(old_first) != 1:
              raise SystemExit(f"first retry test target count: {tests_text.count(old_first)}")
          tests_text = tests_text.replace(old_first, new_first)

          old_second = '''    key_before = key.read_bytes()\n    assert not anchor.exists()\n    with sqlite3.connect(workspace.paths.database) as connection:\n        events = connection.execute(\n            "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n        ).fetchall()\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert events == [("production.bootstrap",)]\n    assert pending == (workspace_id,)\n\n    monkeypatch.setattr(sqlite_storage, "write_anchor", original_write_anchor)\n    reopened = WorkspaceService(root)\n    reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    with sqlite3.connect(reopened.paths.database) as connection:\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert pending is None\n'''
          new_second = '''    marker = integrity_dir / "bootstrap.pending"\n    key_before = key.read_bytes()\n    assert not anchor.exists()\n    with sqlite3.connect(workspace.paths.database) as connection:\n        events = connection.execute(\n            "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n        ).fetchall()\n    assert events == [("production.bootstrap",)]\n    assert marker.read_text(encoding="utf-8").strip() == workspace_id\n\n    monkeypatch.setattr(sqlite_storage, "write_anchor", original_write_anchor)\n    reopened = WorkspaceService(root)\n    reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    assert not marker.exists()\n'''
          if tests_text.count(old_second) != 1:
              raise SystemExit(f"second retry test target count: {tests_text.count(old_second)}")
          tests_text = tests_text.replace(old_second, new_second)

          old_attack = '''    assert key.read_bytes() == key_before\n    assert anchor.read_bytes() == anchor_before\n    with sqlite3.connect(database) as connection:\n        ledger_count = connection.execute(\n            "SELECT COUNT(*) FROM production_ledger"\n        ).fetchone()[0]\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert ledger_count == 0\n    assert pending is None\n\n    anchor.unlink()\n    key_only_reopen = WorkspaceService(root)\n    with pytest.raises(WorkspaceStorageError, match="protected integrity material exists"):\n        key_only_reopen.initialize()\n    assert key.read_bytes() == key_before\n'''
          new_attack = '''    marker = integrity_dir / "bootstrap.pending"\n    assert key.read_bytes() == key_before\n    assert anchor.read_bytes() == anchor_before\n    with sqlite3.connect(database) as connection:\n        ledger_count = connection.execute(\n            "SELECT COUNT(*) FROM production_ledger"\n        ).fetchone()[0]\n    assert ledger_count == 0\n    assert not marker.exists()\n\n    anchor.unlink()\n    with sqlite3.connect(database) as connection:\n        connection.execute(\n            "INSERT OR REPLACE INTO workspace_meta(key, value) VALUES(?, ?)",\n            ("production_bootstrap_pending", workspace_id),\n        )\n        connection.commit()\n    key_only_reopen = WorkspaceService(root)\n    with pytest.raises(WorkspaceStorageError, match="protected integrity material exists"):\n        key_only_reopen.initialize()\n    assert key.read_bytes() == key_before\n    assert not marker.exists()\n'''
          if tests_text.count(old_attack) != 1:
              raise SystemExit(f"replacement attack target count: {tests_text.count(old_attack)}")
          tests_path.write_text(tests_text.replace(old_attack, new_attack), encoding="utf-8")
          PY
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run targeted regressions
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Lint changed Python files
        run: >-
          uv run --no-sync ruff check
          src/shadowseed/storage/sqlite.py
          tests/test_production_persistence_phase3.py
          src/shadowseed/application/operations.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Commit clean final diff
        run: |
          rm .github/workflows/_tmp_fix_111_codex2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/storage/sqlite.py \
                  tests/test_production_persistence_phase3.py \
                  .github/workflows/_tmp_fix_111_codex2.yml
          git commit -m "fix: protect bootstrap retry state outside the database"
          git push origin HEAD:fix/production-local-integrity-guards
