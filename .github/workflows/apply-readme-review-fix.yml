name: Apply README review fix

on:
  push:
    branches:
      - agent/restructure-readme
    paths:
      - .github/workflows/apply-readme-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restructure-readme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply review fix
        shell: bash
        env:
          README_GZ_B64: 
          TEST_GZ_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('README.md').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['README_GZ_B64']))
          )
          Path('tests/test_claim_boundaries.py').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['TEST_GZ_B64']))
          )
          Path('.github/workflows/apply-readme-review-fix.yml').unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          ruff check .
          pytest -q

      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_claim_boundaries.py .github/workflows/apply-readme-review-fix.yml
          git commit -m "Clarify README CLI guidance"
          git push origin HEAD:agent/restructure-readme
