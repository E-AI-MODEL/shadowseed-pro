name: Apply README review fix

on:
  push:
    branches:
      - agent/restructure-readme
    paths:
      - .github/workflows/apply-readme-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restructure-readme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = 'For the complete command list, optional backends, and reproducible research runs, see [`docs/usage/cli.md`](docs/usage/cli.md).'
          new = (
              'For live-chat and core CLI guidance, see [`docs/usage/cli.md`](docs/usage/cli.md). '
              'Run `shadowseed --help` for the complete command list. Research-specific examples '
              'and reproducibility notes remain under [Activation-probe commands](#activation-probe-commands) '
              'and [Reproducibility rules](#reproducibility-rules).'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one CLI sentence, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''A reproducible comparison needs a fixed model revision, dependencies, labels, case data, random seeds, and a plan written before inspecting the strongest layer.\n\n\n### Scientific basis and exact claim boundaries\n'''
          replacement = '''Generate fresh external dialectical labels:\n\n```bash\nshadowseed run-dialectic-falsification \\\n  --backend openai \\\n  --model-id <model-id> \\\n  --input src/shadowseed/data/dialectic_falsification_transfer_v3.json \\\n  --output results/dialectic_verdicts.json\n```\n\nPass the resulting verdict artifact to `run-activation-probe --verdicts`. Fresh model labels are not bit-reproducible by default, so preserve the artifact together with the model identifier and date.\n\nA reproducible comparison needs a fixed model revision, dependencies, labels, case data, random seeds, and a plan written before inspecting the strongest layer.\n\n\n### Scientific basis and exact claim boundaries\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one activation marker, found {text.count(marker)}')
          readme.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          tests = Path('tests/test_claim_boundaries.py')
          test_text = tests.read_text(encoding='utf-8')
          needle = '''    assert "```mermaid" in README\n    assert README.count("<details>") == README.count("</details>")\n'''
          repl = '''    assert "```mermaid" in README\n    assert "For the complete command list" not in README\n    assert "shadowseed --help" in README\n    assert "run-dialectic-falsification" in README\n    assert README.count("<details>") == README.count("</details>")\n'''
          if test_text.count(needle) != 1:
              raise SystemExit(f'expected one test insertion point, found {test_text.count(needle)}')
          tests.write_text(test_text.replace(needle, repl, 1), encoding='utf-8')

          Path('.github/workflows/apply-readme-review-fix.yml').unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          ruff check .
          pytest -q

      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_claim_boundaries.py .github/workflows/apply-readme-review-fix.yml
          git commit -m "Clarify README CLI guidance"
          git push origin HEAD:agent/restructure-readme
