name: Release Workbench

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  release:
    if: github.repository == 'E-AI-MODEL/shadowseed-pro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require tag commit to be on main and version to match
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit("release tag must start with v")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = f"v{project['version']}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match project version {expected!r}")
          if tag != "v0.4.0":
              raise SystemExit("this release workflow is currently scoped to v0.4.0")
          print(f"validated {tag}")
          PY
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate SHA256SUMS
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          lines = []
          for path in sorted(Path("dist").iterdir()):
              if path.is_file():
                  lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Clean install and release contract smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m venv "${RUNNER_TEMP}/release-venv"
          "${RUNNER_TEMP}/release-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/release-venv/bin/pip" install "${wheel}[workbench]"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/release-venv/bin/shadowseed" workbench --help
          "${RUNNER_TEMP}/release-venv/bin/python" - <<'PY'
          from pathlib import Path
          import tempfile
          from shadowseed.workbench.controller import WorkbenchController

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              controller = WorkbenchController(root / "workspace")
              session_id = controller.create_session(
                  title="Release smoke",
                  profile_id="demo",
                  backend="fixture",
              )
              controller.send_turn(session_id, "Release smoke question")
              report = controller.export_report(session_id, root / "report.zip")
              support = controller.export_support_bundle(session_id, root / "support.zip")
              assert controller.verify_export(report)["valid"]
              assert controller.verify_export(support)["valid"]
          print("installed release smoke OK")
          PY
      - name: Verify checksums before publication
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ../SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/* SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "Shadowseed Workbench 0.4.0 Tester Preview" \
            --notes-file docs/workbench/release-0.4.0.md
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/published"
          gh release download "$GITHUB_REF_NAME" --dir "${RUNNER_TEMP}/published"
          cd "${RUNNER_TEMP}/published"
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name 'shadowseed-*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'shadowseed-*.tar.gz' | wc -l)" -eq 1
