name: Release Workbench

on:
  workflow_run:
    workflows: ["Workbench Portability"]
    types: [completed]

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  release:
    if: >-
      github.repository == 'E-AI-MODEL/shadowseed-pro' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release candidate and decide whether publication is needed
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          release_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          release_tag="v${release_version}"
          notes_file="docs/workbench/release-${release_version}.md"
          test -f "$notes_file"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; no publication needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Tag $release_tag exists without a published release; refusing ambiguous publication." >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
      - name: Build distribution
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate SHA256SUMS
        if: steps.preflight.outputs.should_release == 'true'
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          lines = []
          for path in sorted(Path("dist").iterdir()):
              if path.is_file():
                  lines.append(f"{sha256(path.read_bytes()).hexdigest()}  {path.name}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Clean install and release contract smoke
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m venv "${RUNNER_TEMP}/release-venv"
          "${RUNNER_TEMP}/release-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/release-venv/bin/pip" install "${wheel}[workbench]"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/release-venv/bin/shadowseed" workbench --help
          "${RUNNER_TEMP}/release-venv/bin/python" - <<'PY'
          from pathlib import Path
          import tempfile
          from shadowseed.workbench.controller import WorkbenchController

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              controller = WorkbenchController(root / "workspace")
              session_id = controller.create_session(
                  title="Release smoke",
                  profile_id="demo",
                  backend="fixture",
              )
              controller.send_turn(session_id, "Release smoke question")
              report = controller.export_report(session_id, root / "report.zip")
              support = controller.export_support_bundle(session_id, root / "support.zip")
              assert controller.verify_export(report)["valid"]
              assert controller.verify_export(support)["valid"]
          print("installed release smoke OK")
          PY
      - name: Verify checksums before publication
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ../SHA256SUMS
      - name: Publish GitHub prerelease and create exact tag
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.preflight.outputs.release_version }}
          NOTES_FILE: ${{ steps.preflight.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/* SHA256SUMS \
            --target "$RELEASE_SHA" \
            --prerelease \
            --latest=false \
            --title "Shadowseed Workbench ${RELEASE_VERSION} Tester Preview" \
            --notes-file "$NOTES_FILE"
      - name: Verify published tag and assets
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          mkdir "${RUNNER_TEMP}/published"
          gh release download "$RELEASE_TAG" --dir "${RUNNER_TEMP}/published"
          cd "${RUNNER_TEMP}/published"
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name 'shadowseed-*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'shadowseed-*.tar.gz' | wc -l)" -eq 1
