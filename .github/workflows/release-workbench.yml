name: Release Workbench

on:
  workflow_run:
    workflows: ["Standalone Workbench"]
    types: [completed]

permissions:
  contents: write
  actions: read

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  release:
    if: >-
      github.repository == 'E-AI-MODEL/shadowseed-pro' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate exact release candidate
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          release_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          release_tag="v${release_version}"
          notes_file="docs/workbench/release-${release_version}.md"
          test -f "$notes_file"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; no publication needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Tag $release_tag exists without a published release; refusing ambiguous publication." >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Download verified standalone assets from triggering run
        if: steps.preflight.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: standalone-*
          merge-multiple: true
          path: standalone-assets

      - name: Validate standalone provenance and collect assets
        if: steps.preflight.outputs.should_release == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_VERSION: ${{ steps.preflight.outputs.release_version }}
        shell: python
        run: |
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path("standalone-assets")
          release = Path("release-assets")
          release.mkdir(exist_ok=True)
          manifests = sorted(source.glob("*.manifest.json"))
          if len(manifests) != 3:
              raise SystemExit(f"expected 3 standalone manifests, found {len(manifests)}")
          bundles = []
          for path in manifests:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload["source_sha"] != os.environ["RELEASE_SHA"]:
                  raise SystemExit(f"wrong source sha in {path.name}")
              if payload["version"] != os.environ["RELEASE_VERSION"]:
                  raise SystemExit(f"wrong version in {path.name}")
              if payload["self_test"]["frozen"] is not True:
                  raise SystemExit(f"frozen self-test missing in {path.name}")
              archive = source / payload["archive"]
              if not archive.is_file():
                  raise SystemExit(f"missing standalone archive {archive}")
              shutil.copy2(path, release / path.name)
              shutil.copy2(archive, release / archive.name)
              bundles.append(payload)
          provenance = {
              "artifact": "shadowseed_release_provenance",
              "version": os.environ["RELEASE_VERSION"],
              "source_sha": os.environ["RELEASE_SHA"],
              "standalone_workflow_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "standalone_bundles": bundles,
          }
          (release / "PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Build Python distribution
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cp dist/* release-assets/

      - name: Installed wheel smoke
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m venv "${RUNNER_TEMP}/release-venv"
          "${RUNNER_TEMP}/release-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/release-venv/bin/pip" install "${wheel}[workbench]"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/release-venv/bin/shadowseed" workbench --help
          "${RUNNER_TEMP}/release-venv/bin/shadowseed-workbench" --self-test \
            --workspace "${RUNNER_TEMP}/wheel-workspace" \
            --self-test-output "${RUNNER_TEMP}/wheel-self-test.json"
          "${RUNNER_TEMP}/release-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("wheel-self-test.json").read_text(encoding="utf-8"))
          assert payload["runtime_mode"] == "live"
          assert payload["comparison_generated"] is True
          assert payload["report_verified"] is True
          assert payload["support_verified"] is True
          print("installed wheel Workbench smoke OK")
          PY

      - name: Generate SHA256SUMS
        if: steps.preflight.outputs.should_release == 'true'
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != "SHA256SUMS":
                  digest = sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Verify release checksums before publication
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-workbench-*' ! -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'shadowseed-*.tar.gz' | wc -l)" -eq 1
          test -f PROVENANCE.json

      - name: Publish GitHub prerelease and exact source tag
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.preflight.outputs.release_version }}
          NOTES_FILE: ${{ steps.preflight.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --target "$RELEASE_SHA" \
            --prerelease \
            --latest=false \
            --title "Shadowseed Workbench ${RELEASE_VERSION} Mass Tester Preview" \
            --notes-file "$NOTES_FILE"

      - name: Verify published tag and downloadable assets
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          mkdir "${RUNNER_TEMP}/published"
          gh release download "$RELEASE_TAG" --dir "${RUNNER_TEMP}/published"
          cd "${RUNNER_TEMP}/published"
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-workbench-*' ! -name '*.manifest.json' | wc -l)" -eq 3
          test -f PROVENANCE.json