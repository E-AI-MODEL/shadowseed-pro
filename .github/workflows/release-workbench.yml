name: Release Workbench

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Select RELEASE to publish the current protected main SHA"
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - RELEASE

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: release-workbench
  cancel-in-progress: false

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  release:
    if: >-
      github.repository == 'E-AI-MODEL/shadowseed-pro' &&
      inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"

      - name: Validate exact release candidate and required evidence
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RELEASE"

          git fetch origin main --tags --force
          release_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$release_sha"

          uv lock --check

          release_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          release_tag="v${release_version}"
          notes_file="docs/workbench/release-${release_version}.md"

          test -f "$notes_file"
          test -f LICENSE
          test -f uv.lock

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; no publication needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Tag $release_tag exists without a published release; refusing ambiguous publication." >&2
            exit 1
          fi

          ci_runs_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=20"
          )"
          ci_run_id="$(
            jq -r \
              --arg sha "$release_sha" \
              '.workflow_runs[]
               | select(
                   .head_sha == $sha
                   and .head_branch == "main"
                   and .event == "push"
                   and .status == "completed"
                   and .conclusion == "success"
                 )
               | .id' \
              <<<"$ci_runs_json" \
              | head -n 1
          )"
          if [ -z "$ci_run_id" ]; then
            echo "No successful exact-SHA CI main push run at $release_sha" >&2
            exit 1
          fi
          echo "Verified CI run $ci_run_id for $release_sha"

          release_workflows=(
            "workbench-ci.yml"
            "workbench-portability.yml"
            "research-package-ci.yml"
            "web-only-distribution-candidate.yml"
            "web-client-ci.yml"
          )
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for workflow in "${release_workflows[@]}"; do
            git fetch origin main --force
            if [ "$(git rev-parse origin/main)" != "$release_sha" ]; then
              echo "main advanced before release assurance dispatch" >&2
              exit 1
            fi
            echo "Dispatching $workflow for exact candidate $release_sha"
            gh workflow run "$workflow" --ref main
          done

          web_run_id=""
          for workflow in "${release_workflows[@]}"; do
            run_id=""
            for _attempt in $(seq 1 120); do
              workflow_runs_json="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=20"
              )"
              run_id="$(
                jq -r \
                  --arg sha "$release_sha" \
                  --arg started "$dispatch_started_at" \
                  '.workflow_runs[]
                   | select(
                       .head_sha == $sha
                       and .head_branch == "main"
                       and .event == "workflow_dispatch"
                       and .created_at >= $started
                     )
                   | .id' \
                  <<<"$workflow_runs_json" \
                  | head -n 1
              )"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done

            if [ -z "$run_id" ]; then
              echo "No fresh workflow_dispatch run found for $workflow at $release_sha" >&2
              exit 1
            fi

            echo "Waiting for $workflow run $run_id"
            gh run watch "$run_id" --exit-status --interval 10
            conclusion="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion'
            )"
            if [ "$conclusion" != "success" ]; then
              echo "$workflow run $run_id concluded $conclusion" >&2
              exit 1
            fi

            if [ "$workflow" = "web-only-distribution-candidate.yml" ]; then
              web_run_id="$run_id"
            fi
          done

          test -n "$web_run_id"

          git fetch origin main --force
          if [ "$(git rev-parse origin/main)" != "$release_sha" ]; then
            echo "main advanced while release assurance was running" >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "web_run_id=$web_run_id" >> "$GITHUB_OUTPUT"

      - name: Generate locked release SBOM
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          mkdir -p release-assets
          uv export --locked --extra build --extra standalone-build             --no-emit-project --no-hashes --format requirements.txt             --output-file "${RUNNER_TEMP}/release-sbom.txt"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          requirement = re.compile(
              r"^([A-Za-z0-9_.-]+)==([^ ;]+)(?:\s*;\s*(.+))?$"
          )
          source = Path(os.environ["RUNNER_TEMP"]) / "release-sbom.txt"
          components = []
          seen = set()
          for raw in source.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              match = requirement.fullmatch(line)
              if match is None:
                  raise SystemExit(f"unsupported locked requirement in release SBOM: {line}")
              name, version, marker = match.groups()
              key = (name.lower().replace("_", "-"), version, marker or "")
              if key in seen:
                  continue
              seen.add(key)
              component = {"type": "library", "name": name, "version": version}
              if marker:
                  component["properties"] = [
                      {"name": "shadowseed:environment-marker", "value": marker}
                  ]
              components.append(component)
          if not components:
              raise SystemExit("locked release SBOM contains no components")
          payload = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "components": components,
          }
          path = Path("release-assets/SBOM.cdx.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          checked = json.loads(path.read_text(encoding="utf-8"))
          assert checked["bomFormat"] == "CycloneDX"
          assert checked["specVersion"] == "1.5"
          assert checked.get("components")
          component_names = {
              str(item["name"]).lower().replace("_", "-")
              for item in checked["components"]
          }
          forbidden = {"gradio", "gradio-client", "pillow", "torch",
                       "transformers", "sentence-transformers", "openai"}
          unexpected = sorted(component_names & forbidden)
          if unexpected:
              raise SystemExit(
                  f"thin release SBOM contains optional provider stacks: {unexpected}"
              )
          PY

      - name: Download verified standalone assets from exact-SHA run
        if: steps.preflight.outputs.should_release == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.preflight.outputs.web_run_id }}
          github-token: ${{ github.token }}
          pattern: web-candidate-*
          merge-multiple: true
          path: web-assets

      - name: Validate standalone provenance and collect assets
        if: steps.preflight.outputs.should_release == 'true'
        env:
          RELEASE_SHA: ${{ steps.preflight.outputs.release_sha }}
          SOURCE_RUN_ID: ${{ steps.preflight.outputs.web_run_id }}
          RELEASE_VERSION: ${{ steps.preflight.outputs.release_version }}
        shell: python
        run: |
          import json
          import os
          import shutil
          from hashlib import sha256
          from pathlib import Path

          source = Path("web-assets")
          release = Path("release-assets")
          release.mkdir(exist_ok=True)
          expected_license_sha = sha256(Path("LICENSE").read_bytes()).hexdigest()
          lock_sha = sha256(Path("uv.lock").read_bytes()).hexdigest()
          manifests = sorted(source.glob("*.manifest.json"))
          if len(manifests) != 3:
              raise SystemExit(f"expected 3 standalone manifests, found {len(manifests)}")
          expected_systems = {"linux", "windows", "darwin"}
          seen_systems = set()
          bundles = []
          for path in manifests:
              payload = json.loads(path.read_text(encoding="utf-8"))
              system = payload.get("system")
              if system not in expected_systems or system in seen_systems:
                  raise SystemExit(f"unexpected or duplicate platform in {path.name}")
              seen_systems.add(system)
              if payload["source_sha"] != os.environ["RELEASE_SHA"]:
                  raise SystemExit(f"wrong source sha in {path.name}")
              if payload["version"] != os.environ["RELEASE_VERSION"]:
                  raise SystemExit(f"wrong version in {path.name}")
              if payload.get("artifact") != "shadowseed_web_only_candidate":
                  raise SystemExit(f"not a web-only frozen artifact: {path.name}")
              if payload.get("release_approved") is not False:
                  raise SystemExit(f"candidate status missing: {path.name}")
              if payload.get("gradio_source_files_bundled") is not False:
                  raise SystemExit(f"legacy Gradio included in candidate: {path.name}")
              if payload.get("web_static_assets_bundled") is not True:
                  raise SystemExit(f"web assets missing from candidate: {path.name}")
              if payload.get("self_contained_python_runtime") is not True:
                  raise SystemExit(f"self-contained runtime missing: {path.name}")
              if payload.get("loopback_only_default") is not True:
                  raise SystemExit(f"loopback guard missing: {path.name}")
              smoke = payload.get("self_test") or {}
              if (smoke.get("frozen") is not True
                  or smoke.get("static_assets_verified") is not True
                  or smoke.get("loopback_only") is not True
                  or smoke.get("runtime_mode") != "live"
                  or smoke.get("turn") != 1):
                  raise SystemExit(f"web frozen self-test missing: {path.name}")
              http_smoke = payload.get("http_server_smoke") or {}
              if any(http_smoke.get(key) is not True for key in (
                  "http_healthy", "static_homepage", "host_rebinding_guard",
                  "api_chat_roundtrip"
              )):
                  raise SystemExit(f"frozen HTTP startup smoke failed: {path.name}")
              excluded = set(payload.get("legacy_packages_excluded") or [])
              if not {"gradio", "gradio-client", "pillow"} <= excluded:
                  raise SystemExit(f"legacy exclusion evidence missing: {path.name}")
              if payload.get("license_identifier") != "PolyForm-Noncommercial-1.0.0":
                  raise SystemExit(f"wrong or missing license identifier in {path.name}")
              if payload.get("license_sha256") != expected_license_sha:
                  raise SystemExit(f"wrong license hash in {path.name}")
              if not payload.get("license_file"):
                  raise SystemExit(f"missing bundled license path in {path.name}")
              if payload.get("system") == "darwin":
                  if payload.get("macos_signature_mode") != "adhoc":
                      raise SystemExit(f"macOS artifact is not ad-hoc sealed: {path.name}")
                  if payload.get("macos_archive_roundtrip_verified") is not True:
                      raise SystemExit(f"macOS archive round-trip not verified: {path.name}")
                  roundtrip_http = payload.get("archive_roundtrip_http_server_smoke") or {}
                  if any(roundtrip_http.get(key) is not True for key in (
                      "http_healthy", "static_homepage", "host_rebinding_guard",
                      "api_chat_roundtrip"
                  )):
                      raise SystemExit(f"macOS archive HTTP smoke failed: {path.name}")
                  roundtrip = payload.get("archive_roundtrip_web_self_test") or {}
                  if (roundtrip.get("frozen") is not True
                      or roundtrip.get("runtime_mode") != "live"
                      or roundtrip.get("static_assets_verified") is not True
                      or roundtrip.get("loopback_only") is not True
                      or roundtrip.get("turn") != 1):
                      raise SystemExit(f"macOS archive round-trip smoke failed: {path.name}")
              archive_name = payload.get("archive")
              if (not isinstance(archive_name, str) or not archive_name
                  or "/" in archive_name or "\\" in archive_name):
                  raise SystemExit(f"invalid archive filename in {path.name}")
              archive = source / archive_name
              if not archive.is_file():
                  raise SystemExit(f"missing standalone archive {archive}")
              if sha256(archive.read_bytes()).hexdigest() != payload.get("archive_sha256"):
                  raise SystemExit(f"archive checksum mismatch in {path.name}")
              # The downloadable manifest records the successfully validated
              # release candidate, not the original unapproved CI artifact.
              approved = dict(payload)
              approved["release_approved"] = True
              approved["approval_scope"] = "research-preview"
              approved["approved_source_sha"] = os.environ["RELEASE_SHA"]
              (release / path.name).write_text(
                  json.dumps(approved, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              shutil.copy2(archive, release / archive.name)
              bundles.append(approved)
          if seen_systems != expected_systems:
              raise SystemExit("release does not cover Linux, Windows and macOS")
          shutil.copy2("LICENSE", release / "LICENSE")
          shutil.copy2("uv.lock", release / "uv.lock")
          provenance = {
              "artifact": "shadowseed_release_provenance",
              "version": os.environ["RELEASE_VERSION"],
              "source_sha": os.environ["RELEASE_SHA"],
              "dependency_lock_sha256": lock_sha,
              "sbom_file": "SBOM.cdx.json",
              "license_identifier": "PolyForm-Noncommercial-1.0.0",
              "license_sha256": expected_license_sha,
              "web_workflow_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "web_bundles": bundles,
          }
          (release / "PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Build packaged web client
        if: steps.preflight.outputs.should_release == 'true'
        working-directory: apps/web
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Sync web assets into Python distribution
        if: steps.preflight.outputs.should_release == 'true'
        run: python scripts/sync_web_assets.py

      - name: Build Python distribution from locked build tooling
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          uv sync --locked --extra build
          uv run --no-sync python -m build --no-isolation
          uv run --no-sync python scripts/verify_distribution_license.py --dist-dir dist --license LICENSE
          cp dist/* release-assets/

      - name: Installed web wheel smoke without Gradio or Pillow
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          uv export --locked --no-emit-project --no-hashes \
            --format requirements.txt --output-file "${RUNNER_TEMP}/release-web-locked.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "release-web-locked.txt"
          lines = source.read_text(encoding="utf-8").splitlines()
          names = {
              line.split("==", 1)[0].strip().lower().replace("_", "-")
              for line in lines
              if "==" in line and not line.lstrip().startswith("#")
          }
          forbidden = {"gradio", "gradio-client", "pillow", "torch",
                       "transformers", "sentence-transformers", "openai"}
          unexpected = sorted(names & forbidden)
          if unexpected:
              raise SystemExit(f"web wheel requirements contain legacy or optional modules: {unexpected}")
          assert "numpy" in names
          PY
          uv venv "${RUNNER_TEMP}/release-venv" --python 3.12
          uv pip install --python "${RUNNER_TEMP}/release-venv/bin/python" \
            --no-deps -r "${RUNNER_TEMP}/release-web-locked.txt"
          uv pip install --python "${RUNNER_TEMP}/release-venv/bin/python" \
            --no-deps "$wheel"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/release-venv/bin/shadowseed-web" --self-test \
            --workspace "${RUNNER_TEMP}/web-wheel-workspace" \
            --self-test-output "${RUNNER_TEMP}/web-wheel-self-test.json"
          "${RUNNER_TEMP}/release-venv/bin/python" - <<'PY'
          import json
          from importlib.util import find_spec
          from pathlib import Path

          web = json.loads(Path("web-wheel-self-test.json").read_text(encoding="utf-8"))
          assert web["static_assets_verified"] is True
          assert web["loopback_only"] is True
          assert web["runtime_mode"] == "live"
          assert web["turn"] == 1
          for package in ("gradio", "PIL", "torch", "transformers",
                          "sentence_transformers", "openai"):
              assert find_spec(package) is None, package
          print("installed audited web-only wheel smoke OK")
          PY

      - name: Generate SHA256SUMS
        if: steps.preflight.outputs.should_release == 'true'
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != "SHA256SUMS":
                  digest = sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Verify release checksums before publication
        if: steps.preflight.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-web-*' ! -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'shadowseed-[0-9]*.tar.gz' | wc -l)" -eq 1
          test -f PROVENANCE.json
          test -f SBOM.cdx.json
          test -f uv.lock
          test -f LICENSE

      - name: Attest pre-publication release subjects
        if: steps.preflight.outputs.should_release == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Attest immutable checksum manifest
        if: steps.preflight.outputs.should_release == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Publish GitHub prerelease and exact source tag
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.preflight.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.preflight.outputs.release_version }}
          NOTES_FILE: ${{ steps.preflight.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG"             release-assets/*             --target "$RELEASE_SHA"             --prerelease             --latest=false             --title "Shadowseed Web ${RELEASE_VERSION} Research Preview"             --notes-file "$NOTES_FILE"

          git fetch origin main --force
          if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
            echo "main advanced during publication; deleting stale release $RELEASE_TAG" >&2
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            exit 1
          fi

      - name: Verify published tag and downloadable assets
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.preflight.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          mkdir "${RUNNER_TEMP}/published"
          gh release download "$RELEASE_TAG" --dir "${RUNNER_TEMP}/published"
          cd "${RUNNER_TEMP}/published"
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-web-*' ! -name '*.manifest.json' | wc -l)" -eq 3
          test -f PROVENANCE.json
          test -f SBOM.cdx.json
          test -f uv.lock
          test -f LICENSE

      - name: Dispatch read-only Production Release Assurance for the new tag
        if: steps.preflight.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.preflight.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Starting assurance here removes the manual post-publication step
          # that let earlier candidates lapse. The verifier runs from the
          # published tag so a later main cannot change its semantics.
          gh workflow run production-release-assurance.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
          echo "Dispatched Production Release Assurance for $RELEASE_TAG ($RELEASE_SHA)."
