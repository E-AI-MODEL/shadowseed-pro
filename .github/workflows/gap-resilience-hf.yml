name: Research - Gap resilience HF

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Curated ungated Hugging Face detector model
        required: true
        default: Qwen/Qwen2.5-1.5B-Instruct
        type: choice
        options:
          - Qwen/Qwen2.5-0.5B-Instruct
          - TinyLlama/TinyLlama-1.1B-Chat-v1.0
          - Qwen/Qwen2.5-1.5B-Instruct
          - HuggingFaceTB/SmolLM2-1.7B-Instruct
          - Qwen/Qwen2.5-3B-Instruct
          - microsoft/Phi-3.5-mini-instruct
      repeats:
        description: Repeated detector runs per frozen case
        required: true
        default: "3"
        type: string
      max_new_tokens:
        description: Maximum detector output tokens per run
        required: true
        default: "180"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gap-resilience-hf.yml

permissions:
  contents: read

concurrency:
  group: gap-resilience-hf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gap-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Resolve benchmark inputs
        shell: bash
        run: |
          MODEL_ID="${{ inputs.model_id }}"
          REPEATS="${{ inputs.repeats }}"
          MAX_NEW_TOKENS="${{ inputs.max_new_tokens }}"
          if [ -z "$MODEL_ID" ]; then MODEL_ID="Qwen/Qwen2.5-1.5B-Instruct"; fi
          if [ -z "$REPEATS" ]; then REPEATS="3"; fi
          if [ -z "$MAX_NEW_TOKENS" ]; then MAX_NEW_TOKENS="180"; fi
          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"
          echo "REPEATS=$REPEATS" >> "$GITHUB_ENV"
          echo "MAX_NEW_TOKENS=$MAX_NEW_TOKENS" >> "$GITHUB_ENV"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[models]"

      - name: Run live gap resilience benchmark
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p results/gap_resilience
          GITHUB_SHA="$(git rev-parse HEAD)" python scripts/run_gap_resilience_benchmark.py \
            --backend hf-transformers \
            --model-id "$MODEL_ID" \
            --repeats "$REPEATS" \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --output results/gap_resilience/report.json

      - name: Verify benchmark artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("results/gap_resilience/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["artifact"] == "shadowseed-gap-resilience-v1"
          assert report["run_type"] == "live_benchmark"
          assert report["backend"] == "hf-transformers"
          assert report["model_id"]
          assert report["cases"]
          summary = report["summary"]
          for key in (
              "expected_gap_recall",
              "negative_control_abstention_rate",
              "resolved_gap_reopen_rate",
              "repeatability_mean",
          ):
              assert key in summary
          assert "score" not in summary
          assert "winner" not in summary
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload live benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gap-resilience-hf-${{ env.MODEL_ID }}
          path: results/gap_resilience/report.json
