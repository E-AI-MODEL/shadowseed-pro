name: Temporary dispatch 0.11.0 release

on:
  push:
    branches:
      - release/0.11.0-rc

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch exact main release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-workbench.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f confirm=RELEASE
