name: Repair PR 111 updater escaping

on:
  push:
    branches:
      - fix/production-local-integrity-guards
    paths:
      - .github/workflows/pr111-fix-updater-escaping.yml

permissions:
  contents: write

jobs:
  repair-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - name: Repair nested Python escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr111-bootstrap-fix-v2.yml')
          text = path.read_text(encoding='utf-8')
          old_newline = r'newline="\n"'
          new_newline = r'newline="\\n"'
          old_write = r'+ "\n")'
          new_write = r'+ "\\n")'
          if old_newline not in text or old_write not in text:
              raise SystemExit('escaping repair guard not found')
          text = text.replace(old_newline, new_newline, 1)
          text = text.replace(old_write, new_write, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/pr111-fix-updater-escaping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr111-bootstrap-fix-v2.yml .github/workflows/pr111-fix-updater-escaping.yml
          git commit -m "chore: repair PR 111 updater escaping"
          git push origin HEAD:fix/production-local-integrity-guards
