name: Research - G0 SSOT Polarity Falsification

# Live model-free regressions comparing the historical defect (archived PR #240)
# with the current corrected product SSOT producer and unchanged real Gate.
# Source text and relation attestations are entirely investigator-authored.
# No model discovery, independent truth verification or G0 approval.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/shadowseed/ssot.py"
      - "research/scripts/g0_ssot_evidence_polarity_preflight.py"
      - "research/tests/test_g0_ssot_evidence_polarity.py"
      - ".github/workflows/g0-ssot-polarity-falsification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-g0-ssot-polarity-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ssot-polarity-model-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      HF_TOKEN: ""
    steps:
      - name: Read-only checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Locked product test environment
        run: uv sync --locked --extra test
      - name: Run genuine SSOT and Gate polarity-characterization regressions
        run: |
          uv run --no-sync python -m pytest --import-mode=importlib -q \
            research/tests/test_g0_ssot_evidence_polarity.py \
            research/tests/test_ssot_falsification.py \
            tests/test_ssot_manager.py \
            tests/test_ssot_falsification.py
      - name: Capture sanitized actual evidence trace from real Gate events
        run: |
          mkdir -p research-artifacts
          uv run --no-sync python research/scripts/g0_ssot_evidence_polarity_preflight.py \
            --output research-artifacts/g0-ssot-polarity-after-fix.json
          uv pip freeze --python .venv/bin/python > research-artifacts/g0-ssot-polarity-dependencies.txt
      - name: Enforce claim restrictions, synthetic provenance and opposing evidence labels
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("research-artifacts/g0-ssot-polarity-after-fix.json").read_text(encoding="utf-8"))
          assert r["schema"] == "g0-ssot-polarity-before-after-characterization-v1"
          assert r["status"] == "post_fix_synthetic_mechanics_characterized_not_independently_verified"
          assert r["model_calls"] == r["human_verifiers"] == 0
          assert r["Q1_tested"] is r["Q2_tested"] is r["G0_passed"] is False
          assert r["no_research_gate_or_polarity_classifier"] is True
          assert r["input_provenance"] == "INVESTIGATOR_AUTHORED_FICTIONAL_POLARITIES"
          history = r["historic_pre_fix_result"]
          assert history["source"].endswith("/40176388209")
          assert history["explicit_negation"]["ssot_support"] == 4
          a = r["cases"]["affirmation_with_author_support"]
          b = r["cases"]["explicit_negation_with_author_opposition"]
          c = r["cases"]["unverified_with_author_support"]
          d = r["cases"]["affirmation_without_relation"]
          assert a["accepted_ssot_signal_count"] == 4
          assert len(a["gate_events"]) == 4
          assert a["final_seed"]["weight"] > 0
          assert all(
              case["accepted_ssot_signal_count"] == 0
              and case["final_seed"]["weight"] == 0
              and case["final_seed"]["evidence_count"] == 0
              and not case["gate_events"]
              for case in (b, c, d)
          )
          print("Post-fix: only author-attested SUPPORT reaches existing Gate. Still no independent truth check.")
          PY
      - name: Upload synthetic-only observation and exact dependency set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g0-ssot-polarity-before-after-${{ github.run_id }}
          path: |
            research-artifacts/g0-ssot-polarity-after-fix.json
            research-artifacts/g0-ssot-polarity-dependencies.txt
          if-no-files-found: error
          retention-days: 30
