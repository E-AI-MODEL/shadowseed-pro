name: Apply intake extraction

on:
  push:
    branches:
      - refactor/extract-intake
    paths:
      - .github/workflows/apply-intake-extraction.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-intake
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract intake domain
        shell: bash
        run: |
