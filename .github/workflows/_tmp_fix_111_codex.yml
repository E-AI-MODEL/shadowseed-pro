name: Temporary PR 111 Codex updater

on:
  push:
    branches: [fix/production-local-integrity-guards]

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  patch-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Apply Codex bootstrap retry fix
        run: |
          python - <<'PY'
          from pathlib import Path

          sqlite_path = Path("src/shadowseed/storage/sqlite.py")
          sqlite_text = sqlite_path.read_text(encoding="utf-8")
          bind_offset = sqlite_text.index("    def bind_production(")
          block_start = sqlite_text.index(
              "        with self._connect() as connection:\n            stored_workspace = ",
              bind_offset,
          )
          block_end = sqlite_text.index("\n    def _create_production_genesis(", block_start)
          replacement = '''        bootstrap_marker_key = "production_bootstrap_pending"\n        with self._connect() as connection:\n            stored_workspace = connection.execute(\n                "SELECT value FROM workspace_meta WHERE key='workspace_id'"\n            ).fetchone()\n            ledger_count = int(\n                connection.execute("SELECT COUNT(*) FROM production_ledger").fetchone()[0]\n            )\n            bootstrap_pending = connection.execute(\n                "SELECT value FROM workspace_meta WHERE key = ?",\n                (bootstrap_marker_key,),\n            ).fetchone()\n\n        pending_workspace = (\n            None if bootstrap_pending is None else str(bootstrap_pending["value"])\n        )\n        if stored_workspace is not None and stored_workspace["value"] != workspace_id:\n            raise WorkspaceStorageError(\n                "workspace identity does not match the production database"\n            )\n        if pending_workspace is not None and pending_workspace != workspace_id:\n            raise WorkspaceStorageError(\n                "production bootstrap marker does not match workspace identity"\n            )\n\n        if ledger_count == 0:\n            if self._anchor_path.exists():\n                raise WorkspaceStorageError(\n                    "production ledger history is missing while protected integrity "\n                    "material exists; explicit recovery is required"\n                )\n            if self._key_path.exists() and pending_workspace != workspace_id:\n                raise WorkspaceStorageError(\n                    "production ledger history is missing while protected integrity "\n                    "material exists; explicit recovery is required"\n                )\n            if pending_workspace is None:\n                with self._connect() as connection:\n                    try:\n                        connection.execute("BEGIN IMMEDIATE")\n                        current_count = int(\n                            connection.execute(\n                                "SELECT COUNT(*) FROM production_ledger"\n                            ).fetchone()[0]\n                        )\n                        if current_count != 0:\n                            raise WorkspaceStorageError(\n                                "production ledger changed during bootstrap"\n                            )\n                        current_pending = connection.execute(\n                            "SELECT value FROM workspace_meta WHERE key = ?",\n                            (bootstrap_marker_key,),\n                        ).fetchone()\n                        if current_pending is None:\n                            connection.execute(\n                                "INSERT INTO workspace_meta(key, value) VALUES(?, ?)",\n                                (bootstrap_marker_key, workspace_id),\n                            )\n                        elif current_pending["value"] != workspace_id:\n                            raise WorkspaceStorageError(\n                                "production bootstrap marker does not match workspace identity"\n                            )\n                        connection.commit()\n                    except Exception:\n                        connection.rollback()\n                        raise\n\n            key = create_integrity_key(self._key_path)\n            self._create_production_genesis(\n                workspace_id=workspace_id,\n                bootstrap_actor_id=bootstrap_actor_id,\n            )\n            report = self._verify_chain_only()\n            write_anchor(\n                self._anchor_path,\n                AnchorState(\n                    workspace_id=workspace_id,\n                    audit_epoch=str(report["audit_epoch"]),\n                    sequence_no=int(report["sequence_no"]),\n                    head_hash=str(report["head_hash"]),\n                    key_id=key_id(key),\n                ),\n                key,\n            )\n            verified = self._verify_bound_integrity(recover_anchor=False)\n            with self._connect() as connection:\n                connection.execute(\n                    "DELETE FROM workspace_meta WHERE key = ? AND value = ?",\n                    (bootstrap_marker_key, workspace_id),\n                )\n                connection.commit()\n            return verified\n\n        if stored_workspace is None:\n            raise WorkspaceStorageError(\n                "production ledger exists without bound workspace identity"\n            )\n\n        if pending_workspace is not None:\n            with self._connect() as connection:\n                bootstrap_events = connection.execute(\n                    "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n                ).fetchall()\n            if (\n                len(bootstrap_events) != 1\n                or bootstrap_events[0]["event_type"] != "production.bootstrap"\n            ):\n                raise WorkspaceStorageError(\n                    "incomplete production bootstrap cannot be resumed safely; "\n                    "explicit recovery is required"\n                )\n            if not self._key_path.is_file():\n                raise WorkspaceStorageError(\n                    "protected integrity material is missing; explicit recovery is required"\n                )\n            key = load_integrity_key(self._key_path)\n            if self._anchor_path.is_file():\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            else:\n                report = self._verify_chain_only()\n                write_anchor(\n                    self._anchor_path,\n                    AnchorState(\n                        workspace_id=workspace_id,\n                        audit_epoch=str(report["audit_epoch"]),\n                        sequence_no=int(report["sequence_no"]),\n                        head_hash=str(report["head_hash"]),\n                        key_id=key_id(key),\n                    ),\n                    key,\n                )\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            with self._connect() as connection:\n                connection.execute(\n                    "DELETE FROM workspace_meta WHERE key = ? AND value = ?",\n                    (bootstrap_marker_key, workspace_id),\n                )\n                connection.commit()\n            return verified\n\n        if not self._key_path.is_file() or not self._anchor_path.is_file():\n            raise WorkspaceStorageError(\n                "protected integrity material is missing; explicit recovery is required"\n            )\n        return self._verify_bound_integrity(recover_anchor=True)\n'''
          sqlite_path.write_text(
              sqlite_text[:block_start] + replacement + sqlite_text[block_end:],
              encoding="utf-8",
          )

          tests_path = Path("tests/test_production_persistence_phase3.py")
          tests_text = tests_path.read_text(encoding="utf-8")
          if "test_interrupted_initial_bootstrap_is_retryable" in tests_text:
              raise SystemExit("bootstrap retry tests already exist")
          empty_start = tests_text.index(
              "def test_empty_replacement_database_cannot_reset_protected_history"
          )
          old_backup_start = tests_text.index(
              "def test_old_valid_backup_cannot_silently_replace_newer_live_workspace",
              empty_start,
          )
          retry_tests = '''def test_interrupted_initial_bootstrap_is_retryable_without_resetting_continuity(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    root = tmp_path / "workspace"\n    workspace = WorkspaceService(root)\n\n    def interrupt_genesis(*, workspace_id: str, bootstrap_actor_id: str) -> None:\n        del workspace_id, bootstrap_actor_id\n        raise RuntimeError("synthetic pre-genesis interruption")\n\n    monkeypatch.setattr(\n        workspace.repository, "_create_production_genesis", interrupt_genesis\n    )\n    with pytest.raises(RuntimeError, match="synthetic pre-genesis interruption"):\n        workspace.initialize()\n\n    workspace_id = workspace._read_workspace_id()\n    integrity_dir = workspace._integrity_dir(workspace_id)\n    key = integrity_dir / "integrity.key"\n    anchor = integrity_dir / "anchor.json"\n    key_before = key.read_bytes()\n    assert not anchor.exists()\n    with sqlite3.connect(workspace.paths.database) as connection:\n        ledger_count = connection.execute(\n            "SELECT COUNT(*) FROM production_ledger"\n        ).fetchone()[0]\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert ledger_count == 0\n    assert pending == (workspace_id,)\n\n    reopened = WorkspaceService(root)\n    reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    with sqlite3.connect(reopened.paths.database) as connection:\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert pending is None\n    assert reopened.repository.verify_production_integrity()["sequence_no"] >= 2\n\n\ndef test_interrupted_bootstrap_after_genesis_reseals_before_normal_use(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    import shadowseed.storage.sqlite as sqlite_storage\n\n    root = tmp_path / "workspace"\n    workspace = WorkspaceService(root)\n    original_write_anchor = sqlite_storage.write_anchor\n\n    def interrupt_anchor(*args, **kwargs) -> None:\n        del args, kwargs\n        raise OSError("synthetic post-genesis interruption")\n\n    monkeypatch.setattr(sqlite_storage, "write_anchor", interrupt_anchor)\n    with pytest.raises(OSError, match="synthetic post-genesis interruption"):\n        workspace.initialize()\n\n    workspace_id = workspace._read_workspace_id()\n    integrity_dir = workspace._integrity_dir(workspace_id)\n    key = integrity_dir / "integrity.key"\n    anchor = integrity_dir / "anchor.json"\n    key_before = key.read_bytes()\n    assert not anchor.exists()\n    with sqlite3.connect(workspace.paths.database) as connection:\n        events = connection.execute(\n            "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n        ).fetchall()\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert events == [("production.bootstrap",)]\n    assert pending == (workspace_id,)\n\n    monkeypatch.setattr(sqlite_storage, "write_anchor", original_write_anchor)\n    reopened = WorkspaceService(root)\n    reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.is_file()\n    with sqlite3.connect(reopened.paths.database) as connection:\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert pending is None\n    assert reopened.repository.verify_production_integrity()["sequence_no"] >= 2\n\n\n'''
          empty_test = '''def test_empty_replacement_database_cannot_reset_protected_history(tmp_path: Path) -> None:\n    root = tmp_path / "workspace"\n    workspace = WorkspaceService(root)\n    workspace.initialize()\n    workspace_id = workspace.workspace_id\n\n    integrity_dir = workspace._integrity_dir(workspace_id)\n    key = integrity_dir / "integrity.key"\n    anchor = integrity_dir / "anchor.json"\n    key_before = key.read_bytes()\n    anchor_before = anchor.read_bytes()\n\n    database = workspace.paths.database\n    Path(str(database) + "-wal").unlink(missing_ok=True)\n    Path(str(database) + "-shm").unlink(missing_ok=True)\n    database.unlink()\n    sqlite3.connect(database).close()\n\n    reopened = WorkspaceService(root)\n    with pytest.raises(WorkspaceStorageError, match="protected integrity material exists"):\n        reopened.initialize()\n\n    assert key.read_bytes() == key_before\n    assert anchor.read_bytes() == anchor_before\n    with sqlite3.connect(database) as connection:\n        ledger_count = connection.execute(\n            "SELECT COUNT(*) FROM production_ledger"\n        ).fetchone()[0]\n        pending = connection.execute(\n            "SELECT value FROM workspace_meta "\n            "WHERE key='production_bootstrap_pending'"\n        ).fetchone()\n    assert ledger_count == 0\n    assert pending is None\n\n    anchor.unlink()\n    key_only_reopen = WorkspaceService(root)\n    with pytest.raises(WorkspaceStorageError, match="protected integrity material exists"):\n        key_only_reopen.initialize()\n    assert key.read_bytes() == key_before\n\n\n'''
          tests_path.write_text(
              tests_text[:empty_start]
              + retry_tests
              + empty_test
              + tests_text[old_backup_start:],
              encoding="utf-8",
          )
          PY
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run targeted regressions
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Lint changed Python files
        run: >-
          uv run --no-sync ruff check
          src/shadowseed/storage/sqlite.py
          tests/test_production_persistence_phase3.py
          src/shadowseed/application/operations.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Commit clean final diff
        run: |
          rm .github/workflows/_tmp_fix_111_codex.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/storage/sqlite.py \
                  tests/test_production_persistence_phase3.py \
                  .github/workflows/_tmp_fix_111_codex.yml
          git commit -m "fix: preserve interrupted production bootstrap retryability"
          git push origin HEAD:fix/production-local-integrity-guards
