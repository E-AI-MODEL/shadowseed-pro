name: Research MIT equal-history memory versus LLM

on:
  push:
    branches: [research/mit-shadow-memory-replay-20261103]
    paths:
      - ".github/workflows/mit-shadow-memory-equal-history.yml"
      - "research/experiments/mit_shadow_memory_20261103/equal_history_checkpoint.py"
      - "research/experiments/mit_shadow_memory_20261103/test_equal_history_checkpoint.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mit-equal-history-20261103
  cancel-in-progress: true

jobs:
  equal-history-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install research-specific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8" "sentence-transformers>=3,<6" "transformers>=4.51,<5" "huggingface_hub>=0.28,<1"
      - name: Test chronology, genuine source references and nonleaky labels
        run: |
          PYTHONPATH=. python -m pytest -q \
            research/experiments/mit_shadow_memory_20261103/test_equal_history_checkpoint.py \
            research/experiments/mit_shadow_memory_20261103/test_evaluate_relation_links.py
      - name: Download exact MIT trajectory and verify Git blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mit-data/exp8_math/runs/p50c/readable
          curl -fL --retry 4 \
            https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/4d09ba6d6a7e891dd8063974dfe81b3d78e3494f/exp8_math/runs/p50c/readable/trajectory.md \
            -o mit-data/exp8_math/runs/p50c/readable/trajectory.md
          test "$(git hash-object mit-data/exp8_math/runs/p50c/readable/trajectory.md)" = "caa2d040547e81677f98cccb1854769b1057f3b7"
      - name: Run five equal-history checkpoints with real ShadowseedEngine and Qwen
        run: PYTHONPATH=. python -u research/experiments/mit_shadow_memory_20261103/equal_history_checkpoint.py
      - name: Upload checkpoints, model text and source details even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mit-equal-history-comparison
          path: mit-equal-history-output/
          if-no-files-found: warn
