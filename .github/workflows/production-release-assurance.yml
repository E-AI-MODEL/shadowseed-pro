name: Production Release Assurance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published release tag to assure
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  assure:
    name: exact-SHA release attestation
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Bind assurance to current protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test -n "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$(git rev-parse origin/main)" = "$release_sha"
          gh release view "$RELEASE_TAG" >/dev/null
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
      - name: Download published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release
          cd verified-release
          test -f SHA256SUMS
          test -f PROVENANCE.json
          test -f SBOM.cdx.json
          test -f uv.lock
          test -f LICENSE
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-workbench-*' ! -name '*.manifest.json' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name 'shadowseed-*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'shadowseed-[0-9]*.tar.gz' | wc -l)" -eq 1
      - name: Verify checksum manifest came from trusted pre-publication build
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify verified-release/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-workbench.yml"
      - name: Verify checksum manifest covers every published subject
        shell: python
        run: |
          from pathlib import Path

          root = Path("verified-release")
          lines = (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines()
          recorded = set()
          for line in lines:
              digest, filename = line.split(maxsplit=1)
              filename = filename.strip()
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  raise SystemExit(f"invalid SHA-256 record for {filename!r}")
              if not filename or "/" in filename or "\\" in filename:
                  raise SystemExit(f"invalid release filename in checksum manifest: {filename!r}")
              if filename in recorded:
                  raise SystemExit(f"duplicate checksum subject: {filename}")
              recorded.add(filename)
          actual = {
              path.name
              for path in root.iterdir()
              if path.is_file() and path.name != "SHA256SUMS"
          }
          if recorded != actual:
              missing = sorted(actual - recorded)
              extra = sorted(recorded - actual)
              raise SystemExit(
                  f"checksum manifest does not exactly cover release files; missing={missing}, extra={extra}"
              )
      - name: Verify published bytes against trusted checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd verified-release
          sha256sum -c SHA256SUMS
      - name: Verify published provenance binds every standalone to the candidate
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          root = Path("verified-release")
          release_sha = os.environ["RELEASE_SHA"]
          provenance = json.loads((root / "PROVENANCE.json").read_text(encoding="utf-8"))
          if provenance.get("source_sha") != release_sha:
              raise SystemExit("release provenance source SHA does not match the assured tag")
          manifests = sorted(root.glob("*.manifest.json"))
          if len(manifests) != 3:
              raise SystemExit(f"expected three standalone manifests, found {len(manifests)}")
          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("source_sha") != release_sha:
                  raise SystemExit(f"wrong source SHA in {manifest_path.name}")
              if manifest.get("self_test", {}).get("frozen") is not True:
                  raise SystemExit(f"missing frozen self-test evidence in {manifest_path.name}")
      - name: Verify every release subject was attested before publication
        shell: bash
        run: |
          set -euo pipefail
          while read -r digest filename; do
            test -n "$digest"
            test -n "$filename"
            gh attestation verify "verified-release/$filename" \
              -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-workbench.yml"
          done < verified-release/SHA256SUMS
      - name: Recheck main after assurance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
