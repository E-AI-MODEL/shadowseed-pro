name: Apply PR 27 review fixes

on:
  push:
    branches:
      - refactor/extract-contradictions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-contradictions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for replacement, got {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          manager = Path('src/shadowseed/manager.py')
          replace_once(
              manager,
              'from shadowseed.gate.contradictions import ContradictionRecord, ContradictionStatus\n',
              'from shadowseed.gate.contradictions import (\n'
              '    ContradictionRecord,\n'
              '    ContradictionStatus,  # noqa: F401 - re-exported for compatibility\n'
              ')\n',
          )
          replace_once(
              manager,
              'DEFAULT_CONFIG = SSLCoreConfig()\n'
              '# Keep the historical manager wildcard-import surface without making the new\n'
              '# domain component another implicit manager export.\n'
              '_CONTRADICTION_STATUS_COMPAT = ContradictionStatus\n',
              'DEFAULT_CONFIG = SSLCoreConfig()\n',
          )
          replace_once(
              manager,
              '        return self._contradictions.migrate_legacy(\n'
              '            self._seeds.values(),\n'
              '            records_for=self.contradictions_for,\n'
              '            open_record=self._open_contradiction_record,\n'
              '        )\n',
              '        return self._contradictions.migrate_legacy(\n'
              '            self._seeds.values(),\n'
              '            open_record=self._open_contradiction_record,\n'
              '        )\n',
          )

          contradictions = Path('src/shadowseed/contradictions.py')
          text = contradictions.read_text(encoding='utf-8')
          text = text.replace(
              'from collections.abc import Callable, Iterable, Sequence\nfrom typing import Any\n',
              'from collections.abc import Callable, Iterable\n',
              1,
          )
          needle = '        self._sync_sequence()\n        self._sequence += 1\n'
          if text.count(needle) != 1:
              raise SystemExit('contradictions.py: expected one open() sequence resync')
          text = text.replace(needle, '        self._sequence += 1\n', 1)

          start = text.index('    def migrate_legacy(\n')
          end = text.index('\n\n__all__ = [', start)
          replacement = '''    def migrate_legacy(\n        self,\n        seeds: Iterable[ShadowSeed],\n        *,\n        open_record: Callable[..., ContradictionRecord],\n    ) -> list[ContradictionRecord]:\n        \"\"\"Create records for positive legacy scalars that lack records.\n\n        The manager supplies its historical ``_open_contradiction_record``\n        facade so the extraction preserves the existing call path without\n        introducing alternate migration or restore APIs.\n        \"\"\"\n\n        created: list[ContradictionRecord] = []\n        for seed in seeds:\n            if seed.contradiction_score <= 0.0 or self.contradictions_for(seed.id):\n                continue\n            created.append(\n                open_record(\n                    seed,\n                    reason=\"migrated from legacy contradiction_score\",\n                    source_ref=\"legacy_migration\",\n                    strength=min(1.0, seed.contradiction_score),\n                )\n            )\n        return created\n'''
          text = text[:start] + replacement + text[end:]
          contradictions.write_text(text, encoding='utf-8')

          tests = Path('tests/test_contradictions_extraction.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('from shadowseed.contradictions import ContradictionDomain\n', '', 1)
          helper = '''\n\ndef _seed(seed_id: str = \"seed-1\") -> ShadowSeed:\n    return ShadowSeed(id=seed_id, text=\"a seed\", embedding=_embedding(\"a seed\"))\n'''
          if helper not in text:
              raise SystemExit('tests: _seed helper not found')
          text = text.replace(helper, '', 1)
          pattern = re.compile(
              r'\n\ndef test_domain_roundtrip_preserves_payload_and_identifier_sequence\(\) -> None:\n.*?\n\ndef test_manager_facade_uses_one_canonical_record_collection',
              re.S,
          )
          text, count = pattern.subn(
              '\n\ndef test_manager_facade_uses_one_canonical_record_collection',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'tests: expected one speculative roundtrip test, got {count}')
          tests.write_text(text, encoding='utf-8')

          overview = Path('docs/architecture/overview.md')
          replace_once(
              overview,
              '| `shadowseed.manager` | Seed model, encapsulated authority, lifecycle, TTL, TrTL, Validation Gate, contradiction records, probe feedback |\n',
              '| `shadowseed.manager` | `SSLManager` orchestration, authority-transition facade, lifecycle, TTL, TrTL, Validation Gate facade, probe feedback |\n'
              '| `shadowseed.models` | Stable seed, lifecycle, validation-result, constellation, and probe data contracts |\n'
              '| `shadowseed.contradictions` | Contradiction record collection, identifier sequencing, blocking-state derivation, formal lifecycle workflows, and legacy migration |\n',
          )

          readme = Path('README.md')
          replace_once(
              readme,
              '| [`shadowseed.manager`](src/shadowseed/manager.py) | Seed model, trace/weight separation, lifecycle, TTL, TrTL, Validation Gate, contradiction, feedback logs |\n',
              '| [`shadowseed.manager`](src/shadowseed/manager.py) | `SSLManager` orchestration, authority-transition facade, lifecycle, TTL, TrTL, Validation Gate facade, and feedback logs |\n'
              '| [`shadowseed.models`](src/shadowseed/models.py) | Stable seed, lifecycle, validation-result, constellation, and probe data contracts |\n'
              '| [`shadowseed.contradictions`](src/shadowseed/contradictions.py) | Contradiction collection, blocking state, formal lifecycle workflows, identifier sequencing, and legacy migration |\n',
          )
          PY
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr27-review-fixes.yml
          git add src/shadowseed/manager.py src/shadowseed/contradictions.py tests/test_contradictions_extraction.py docs/architecture/overview.md README.md
          git commit -m "Address contradiction extraction review feedback"
          git push origin HEAD:refactor/extract-contradictions
