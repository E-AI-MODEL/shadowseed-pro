name: Materialize capability report whitespace fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-capability-report-whitespace-fix.yml"

permissions:
  contents: write

concurrency:
  group: materialize-capability-report-whitespace-fix
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'agent/post-alignment-capability-scaling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove generated report trailing whitespace at source
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/shadowseed/benchmark/capability_scaling.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"This bundle is raw research evidence about one pinned runtime/model configuration. ",':
                  '"This bundle is raw research evidence about one pinned runtime/model configuration.",',
              '"Automatic metrics do not establish candidate truth, usefulness, general answer-quality ",':
                  '"Automatic metrics do not establish candidate truth, usefulness, general answer-quality",',
              '"improvement, or production readiness. Candidate-type mix and subjective quality require ",':
                  '"improvement, or production readiness. Candidate-type mix and subjective quality require",',
              '"independent blind review. Answer benefit is reported only for turns where the evaluation ",':
                  '"independent blind review. Answer benefit is reported only for turns where the evaluation",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one report string: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate generated report has no trailing whitespace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -q tests/test_capability_scaling.py tests/test_capability_parser_diagnostics.py
          python -m ruff check src/shadowseed/benchmark/capability_scaling.py
          git diff --check

      - name: Commit Python-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/benchmark/capability_scaling.py
          git diff --cached --check
          git commit -m "Fix capability report whitespace"
          git push origin HEAD:agent/post-alignment-capability-scaling
