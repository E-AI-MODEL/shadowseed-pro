name: PR 111 Codex round 7 fixes

on:
  push:
    branches:
      - fix/production-local-integrity-guards
    paths:
      - .github/workflows/pr111-codex-round7.yml

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.14"
      - name: Apply Codex round 7 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          sqlite_path = Path("src/shadowseed/storage/sqlite.py")
          text = sqlite_path.read_text(encoding="utf-8")

          old = '''            os.replace(temporary, target)
          except Exception:
          '''
          new = '''            os.replace(temporary, target)
              self._fsync_directory(target.parent)
          except Exception:
          '''
          if old not in text:
              raise SystemExit("base backup durability guard not found")
          text = text.replace(old, new, 1)

          lock_anchor = '    def _bootstrap_marker_path(self) -> Path:\n'
          if '    def _bootstrap_lock(self)' not in text:
              lock_block = '''    @contextmanager
              def _bootstrap_lock(self) -> Iterator[None]:
                  if self._integrity_dir is None:
                      raise WorkspaceStorageError("production integrity directory is not bound")
                  self._ensure_durable_directory(self._integrity_dir)
                  path = self._integrity_dir / "bootstrap.lock"
                  try:
                      fd = os.open(path, os.O_RDWR | os.O_CREAT, 0o600)
                  except OSError as exc:
                      raise WorkspaceStorageError(
                          "production bootstrap lock is unavailable"
                      ) from exc
                  try:
                      if os.name != "nt":
                          os.fchmod(fd, 0o600)
                  except OSError:
                      pass
                  finally:
                      os.close(fd)

                  try:
                      connection = sqlite3.connect(
                          path, timeout=30.0, isolation_level=None
                      )
                      connection.execute("BEGIN EXCLUSIVE")
                  except sqlite3.Error as exc:
                      try:
                          connection.close()
                      except UnboundLocalError:
                          pass
                      raise WorkspaceStorageError(
                          "production bootstrap lock could not be acquired"
                      ) from exc
                  try:
                      yield
                  finally:
                      try:
                          connection.rollback()
                      finally:
                          connection.close()

          '''
              if lock_anchor not in text:
                  raise SystemExit("bootstrap lock insertion guard not found")
              text = text.replace(lock_anchor, lock_block + lock_anchor, 1)

          text = text.replace(
              '            "bootstrap_actor_id",\n            "expected_genesis_hash",\n',
              '            "bootstrap_actor_id",\n            "bootstrap_payload",\n            "expected_genesis_hash",\n',
              1,
          )

          validation_anchor = '''        bootstrap_actor_id = payload.get("bootstrap_actor_id")
              expected_genesis_hash = payload.get("expected_genesis_hash")
          '''
          validation_new = '''        bootstrap_actor_id = payload.get("bootstrap_actor_id")
              bootstrap_payload = payload.get("bootstrap_payload")
              expected_genesis_hash = payload.get("expected_genesis_hash")
          '''
          if validation_anchor not in text:
              raise SystemExit("marker validation variable guard not found")
          text = text.replace(validation_anchor, validation_new, 1)

          digest_guard = '''        if (
                  not isinstance(expected_genesis_hash, str)
                  or len(expected_genesis_hash) != 64
                  or any(character not in "0123456789abcdef" for character in expected_genesis_hash)
              ):
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              return dict(payload)
          '''
          digest_new = '''        if not isinstance(bootstrap_payload, dict) or set(bootstrap_payload) != {
                  "pre_production_history",
                  "source_schema_version",
                  "source_database_sha256",
                  "authority_baseline",
              }:
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              pre_production_history = bootstrap_payload.get("pre_production_history")
              source_schema_version = bootstrap_payload.get("source_schema_version")
              source_database_sha256 = bootstrap_payload.get("source_database_sha256")
              authority_baseline = bootstrap_payload.get("authority_baseline")
              if not isinstance(pre_production_history, bool):
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              if source_schema_version not in {1, SCHEMA_VERSION}:
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              if pre_production_history != (source_schema_version == 1):
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              if pre_production_history:
                  if (
                      not isinstance(source_database_sha256, str)
                      or len(source_database_sha256) != 64
                      or any(
                          character not in "0123456789abcdef"
                          for character in source_database_sha256
                      )
                  ):
                      raise WorkspaceStorageError("protected bootstrap marker is invalid")
              elif source_database_sha256 is not None:
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              if (
                  not isinstance(authority_baseline, str)
                  or len(authority_baseline) != 64
                  or any(character not in "0123456789abcdef" for character in authority_baseline)
              ):
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              if (
                  not isinstance(expected_genesis_hash, str)
                  or len(expected_genesis_hash) != 64
                  or any(character not in "0123456789abcdef" for character in expected_genesis_hash)
              ):
                  raise WorkspaceStorageError("protected bootstrap marker is invalid")
              return dict(payload)
          '''
          if digest_guard not in text:
              raise SystemExit("marker payload validation guard not found")
          text = text.replace(digest_guard, digest_new, 1)

          old_payload_line = '            "payload_json": _json(self._production_bootstrap_payload(connection)),\n'
          new_payload_line = '            "payload_json": _json(marker["bootstrap_payload"]),\n'
          if old_payload_line not in text:
              raise SystemExit("bootstrap event payload guard not found")
          text = text.replace(old_payload_line, new_payload_line, 1)

          prepare_start = text.index('    def _prepare_bootstrap_marker(\n')
          prepare_end = text.index('    def _ensure_bootstrap_marker(', prepare_start)
          prepare_block = '''    def _prepare_bootstrap_marker(
              self, *, workspace_id: str, bootstrap_actor_id: str
          ) -> dict[str, Any]:
              with self._connect() as connection:
                  existing = connection.execute(
                      "SELECT COUNT(*) FROM production_ledger"
                  ).fetchone()
                  if existing is None or int(existing[0]) != 0:
                      raise WorkspaceStorageError("production genesis already exists")
                  marker: dict[str, Any] = {
                      "format_version": _BOOTSTRAP_MARKER_FORMAT_VERSION,
                      "workspace_id": workspace_id,
                      "audit_epoch": f"epoch::{uuid4()}",
                      "event_id": f"ledger::{uuid4()}",
                      "created_at": datetime.now().isoformat(),
                      "bootstrap_actor_id": bootstrap_actor_id,
                      "bootstrap_payload": self._production_bootstrap_payload(connection),
                      "expected_genesis_hash": "0" * 64,
                  }
                  planned = self._bootstrap_event_row(connection, marker)
              marker["expected_genesis_hash"] = event_digest(planned)
              return self._validate_bootstrap_marker_payload(marker)

          '''
          text = text[:prepare_start] + prepare_block + text[prepare_end:]

          bind_start = text.index('    def bind_production(\n')
          genesis_start = text.index('    def _create_production_genesis(\n', bind_start)
          bind_segment = text[bind_start:genesis_start]
          old_setup = '''        self.initialize()
              self._workspace_id = workspace_id
              self._integrity_dir = Path(integrity_dir).expanduser().resolve()
              self._anchor_path = self._integrity_dir / "anchor.json"
              self._key_path = self._integrity_dir / "integrity.key"

          '''
          new_setup = '''        self._integrity_dir = Path(integrity_dir).expanduser().resolve()
              self._anchor_path = self._integrity_dir / "anchor.json"
              self._key_path = self._integrity_dir / "integrity.key"

          '''
          if old_setup not in bind_segment:
              raise SystemExit("bind setup guard not found")
          bind_segment = bind_segment.replace(old_setup, new_setup, 1)
          critical = '        with self._connect() as connection:\n'
          critical_index = bind_segment.index(critical)
          prefix = bind_segment[:critical_index]
          body = bind_segment[critical_index:]
          if '        with self._bootstrap_lock():\n' in prefix:
              raise SystemExit("bootstrap bind already locked")
          body = textwrap.indent(body, '    ')
          bind_segment = (
              prefix
              + '        with self._bootstrap_lock():\n'
              + '            self.initialize()\n'
              + '            self._workspace_id = workspace_id\n'
              + body
          )
          text = text[:bind_start] + bind_segment + text[genesis_start:]
          sqlite_path.write_text(text, encoding="utf-8")

          production_path = Path("src/shadowseed/storage/production.py")
          production = production_path.read_text(encoding="utf-8")
          old = '''            candidate.close()
                  candidate = None
                  os.replace(temporary, target)
              except Exception:
          '''
          new = '''            candidate.close()
                  candidate = None
                  os.replace(temporary, target)
                  self._fsync_directory(target.parent)
              except Exception:
          '''
          if old not in production:
              raise SystemExit("production backup durability guard not found")
          production = production.replace(old, new, 1)

          checkpoint_start = production.index('    def _ensure_authority_checkpoint(')
          checkpoint_end = production.index('    def _verify_authority_snapshot_consistency(', checkpoint_start)
          checkpoint_block = '''    def _ensure_authority_checkpoint(self, *, bootstrap_actor_id: str) -> None:
              if self._workspace_id is None:
                  raise WorkspaceStorageError("production workspace is not bound")
              with self._connect() as connection:
                  try:
                      connection.execute("BEGIN IMMEDIATE")
                      existing = connection.execute(
                          "SELECT 1 FROM production_ledger "
                          "WHERE event_type='production.authority_checkpoint' LIMIT 1"
                      ).fetchone()
                      if existing is not None:
                          connection.rollback()
                          return
                      snapshot = self._current_authority_snapshot(connection)
                      epoch_row = connection.execute(
                          "SELECT value FROM workspace_meta WHERE key='audit_epoch'"
                      ).fetchone()
                      if epoch_row is None:
                          raise WorkspaceStorageError("workspace audit epoch is missing")
                      self._append_ledger_event(
                          connection,
                          workspace_id=self._workspace_id,
                          audit_epoch=str(epoch_row["value"]),
                          event_type="production.authority_checkpoint",
                          payload={"authority_snapshot": self._snapshot_payload(snapshot)},
                          actor_id=bootstrap_actor_id,
                          actor_scope_id=self._workspace_id,
                          auth_method="local-install-bootstrap",
                          policy_version="production-bootstrap-v1",
                      )
                      connection.commit()
                  except Exception:
                      connection.rollback()
                      raise
              self._advance_anchor()

          '''
          production = production[:checkpoint_start] + checkpoint_block + production[checkpoint_end:]
          production_path.write_text(production, encoding="utf-8")

          test_path = Path("tests/test_production_persistence_phase3.py")
          tests = test_path.read_text(encoding="utf-8")
          if 'import threading\n' not in tests:
              tests = tests.replace('import sqlite3\n', 'import sqlite3\nimport threading\n', 1)
          production_import = 'from shadowseed.storage.production import ProductionSQLiteWorkspaceRepository\n'
          if production_import not in tests:
              tests = tests.replace(
                  'from shadowseed.storage.integrity import canonical_json, event_digest\n',
                  'from shadowseed.storage.integrity import canonical_json, event_digest\n'
                  + production_import,
                  1,
              )

          migration_anchor = '\n\ndef test_v1_product_bootstrap_creates_explicit_preproduction_genesis(tmp_path: Path) -> None:\n'
          migration_tests = '''

          def test_v1_migration_backup_publish_syncs_parent(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              database = tmp_path / "workspace.db"
              _create_v1_workspace(database)
              repository = SQLiteWorkspaceRepository(database)
              barriers: list[Path] = []
              original = SQLiteWorkspaceRepository._fsync_directory

              def record(path: Path) -> None:
                  barriers.append(path)
                  original(path)

              monkeypatch.setattr(
                  SQLiteWorkspaceRepository, "_fsync_directory", staticmethod(record)
              )
              repository.initialize()
              assert tmp_path in barriers


          def test_v1_interrupted_bootstrap_replays_protected_payload_without_backup(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              root = tmp_path / "workspace"
              root.mkdir()
              (root / "workspace.id").write_text("workspace::legacy\n", encoding="utf-8")
              _create_v1_workspace(root / "workspace.db")
              workspace = WorkspaceService(root)

              def interrupt_genesis(*, workspace_id: str, bootstrap_actor_id: str) -> None:
                  del workspace_id, bootstrap_actor_id
                  raise RuntimeError("synthetic v1 pre-genesis interruption")

              monkeypatch.setattr(
                  workspace.repository, "_create_production_genesis", interrupt_genesis
              )
              with pytest.raises(RuntimeError, match="synthetic v1 pre-genesis interruption"):
                  workspace.initialize()

              workspace_id = workspace._read_workspace_id()
              marker = workspace._integrity_dir(workspace_id) / "bootstrap.pending"
              marker_payload = json.loads(marker.read_text(encoding="utf-8"))
              planned_payload = marker_payload["bootstrap_payload"]
              assert planned_payload["pre_production_history"] is True
              assert planned_payload["source_schema_version"] == 1
              assert len(planned_payload["source_database_sha256"]) == 64

              backup = root / "workspace.db.pre-migration-v1-to-v2.bak"
              assert backup.is_file()
              backup.unlink()

              reopened = WorkspaceService(root)
              reopened.initialize()
              with sqlite3.connect(reopened.paths.database) as connection:
                  committed = json.loads(
                      connection.execute(
                          "SELECT payload_json FROM production_ledger WHERE sequence_no = 1"
                      ).fetchone()[0]
                  )
              assert committed == planned_payload
              assert not marker.exists()

          '''
          if 'test_v1_interrupted_bootstrap_replays_protected_payload_without_backup' not in tests:
              if migration_anchor not in tests:
                  raise SystemExit("migration test insertion guard not found")
              tests = tests.replace(migration_anchor, migration_tests + migration_anchor, 1)

          concurrency_anchor = '\n\ndef test_authorized_evidence_is_atomic_attributable_and_content_minimized(tmp_path: Path) -> None:\n'
          concurrency_test = '''

          def test_concurrent_production_bind_serializes_bootstrap(tmp_path: Path) -> None:
              database = tmp_path / "workspace.db"
              seed_repository = ProductionSQLiteWorkspaceRepository(database)
              seed_repository.initialize()
              first = ProductionSQLiteWorkspaceRepository(database)
              second = ProductionSQLiteWorkspaceRepository(database)
              workspace_id = "workspace::concurrent"
              bootstrap_actor_id = "local-owner::concurrent"
              integrity_dir = tmp_path / "integrity"
              barrier = threading.Barrier(2)
              reports: list[dict[str, object]] = []
              errors: list[BaseException] = []

              def bind(repository: ProductionSQLiteWorkspaceRepository) -> None:
                  try:
                      barrier.wait(timeout=5)
                      reports.append(
                          repository.bind_production(
                              workspace_id=workspace_id,
                              integrity_dir=integrity_dir,
                              bootstrap_actor_id=bootstrap_actor_id,
                          )
                      )
                  except BaseException as exc:
                      errors.append(exc)

              threads = [
                  threading.Thread(target=bind, args=(first,)),
                  threading.Thread(target=bind, args=(second,)),
              ]
              for thread in threads:
                  thread.start()
              for thread in threads:
                  thread.join(timeout=20)

              assert all(not thread.is_alive() for thread in threads)
              assert errors == []
              assert len(reports) == 2
              assert (integrity_dir / "integrity.key").is_file()
              assert (integrity_dir / "anchor.json").is_file()
              assert (integrity_dir / "bootstrap.lock").is_file()
              assert not (integrity_dir / "bootstrap.pending").exists()
              with sqlite3.connect(database) as connection:
                  events = connection.execute(
                      "SELECT event_type, COUNT(*) FROM production_ledger "
                      "GROUP BY event_type ORDER BY event_type"
                  ).fetchall()
              assert events == [
                  ("production.authority_checkpoint", 1),
                  ("production.bootstrap", 1),
              ]
              assert first.verify_production_integrity()["authority_snapshot_verified"] is True
              assert second.verify_production_integrity()["authority_snapshot_verified"] is True

          '''
          if 'test_concurrent_production_bind_serializes_bootstrap' not in tests:
              if concurrency_anchor not in tests:
                  raise SystemExit("concurrency test insertion guard not found")
              tests = tests.replace(concurrency_anchor, concurrency_test + concurrency_anchor, 1)

          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run targeted regressions
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Lint changed Python files
        run: >-
          uv run --no-sync ruff check
          src/shadowseed/storage/sqlite.py
          src/shadowseed/storage/production.py
          src/shadowseed/storage/integrity.py
          src/shadowseed/application/operations.py
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Commit tested code only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/storage/sqlite.py src/shadowseed/storage/production.py tests/test_production_persistence_phase3.py
          git commit -m "fix: serialize durable production bootstrap recovery"
          git push origin HEAD:fix/production-local-integrity-guards
