name: Temporary - materialize chat product language contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chat-product-language-materialize.yml
      - tests/test_chat_product_language.py
  push:
    branches:
      - agent/chat-first-ssl-product
    paths:
      - .github/workflows/chat-product-language-materialize.yml
      - tests/test_chat_product_language.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-first-ssl-product
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact language-contract patch
        run: |
          python - <<'PY'
          from pathlib import Path

          replacement = 'response_language="the same language as the user\'s current question"'
          for raw_path in (
              'src/shadowseed/chat.py',
              'src/shadowseed/application/sessions.py',
          ):
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              old = 'response_language="English"'
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{raw_path}: expected exactly one {old!r}, found {count}')
              path.write_text(text.replace(old, replacement), encoding='utf-8')

          test_path = Path('tests/test_live_runtime.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_assertion = 'assert "Respond in English only." in model.calls[0][0]'
          new_assertion = 'assert "same language as the user\'s current question" in model.calls[0][0]'
          count = test_text.count(old_assertion)
          if count != 1:
              raise SystemExit(
                  f'tests/test_live_runtime.py: expected exactly one legacy English assertion, found {count}'
              )
          test_path.write_text(test_text.replace(old_assertion, new_assertion), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run focused product language and chat tests
        run: |
          pytest -q \
            tests/test_chat_product_language.py \
            tests/test_chat_first_product.py \
            tests/test_live_runtime.py \
            tests/test_shadow_chat.py \
            tests/test_workbench_application.py
      - name: Run full repository quality gate
        run: |
          ruff check .
          pytest -q --cov=shadowseed --cov=shadowseed_agent --cov-branch --cov-report=term-missing --cov-fail-under=80
          git diff --check
      - name: Commit only after all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/shadowseed/chat.py \
            src/shadowseed/application/sessions.py \
            tests/test_live_runtime.py
          git diff --cached --check
          git commit -m 'Make product chat follow the user language'
          git push origin HEAD:agent/chat-first-ssl-product
