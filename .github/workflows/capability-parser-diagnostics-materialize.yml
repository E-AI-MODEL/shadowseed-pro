name: Research - capability parser diagnostics materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capability-parser-diagnostics-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply reviewed diagnostics hardening
        run: python tools/materialize_capability_parser_diagnostics.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
      - name: Run focused parser, capability, doctrine, and runtime tests
        run: |
          pytest -q \
            tests/test_capability_parser_diagnostics.py \
            tests/test_capability_scaling.py \
            tests/test_open_set_model_detector.py \
            tests/test_live_runtime.py \
            tests/test_ssl_doctrine_alignment.py \
            tests/test_point_of_use.py
      - name: Run full branch-coverage suite
        run: |
          pytest -q \
            --cov=shadowseed \
            --cov=shadowseed_agent \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=80
      - name: Static, whitespace, and module smoke
        run: |
          ruff check .
          git diff --check
          python -m shadowseed.benchmark.capability_scaling --help
      - name: Build package
        run: python -m build
      - name: Commit verified diagnostics hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/shadowseed/adapters/models.py \
            src/shadowseed/detection/model_detector.py \
            src/shadowseed/benchmark/capability_scaling.py \
            tests/test_capability_parser_diagnostics.py
          git diff --cached --check
          git commit -m "Measure detector parser behavior and apply HF revisions"
          git push origin HEAD:agent/post-alignment-capability-scaling
