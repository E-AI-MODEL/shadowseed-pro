name: Research MIT recurrence identity pilot

on:
  push:
    branches: [research/mit-shadow-memory-replay-20261103]
    paths:
      - ".github/workflows/mit-shadow-memory-identity-pilot.yml"
      - "research/experiments/mit_shadow_memory_20261103/run_identity_pilot.py"
      - "research/experiments/mit_shadow_memory_20261103/test_identity_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mit-recurrence-identity-pilot
  cancel-in-progress: true

jobs:
  identify-open-question:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8" "sentence-transformers>=3,<6" "transformers>=4.51,<5" "huggingface_hub>=0.28,<1"
      - name: Test frozen pair set and existing recognizer parser
        run: python -m pytest -q research/experiments/mit_shadow_memory_20261103/test_identity_pilot.py
      - name: Download exact MIT data and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mit-data/exp8_math/runs/p50c/readable
          curl -fL --retry 4 \
            https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/4d09ba6d6a7e891dd8063974dfe81b3d78e3494f/exp8_math/runs/p50c/readable/trajectory.md \
            -o mit-data/exp8_math/runs/p50c/readable/trajectory.md
          test "$(git hash-object mit-data/exp8_math/runs/p50c/readable/trajectory.md)" = "caa2d040547e81677f98cccb1854769b1057f3b7"
      - name: Compare model recognition against 12 labeled clusters and 2 exact controls
        run: PYTHONPATH=. python -u research/experiments/mit_shadow_memory_20261103/run_identity_pilot.py
      - name: Preserve every raw model verdict and negative result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mit-identity-recognition-audit
          path: mit-identity-pilot-output/
          if-no-files-found: warn
