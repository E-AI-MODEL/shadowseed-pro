name: PR 111 final bootstrap sealing fix

on:
  push:
    branches: [fix/production-local-integrity-guards]
    paths:
      - .github/workflows/pr111-codex-round10.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Apply final bootstrap sealing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          sqlite_path = Path("src/shadowseed/storage/sqlite.py")
          production_path = Path("src/shadowseed/storage/production.py")
          test_path = Path("tests/test_production_persistence_phase3.py")

          replace_once(
              sqlite_path,
              '''    def _bind_production_locked(\n        self,\n        *,\n        workspace_id: str,\n        integrity_dir: str | Path,\n        bootstrap_actor_id: str,\n    ) -> dict[str, Any]:\n''',
              '''    def _bind_production_locked(\n        self,\n        *,\n        workspace_id: str,\n        integrity_dir: str | Path,\n        bootstrap_actor_id: str,\n        defer_bootstrap_completion: bool = False,\n    ) -> dict[str, Any]:\n''',
              "bind signature",
          )

          replace_once(
              sqlite_path,
              '''            verified = self._verify_bound_integrity(recover_anchor=False)\n            self._clear_bootstrap_marker(workspace_id)\n            return verified\n\n        if stored_workspace is None:\n''',
              '''            verified = self._verify_bound_integrity(recover_anchor=False)\n            if not defer_bootstrap_completion:\n                self._clear_bootstrap_marker(workspace_id)\n            return verified\n\n        if stored_workspace is None:\n''',
              "initial bootstrap marker clear",
          )

          old_pending = '''        if pending is not None:\n            with self._connect() as connection:\n                try:\n                    connection.execute("BEGIN IMMEDIATE")\n                    bootstrap_events = connection.execute(\n                        "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n                    ).fetchall()\n                    if (\n                        len(bootstrap_events) != 1\n                        or bootstrap_events[0]["event_type"] != "production.bootstrap"\n                    ):\n                        raise WorkspaceStorageError(\n                            "incomplete production bootstrap cannot be resumed safely; "\n                            "explicit recovery is required"\n                        )\n                    live_authority_baseline = self._workspace_authority_baseline(connection)\n                    protected_authority_baseline = str(\n                        pending["bootstrap_payload"]["authority_baseline"]\n                    )\n                    if live_authority_baseline != protected_authority_baseline:\n                        raise WorkspaceStorageError(\n                            "production bootstrap authority baseline changed after protected "\n                            "commitment; explicit recovery is required"\n                        )\n                    connection.commit()\n                except Exception:\n                    connection.rollback()\n                    raise\n            report = self._verify_chain_only()\n            if report["head_hash"] != pending["expected_genesis_hash"]:\n                raise WorkspaceStorageError(\n                    "incomplete production bootstrap does not match protected genesis "\n                    "commitment; explicit recovery is required"\n                )\n            if not self._key_path.is_file():\n                raise WorkspaceStorageError(\n                    "protected integrity material is missing; explicit recovery is required"\n                )\n            key = load_integrity_key(self._key_path)\n            if self._anchor_path.is_file():\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            else:\n                write_anchor(\n                    self._anchor_path,\n                    AnchorState(\n                        workspace_id=workspace_id,\n                        audit_epoch=str(report["audit_epoch"]),\n                        sequence_no=int(report["sequence_no"]),\n                        head_hash=str(report["head_hash"]),\n                        key_id=key_id(key),\n                    ),\n                    key,\n                )\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            self._clear_bootstrap_marker(workspace_id)\n            return verified\n'''
          new_pending = '''        if pending is not None:\n            with self._connect() as connection:\n                try:\n                    connection.execute("BEGIN IMMEDIATE")\n                    bootstrap_events = connection.execute(\n                        "SELECT sequence_no, event_type, event_hash "\n                        "FROM production_ledger ORDER BY sequence_no"\n                    ).fetchall()\n                    if (\n                        not bootstrap_events\n                        or int(bootstrap_events[0]["sequence_no"]) != 1\n                        or bootstrap_events[0]["event_type"] != "production.bootstrap"\n                        or str(bootstrap_events[0]["event_hash"])\n                        != str(pending["expected_genesis_hash"])\n                    ):\n                        raise WorkspaceStorageError(\n                            "incomplete production bootstrap cannot be resumed safely; "\n                            "explicit recovery is required"\n                        )\n                    if len(bootstrap_events) > 1 and (\n                        not defer_bootstrap_completion\n                        or len(bootstrap_events) != 2\n                        or int(bootstrap_events[1]["sequence_no"]) != 2\n                        or bootstrap_events[1]["event_type"]\n                        != "production.authority_checkpoint"\n                    ):\n                        raise WorkspaceStorageError(\n                            "incomplete production bootstrap cannot be resumed safely; "\n                            "explicit recovery is required"\n                        )\n                    live_authority_baseline = self._workspace_authority_baseline(connection)\n                    protected_authority_baseline = str(\n                        pending["bootstrap_payload"]["authority_baseline"]\n                    )\n                    if live_authority_baseline != protected_authority_baseline:\n                        raise WorkspaceStorageError(\n                            "production bootstrap authority baseline changed after protected "\n                            "commitment; explicit recovery is required"\n                        )\n                    connection.commit()\n                except Exception:\n                    connection.rollback()\n                    raise\n            report = self._verify_chain_only()\n            if len(bootstrap_events) == 1 and (\n                report["head_hash"] != pending["expected_genesis_hash"]\n            ):\n                raise WorkspaceStorageError(\n                    "incomplete production bootstrap does not match protected genesis "\n                    "commitment; explicit recovery is required"\n                )\n            if not self._key_path.is_file():\n                raise WorkspaceStorageError(\n                    "protected integrity material is missing; explicit recovery is required"\n                )\n            if len(bootstrap_events) == 2:\n                if not self._anchor_path.is_file():\n                    raise WorkspaceStorageError(\n                        "protected integrity anchor is missing during bootstrap sealing; "\n                        "explicit recovery is required"\n                    )\n                return report\n\n            key = load_integrity_key(self._key_path)\n            if self._anchor_path.is_file():\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            else:\n                write_anchor(\n                    self._anchor_path,\n                    AnchorState(\n                        workspace_id=workspace_id,\n                        audit_epoch=str(report["audit_epoch"]),\n                        sequence_no=int(report["sequence_no"]),\n                        head_hash=str(report["head_hash"]),\n                        key_id=key_id(key),\n                    ),\n                    key,\n                )\n                verified = self._verify_bound_integrity(recover_anchor=False)\n            if not defer_bootstrap_completion:\n                self._clear_bootstrap_marker(workspace_id)\n            return verified\n'''
          replace_once(sqlite_path, old_pending, new_pending, "pending bootstrap resume")

          old_bind = '''        with self._bootstrap_lock():\n            self._bind_production_locked(\n                workspace_id=workspace_id,\n                integrity_dir=self._integrity_dir,\n                bootstrap_actor_id=bootstrap_actor_id,\n            )\n            self._ensure_authority_checkpoint(bootstrap_actor_id=bootstrap_actor_id)\n            return self.verify_production_integrity()\n'''
          new_bind = '''        with self._bootstrap_lock():\n            self._bind_production_locked(\n                workspace_id=workspace_id,\n                integrity_dir=self._integrity_dir,\n                bootstrap_actor_id=bootstrap_actor_id,\n                defer_bootstrap_completion=True,\n            )\n            pending = self._read_bootstrap_marker()\n            self._ensure_authority_checkpoint(bootstrap_actor_id=bootstrap_actor_id)\n            report = self.verify_production_integrity()\n            if pending is not None:\n                self._clear_bootstrap_marker(workspace_id)\n            return report\n'''
          replace_once(production_path, old_bind, new_bind, "production bind completion")

          old_checkpoint = '''    def _ensure_authority_checkpoint(self, *, bootstrap_actor_id: str) -> None:\n        if self._workspace_id is None:\n            raise WorkspaceStorageError("production workspace is not bound")\n        with self._connect() as connection:\n            try:\n                connection.execute("BEGIN IMMEDIATE")\n                existing = connection.execute(\n                    "SELECT 1 FROM production_ledger "\n                    "WHERE event_type='production.authority_checkpoint' LIMIT 1"\n                ).fetchone()\n                if existing is not None:\n                    connection.rollback()\n                    return\n                snapshot = self._current_authority_snapshot(connection)\n                epoch_row = connection.execute(\n                    "SELECT value FROM workspace_meta WHERE key='audit_epoch'"\n                ).fetchone()\n                if epoch_row is None:\n                    raise WorkspaceStorageError("workspace audit epoch is missing")\n                self._append_ledger_event(\n                    connection,\n                    workspace_id=self._workspace_id,\n                    audit_epoch=str(epoch_row["value"]),\n                    event_type="production.authority_checkpoint",\n                    payload={"authority_snapshot": self._snapshot_payload(snapshot)},\n                    actor_id=bootstrap_actor_id,\n                    actor_scope_id=self._workspace_id,\n                    auth_method="local-install-bootstrap",\n                    policy_version="production-bootstrap-v1",\n                )\n                connection.commit()\n            except Exception:\n                connection.rollback()\n                raise\n        self._advance_anchor()\n'''
          new_checkpoint = '''    def _ensure_authority_checkpoint(self, *, bootstrap_actor_id: str) -> None:\n        if self._workspace_id is None:\n            raise WorkspaceStorageError("production workspace is not bound")\n        marker = self._read_bootstrap_marker()\n        should_advance_anchor = marker is not None\n        with self._connect() as connection:\n            try:\n                connection.execute("BEGIN IMMEDIATE")\n                if marker is not None:\n                    live_authority_baseline = self._workspace_authority_baseline(connection)\n                    protected_authority_baseline = str(\n                        marker["bootstrap_payload"]["authority_baseline"]\n                    )\n                    if live_authority_baseline != protected_authority_baseline:\n                        raise WorkspaceStorageError(\n                            "production bootstrap authority baseline changed before "\n                            "checkpoint sealing; explicit recovery is required"\n                        )\n                existing = connection.execute(\n                    "SELECT 1 FROM production_ledger "\n                    "WHERE event_type='production.authority_checkpoint' LIMIT 1"\n                ).fetchone()\n                if existing is not None:\n                    connection.rollback()\n                else:\n                    snapshot = self._current_authority_snapshot(connection)\n                    epoch_row = connection.execute(\n                        "SELECT value FROM workspace_meta WHERE key='audit_epoch'"\n                    ).fetchone()\n                    if epoch_row is None:\n                        raise WorkspaceStorageError("workspace audit epoch is missing")\n                    self._append_ledger_event(\n                        connection,\n                        workspace_id=self._workspace_id,\n                        audit_epoch=str(epoch_row["value"]),\n                        event_type="production.authority_checkpoint",\n                        payload={"authority_snapshot": self._snapshot_payload(snapshot)},\n                        actor_id=bootstrap_actor_id,\n                        actor_scope_id=self._workspace_id,\n                        auth_method="local-install-bootstrap",\n                        policy_version="production-bootstrap-v1",\n                    )\n                    connection.commit()\n                    should_advance_anchor = True\n            except Exception:\n                connection.rollback()\n                raise\n        if should_advance_anchor:\n            self._advance_anchor()\n'''
          replace_once(
              production_path,
              old_checkpoint,
              new_checkpoint,
              "authority checkpoint sealing",
          )

          replace_once(
              test_path,
              '''        observations.append(not acquired)\n        if acquired:\n            raise AssertionError(\n                "bootstrap lock was released before authority checkpoint publication"\n            )\n        original(self, bootstrap_actor_id=bootstrap_actor_id)\n''',
              '''        observations.append(not acquired)\n        if acquired:\n            raise AssertionError(\n                "bootstrap lock was released before authority checkpoint publication"\n            )\n        assert (self._integrity_dir / "bootstrap.pending").is_file()\n        original(self, bootstrap_actor_id=bootstrap_actor_id)\n''',
              "checkpoint marker assertion",
          )

          crash_test = '''\n\ndef test_bootstrap_marker_recovers_checkpoint_commit_before_anchor(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    database = tmp_path / "workspace.db"\n    integrity_dir = tmp_path / "integrity"\n    workspace_id = "workspace::checkpoint-crash"\n    bootstrap_actor_id = "local-owner::checkpoint-crash"\n    repository = ProductionSQLiteWorkspaceRepository(database)\n    marker = integrity_dir / "bootstrap.pending"\n    original_advance = ProductionSQLiteWorkspaceRepository._advance_anchor\n    interrupted = False\n\n    def interrupt_first_checkpoint_anchor(\n        self: ProductionSQLiteWorkspaceRepository,\n    ) -> None:\n        nonlocal interrupted\n        if not interrupted:\n            interrupted = True\n            assert marker.is_file()\n            raise RuntimeError("synthetic checkpoint-before-anchor interruption")\n        original_advance(self)\n\n    monkeypatch.setattr(\n        ProductionSQLiteWorkspaceRepository,\n        "_advance_anchor",\n        interrupt_first_checkpoint_anchor,\n    )\n    with pytest.raises(RuntimeError, match="checkpoint-before-anchor interruption"):\n        repository.bind_production(\n            workspace_id=workspace_id,\n            integrity_dir=integrity_dir,\n            bootstrap_actor_id=bootstrap_actor_id,\n        )\n\n    assert marker.is_file()\n    with sqlite3.connect(database) as connection:\n        events = connection.execute(\n            "SELECT event_type FROM production_ledger ORDER BY sequence_no"\n        ).fetchall()\n    assert events == [\n        ("production.bootstrap",),\n        ("production.authority_checkpoint",),\n    ]\n\n    monkeypatch.setattr(\n        ProductionSQLiteWorkspaceRepository,\n        "_advance_anchor",\n        original_advance,\n    )\n    reopened = ProductionSQLiteWorkspaceRepository(database)\n    report = reopened.bind_production(\n        workspace_id=workspace_id,\n        integrity_dir=integrity_dir,\n        bootstrap_actor_id=bootstrap_actor_id,\n    )\n\n    assert report["authority_snapshot_verified"] is True\n    assert report["sequence_no"] == 2\n    assert report["anchor_sequence_no"] == 2\n    assert not marker.exists()\n'''
          anchor = '''\n\ndef test_concurrent_production_bind_serializes_bootstrap(tmp_path: Path) -> None:\n'''
          test_text = test_path.read_text(encoding="utf-8")
          if test_text.count(anchor) != 1:
              raise SystemExit("crash regression insertion anchor not found exactly once")
          test_path.write_text(test_text.replace(anchor, crash_test + anchor, 1), encoding="utf-8")
          PY
      - name: Sync locked test environment
        run: uv sync --locked --extra test --extra workbench
      - name: Compile changed Python
        run: >-
          uv run --no-sync python -m py_compile
          src/shadowseed/storage/sqlite.py
          src/shadowseed/storage/production.py
          tests/test_production_persistence_phase3.py
      - name: Run targeted regressions
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Lint changed Python
        run: >-
          uv run --no-sync ruff check
          src/shadowseed/storage/sqlite.py
          src/shadowseed/storage/production.py
          tests/test_production_persistence_phase3.py
      - name: Commit tested fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr111-codex-round10.yml
          git add src/shadowseed/storage/sqlite.py src/shadowseed/storage/production.py tests/test_production_persistence_phase3.py
          git diff --cached --check
          git commit -m "fix: seal bootstrap through authority checkpoint"
          git push origin HEAD:fix/production-local-integrity-guards
