name: One-shot live runtime measurement

on:
  pull_request:
    paths:
      - .github/workflows/live-runtime-measure-once.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[models]"
      - name: Measure the live runtime
        env:
          GITHUB_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          shadowseed run-ssl-session \
            --runtime-mode live \
            --live-arms both \
            --backend hf-transformers \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --embedding-backend sentence-transformers \
            --embedding-model sentence-transformers/all-MiniLM-L6-v2 \
            --max-new-tokens 96 \
            --output results/ssl_live_session_qwen2.5_0.5b.json
      - name: Upload measurement
        uses: actions/upload-artifact@v4
        with:
          name: live-runtime-qwen2.5-0.5b
          path: results/ssl_live_session_qwen2.5_0.5b.json
          if-no-files-found: error

