name: Finalize manager modularization

on:
  push:
    branches:
      - refactor/finalize-manager-modularization
    paths:
      - .github/scripts/finalize_manager_modularization.py
      - .github/workflows/finalize-manager-modularization.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finalize-manager-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize manager modularization
        run: |
          python .github/scripts/finalize_manager_modularization.py
          python -m compileall -q src tests
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize manager modularization"
          git push origin HEAD:refactor/finalize-manager-modularization
