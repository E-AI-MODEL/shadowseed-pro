name: Research - replay six real NGBSE model replies through repaired parser

# Uses original paid-model receipts from run 42289482435.
# Zero new model calls, no secrets, no production code changes.
on:
  push:
    branches:
      - research/ngbse-live-comparison-20261106
    paths:
      - .github/workflows/ngbse-parser-replay-20261106.yml

permissions:
  contents: read
  actions: read

jobs:
  replay-original-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed NGBSE parser repair
        uses: actions/checkout@v4
        with:
          repository: E-AI-MODEL/NGBSE20.1
          ref: 70c75c0552d4791bd003230d86ac80d0f28681d5
          path: ngbse
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Retrieve original, exact model outputs
        uses: actions/download-artifact@v4
        with:
          name: ngbse-real-model-blind-review-and-receipts
          repository: E-AI-MODEL/shadowseed-pro
          run-id: 42289482435
          github-token: ${{ github.token }}
          path: research-artifacts/original
      - run: python -m pip install -e ./ngbse
      - name: Replay six original real replies without any provider call
        run: |
          python ngbse/research/ngbse_quality/replay_parser.py \
            --events research-artifacts/original/provider_events.jsonl \
            --answers research-artifacts/original/answers.json \
            --output research-artifacts/replay/parser-replay.json
      - name: Archive inspectable before/after counts
        uses: actions/upload-artifact@v4
        with:
          name: ngbse-numbered-question-parser-replay
          path: research-artifacts/replay/parser-replay.json
          if-no-files-found: error
          retention-days: 14
