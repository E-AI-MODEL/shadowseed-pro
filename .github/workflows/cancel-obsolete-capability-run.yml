name: Cancel obsolete capability run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cancel-obsolete-capability-run.yml"

permissions:
  contents: read

concurrency:
  group: post-alignment-qwen7b-capability-reference
  cancel-in-progress: true

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Superseding the pre-fix Qwen reference run; the corrected head will start the real measurement."
