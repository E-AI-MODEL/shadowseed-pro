name: Research - Laptop-model gap resilience follow-up

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/qwen7b-gap-resilience-once.yml

permissions:
  contents: write

concurrency:
  group: laptop-gap-resilience-follow-up
  cancel-in-progress: true

env:
  MODEL_ID: deepseek-r1:latest
  MODEL_SLUG: deepseek-r1_latest
  RUN_DIR: benchmarks/results/gap_resilience/laptop_models

jobs:
  gap-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Shadowseed
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          echo "OLLAMA_VERSION=$(ollama --version 2>&1 | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Pull and fingerprint DeepSeek R1
        run: |
          ollama pull "$MODEL_ID"
          python - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags", timeout=30) as response:
              payload = json.load(response)
          requested = os.environ["MODEL_ID"]
          match = next(
              (
                  model
                  for model in payload.get("models", [])
                  if model.get("name") == requested
                  or model.get("model") == requested
                  or str(model.get("name", "")).startswith(requested + ":")
              ),
              None,
          )
          if match is None or not match.get("digest"):
              raise SystemExit(f"unable to resolve Ollama digest for {requested}: {payload}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODEL_DIGEST={match['digest']}\n")
          print("resolved model digest", match["digest"])
          PY

      - name: Run DeepSeek thinking on and off
        run: |
          mkdir -p "$RUN_DIR"
          for thinking in on off; do
            for profile in runtime_v06 candidate_v1; do
              output="$RUN_DIR/${MODEL_SLUG}_${profile}_think_${thinking}_controlled.json"
              GITHUB_SHA="$(git rev-parse HEAD)" python scripts/run_gap_resilience_benchmark.py \
                --backend ollama \
                --model-id "$MODEL_ID" \
                --model-revision "$MODEL_DIGEST" \
                --prompt-profile "$profile" \
                --thinking-mode "$thinking" \
                --repeats 2 \
                --max-seeds 3 \
                --max-new-tokens 512 \
                --output "$output"
            done
          done

      - name: Strictly rescore stored Gemma and Llama results
        run: |
          for file in \
            "$RUN_DIR/gemma2_latest_runtime_v06_controlled_screen.json" \
            "$RUN_DIR/gemma2_latest_candidate_v1_controlled_screen.json" \
            "$RUN_DIR/llama3.1_latest_runtime_v06_controlled_screen.json" \
            "$RUN_DIR/llama3.1_latest_candidate_v1_controlled_screen.json"
          do
            python scripts/run_gap_resilience_benchmark.py \
              --cases benchmarks/gap_resilience/cases.json \
              --rescore-input "$file" \
              --output "$file"
          done

      - name: Verify result semantics and add runtime provenance
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          run_dir = Path(os.environ["RUN_DIR"])
          expected_head = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          deepseek_paths = []
          for thinking in ("on", "off"):
              for profile in ("runtime_v06", "candidate_v1"):
                  path = run_dir / (
                      f"{os.environ['MODEL_SLUG']}_{profile}_think_{thinking}_controlled.json"
                  )
                  deepseek_paths.append(path)
                  report = json.loads(path.read_text(encoding="utf-8"))
                  assert report["artifact"] == "shadowseed-gap-resilience-v1"
                  assert report["run_type"] == "live_benchmark"
                  assert report["shadowseed_source_ref"] == expected_head
                  assert report["model_id"] == os.environ["MODEL_ID"]
                  assert report["model_revision"] == os.environ["MODEL_DIGEST"]
                  assert report["thinking_mode"] == thinking
                  assert report["scoring_policy"] == "strict_model_abstention_v2"
                  assert report["summary"]["cases"] == 8
                  assert sum(len(case["run_details"]) for case in report["cases"]) == 16
                  assert all(
                      detail["detector_raw_output"] is not None
                      and detail["detector_thinking_output"] is not None
                      for case in report["cases"]
                      for detail in case["run_details"]
                  )
                  report["runtime_provenance"] = {
                      "github_run_id": os.environ["GITHUB_RUN_ID"],
                      "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "runner_os": os.environ.get("RUNNER_OS"),
                      "runner_arch": os.environ.get("RUNNER_ARCH"),
                      "ollama_version": os.environ["OLLAMA_VERSION"],
                      "model_digest": os.environ["MODEL_DIGEST"],
                      "execution_note": (
                          "Quality screening on GitHub Linux runner; latency is not "
                          "representative of the user's laptop."
                      ),
                  }
                  path.write_text(
                      json.dumps(report, indent=2, ensure_ascii=False) + "\n",
                      encoding="utf-8",
                  )

          for path in (
              run_dir / "gemma2_latest_runtime_v06_controlled_screen.json",
              run_dir / "gemma2_latest_candidate_v1_controlled_screen.json",
              run_dir / "llama3.1_latest_runtime_v06_controlled_screen.json",
              run_dir / "llama3.1_latest_candidate_v1_controlled_screen.json",
          ):
              report = json.loads(path.read_text(encoding="utf-8"))
              assert report["scoring_policy"] == "strict_model_abstention_v2"
              assert (
                  report["summary"]["negative_control_abstention_definition"]
                  == "model_explicit_NONE_only"
              )

          print("verified", len(deepseek_paths), "DeepSeek arms plus strict Gemma/Llama rescoring")
          PY

      - name: Commit corrected benchmark results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR"
          git diff --cached --check
          git commit -m "Record strict laptop-model gap resilience follow-up"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Upload corrected benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laptop-gap-resilience-follow-up
          path: ${{ env.RUN_DIR }}/*.json
