name: Temporary live runtime hardening

on:
  push:
    branches:
      - agent/harden-live-runtime-english

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-live-runtime-english
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply reviewed hardening patch
        run: python .github/tmp_harden_live.py
      - name: Run targeted contracts
        run: >-
          python -m pytest -q
          tests/test_open_set_model_detector.py
          tests/test_live_runtime.py
          tests/test_live_session_measurement.py
          tests/test_ssl_session_suite.py
          tests/test_language_alignment.py
      - name: Lint changed Python
        run: >-
          python -m ruff check
          src/shadowseed/detection/model_detector.py
          src/shadowseed/surfacing.py
          src/shadowseed/chat.py
          src/shadowseed/benchmark/live_session_measurement.py
          tests/test_open_set_model_detector.py
          tests/test_live_runtime.py
          tests/test_live_session_measurement.py
          tests/test_language_alignment.py
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit materialized changes and remove temporary files
        shell: bash
        run: |
          rm .github/tmp_harden_live.py .github/workflows/tmp-harden-live-runtime.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'Harden English live runtime measurement'
          git push origin HEAD:agent/harden-live-runtime-english
