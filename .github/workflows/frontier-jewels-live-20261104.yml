name: Research - ShadowSeed frontier jewels live 2026-11-04

# One-shot, bounded paid experiment on this research branch.
# Triggered only by this workflow file's own initial push.
on:
  push:
    branches:
      - research/frontier-jewels-live-20261104
    paths:
      - .github/workflows/frontier-jewels-live-20261104.yml

permissions:
  contents: read

concurrency:
  group: research-frontier-jewels-live-20261104
  cancel-in-progress: false

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Compile and verify the frozen comparison design (no API calls)
        run: |
          python -m py_compile research/scripts/frontier_jewels_live_20261104.py
          python research/scripts/frontier_jewels_live_20261104.py --preflight

  bounded-live-run:
    needs: offline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: OpenAI key
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Require configured Environment key without printing it
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OpenAI key Environment has no OPENAI_KEY. No model requests sent."
            exit 1
          fi
      - name: Install Responses API SDK
        run: python -m pip install --disable-pip-version-check 'openai>=2,<4'
      - name: Execute bounded real GPT-6.1 Sol pilot (20 calls at most)
        run: |
          python research/scripts/frontier_jewels_live_20261104.py --output research-artifacts/frontier-jewels-live-20261104
      - name: Preserve real receipts and partial failures, never secret values
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-jewels-live-20261104
          path: research-artifacts/frontier-jewels-live-20261104/
          if-no-files-found: warn
          retention-days: 30
