name: Materialize finalization release hold

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-finalization-release-hold.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/finalization-release-hold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Hold automatic 0.5.0 publication during finalization
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/release-workbench.yml")
          text = path.read_text(encoding="utf-8")
          old = "      github.event.workflow_run.head_branch == 'main'\n"
          new = (
              "      github.event.workflow_run.head_branch == 'main' &&\n"
              "      false # temporary finalization hold; removed by the final release PR\n"
          )
          if text.count(old) != 1:
              raise SystemExit("release job guard did not match expected current-main contract")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify release job is disabled explicitly
        shell: python
        run: |
          from pathlib import Path
          text = Path(".github/workflows/release-workbench.yml").read_text(encoding="utf-8")
          assert "temporary finalization hold" in text
          assert "head_branch == 'main' &&" in text
          assert "false # temporary finalization hold" in text

      - name: Commit hold and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/materialize-finalization-release-hold.yml
          git add .github/workflows/release-workbench.yml \
            .github/workflows/materialize-finalization-release-hold.yml
          git diff --cached --check
          git commit -m "Hold release during finalization"
          git push origin HEAD:agent/finalization-release-hold
