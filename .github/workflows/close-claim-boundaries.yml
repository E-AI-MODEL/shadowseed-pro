name: Close claim-boundary assurance gaps

on:
  push:
    branches:
      - assurance/close-claim-boundaries
    paths:
      - .github/scripts/close_claim_boundaries.py
      - .github/workflows/close-claim-boundaries.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/close-claim-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Close claim-boundary assurance gaps
        run: |
          python .github/scripts/close_claim_boundaries.py
          python -m compileall -q src tests
      - name: Commit assurance cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten claim and assurance boundaries"
          git push origin HEAD:assurance/close-claim-boundaries
