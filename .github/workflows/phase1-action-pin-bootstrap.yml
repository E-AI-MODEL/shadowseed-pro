name: Phase 1 action pin bootstrap

# Temporary Phase 1 bootstrap. Remove before merge after all workflow refs are immutable.
on:
  push:
    branches:
      - production/phase-1-supply-chain-guardrails
    paths:
      - .github/workflows/phase1-action-pin-bootstrap.yml

permissions:
  contents: write

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production/phase-1-supply-chain-guardrails
          fetch-depth: 0
      - name: Replace mutable action refs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "actions/checkout@v7": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1",
              "actions/checkout@v4": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1",
              "actions/setup-python@v7": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7",
              "actions/setup-python@v5": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7",
              "actions/upload-artifact@v4": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2",
              "actions/download-artifact@v4": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0",
          }
          excluded = {
              "phase1-action-pin-bootstrap.yml",
              "phase1-lock-bootstrap.yml",
          }
          changed = []
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              if path.name in excluded:
                  continue
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))
          print("pinned", len(changed), "workflow files")
          for item in changed:
              print(item)
      - name: Commit pinned actions
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo "No mutable action refs remained"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git diff --cached --check
          git commit -m "Pin GitHub Actions to immutable revisions"
          git pull --rebase origin production/phase-1-supply-chain-guardrails
          git push origin HEAD:production/phase-1-supply-chain-guardrails
