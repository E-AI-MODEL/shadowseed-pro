name: Research - Inquiry-first paired live-model review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/inquiry_first_live_comparison.py"
      - "benchmarks/inquiry_first/cases.json"
      - ".github/workflows/inquiry-first-model-review.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact review head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install minimal comparison dependencies
        run: python -m pip install -e .
      - name: Start local Ollama and download explicit detector model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama-inquiry-review.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b-instruct
      - name: Pair real model prompts on frozen NL/EN cases
        run: |
          python scripts/inquiry_first_live_comparison.py \
            --model qwen2.5:3b-instruct \
            --output-dir /tmp/shadowseed-inquiry-first \
            --max-seeds 2 --max-new-tokens 420
      - name: Validate paired records without scoring usefulness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("/tmp/shadowseed-inquiry-first")
          m = json.loads((d / "manifest.json").read_text())
          records = json.loads((d / "raw_model_observations.json").read_text())
          reviews = json.loads((d / "blind_review_packet.json").read_text())
          assert m["review_status"] == "pending"
          assert m["blinding_assessment"]["status"] in ("masked_not_proven_blind", "compromised_by_arm_wide_abstention")
          assert not (d / "allocation_key_RESTRICT_REVIEWERS.json").exists()
          assert len(records) == 24 and len(reviews) == 12
          assert len({(x["case_id"], x["arm"]) for x in records}) == 24
          assert all(not any("arm" in v for v in item["candidates"]) for item in reviews)
          assert all(x["raw_output"] is not None for x in records)
          print("Paired model outputs collected. No human-quality claim.")
          PY
      - name: Upload audit traces and blind review material
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inquiry-first-v06-v07-review-and-raw
          path: /tmp/shadowseed-inquiry-first/
          if-no-files-found: warn
      - name: Upload separate restricted allocation key for study custodian
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inquiry-first-v06-v07-allocation-DO-NOT-SHARE-WITH-REVIEWERS
          path: /tmp/shadowseed-inquiry-first-allocation-restricted/
          if-no-files-found: warn
