name: Inspect contradiction domain

on:
  push:
    branches:
      - refactor/extract-contradictions
    paths:
      - .github/workflows/inspect-contradictions.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report contradiction references
        shell: bash
        run: |
          echo '=== manager contradiction references ==='
          grep -n -C 3 -i contradiction src/shadowseed/manager.py || true
          echo '=== source contradiction references ==='
          grep -RIn -C 2 -i contradiction src/shadowseed --exclude=manager.py || true
          echo '=== test contradiction references ==='
          grep -RIn -C 3 -i contradiction tests || true
          echo '=== manager definitions ==='
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('src/shadowseed/manager.py')
          source = path.read_text()
          tree = ast.parse(source)
          for node in tree.body:
              if isinstance(node, ast.ClassDef) and node.name == 'SSLManager':
                  for item in node.body:
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          text = item.name.lower()
                          body = ast.get_source_segment(source, item) or ''
                          if 'contradiction' in text or 'contradiction' in body.lower():
                              print(f'{item.lineno}-{item.end_lineno}: {item.name}')
          PY
