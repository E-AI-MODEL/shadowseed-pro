name: Research - validate immutable source artifact recovery (free)

on:
  push:
    branches:
      - research/q1q2-two-point-48-20261028
    paths:
      - .github/workflows/q1q2-source-recovery-once.yml

permissions:
  contents: read
  actions: read

jobs:
  source-only:
    if: ${{ github.event.before == 'e5922e59ae9540a19ec5323e690b22c8252375d8' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Download immutable original through official cross-run artifact reader
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: g0-dual-model-raw-owner-40542431712
          repository: E-AI-MODEL/shadowseed-pro
          run-id: 40542431712
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/immutable
      - name: Verify original SHA and all offline tests without a provider key
        env:
          LOCAL_OBSERVED: ${{ runner.temp }}/immutable/observed.json
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['LOCAL_OBSERVED'])
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "0a5094e38ab2fdcf8c68dc8d6a3c75d29eeffd49e1f6c8e138589ed73ca36bbf"
          print("SHA-256 matched; original owner content not printed")
          PY
          python -m unittest -q research.tests.test_q1q2_two_point_48
          python -m research.scripts.q1q2_two_point_48 \
            --observed "$LOCAL_OBSERVED" --output "$RUNNER_TEMP/dryrun" --dry-run
