name: Research MIT Shadow Memory replay

on:
  push:
    branches:
      - research/mit-shadow-memory-replay-20261103
    paths:
      - ".github/workflows/mit-shadow-memory-replay.yml"
      - "research/experiments/mit_shadow_memory_20261103/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      LIMIT: "12"
      OMP_NUM_THREADS: "2"
    steps:
      - name: Checkout immutable research branch version
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "sentence-transformers>=3,<6" "transformers>=4.51,<5" "huggingface_hub>=0.28,<1"
      - name: Retrieve and fingerprint MIT data at published commit
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/4d09ba6d6a7e891dd8063974dfe81b3d78e3494f/exp8_math/runs/p50c"
          mkdir -p mit-data/exp8_math/runs/p50c/readable mit-data/exp8_math/runs/p50c/work_notes
          curl -fL --retry 4 "$base/readable/trajectory.md" -o mit-data/exp8_math/runs/p50c/readable/trajectory.md
          curl -fL --retry 4 "$base/work_notes/experiment_history.md" -o mit-data/exp8_math/runs/p50c/work_notes/experiment_history.md
          curl -fL --retry 4 "$base/work_notes/final_report.md" -o mit-data/exp8_math/runs/p50c/work_notes/final_report.md
          test "$(git hash-object mit-data/exp8_math/runs/p50c/readable/trajectory.md)" = "caa2d040547e81677f98cccb1854769b1057f3b7"
          test "$(git hash-object mit-data/exp8_math/runs/p50c/work_notes/experiment_history.md)" = "c361b3b48e87db549482ab8d67de067c83196017"
          test "$(git hash-object mit-data/exp8_math/runs/p50c/work_notes/final_report.md)" = "568a8b52a9fddeaa1d71517eda83757e2ad83380"
      - name: Run real detector and ShadowseedEngine replay
        run: python -u research/experiments/mit_shadow_memory_20261103/run_replay.py
      - name: Upload exact replay records even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mit-shadowseed-replay-raw
          path: mit-replay-output/
          if-no-files-found: warn
