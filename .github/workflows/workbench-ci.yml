name: Workbench CI

on:
  pull_request:
    paths:
      - "src/shadowseed/application/**"
      - "src/shadowseed/workbench/**"
      - "src/shadowseed/cli.py"
      - "src/shadowseed/cli_dispatch.py"
      - "tests/test_workbench_*.py"
      - "pyproject.toml"
      - ".github/workflows/workbench-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/shadowseed/application/**"
      - "src/shadowseed/workbench/**"
      - "src/shadowseed/cli.py"
      - "src/shadowseed/cli_dispatch.py"
      - "tests/test_workbench_*.py"
      - "pyproject.toml"
      - ".github/workflows/workbench-ci.yml"

permissions:
  contents: read

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  workbench:
    name: workbench (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,workbench]"
      - run: ruff check src/shadowseed/application src/shadowseed/workbench tests/test_workbench_*.py
      - run: pytest -q tests/test_workbench_*.py
      - name: CLI contract
        run: |
          shadowseed workbench --help
          shadowseed doctor --workspace "${RUNNER_TEMP}/shadowseed-doctor"
          shadowseed init --workspace "${RUNNER_TEMP}/shadowseed-init"
      - name: Headless UI build
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from shadowseed.workbench.app import build_app

          with tempfile.TemporaryDirectory() as tmp:
              app = build_app(Path(tmp) / "workspace")
              assert app is not None
          print("Workbench Blocks build OK")
          PY

  package-extra:
    name: workbench wheel extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install built wheel with Workbench dependency
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m venv "${RUNNER_TEMP}/workbench-wheel"
          "${RUNNER_TEMP}/workbench-wheel/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/workbench-wheel/bin/pip" install "httpx[socks]==0.27.2"
          "${RUNNER_TEMP}/workbench-wheel/bin/pip" install "${wheel}[workbench]"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/workbench-wheel/bin/shadowseed" workbench --help
          ALL_PROXY="socks5h://127.0.0.1:9" \
            "${RUNNER_TEMP}/workbench-wheel/bin/python" - <<'PY'
          import gradio
          import httpx
          from packaging.version import Version
          from shadowseed.workbench.app import build_app
          assert Version(httpx.__version__) >= Version("0.28.0")
          print("installed Workbench SOCKS-proxy import OK", gradio.__version__)
          PY
