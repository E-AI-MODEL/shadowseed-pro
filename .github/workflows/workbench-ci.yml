name: Temporary - materialize final Workbench fixes

on:
  push:
    branches:
      - agent/chat-first-ssl-product
    paths:
      - .github/workflows/workbench-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/workbench-ci.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-first-ssl-product
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact final fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/shadowseed/workbench/app.py')
          text = app.read_text(encoding='utf-8')
          old = 'gr.Chatbot(type="messages", label="Conversation", height=500)'
          new = 'gr.Chatbot(label="Conversation", height=500)'
          if text.count(old) == 1:
              text = text.replace(old, new)
          elif old not in text and new in text:
              pass
          else:
              raise SystemExit('unexpected Chatbot constructor state')
          app.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old_block = '''The 0.4 tester preview adds a local, single-user Workbench for practical testing
without writing Python code:

```bash
pip install -e ".[workbench]"
shadowseed doctor
shadowseed init
shadowseed workbench
```

The supported native server binds to `127.0.0.1` by default. Testers can create
live or evaluation sessions, choose an embedding backend, inspect stored seed
decisions, submit explicitly verified support to the existing Validation Gate,
record separate audit-only feedback, import scenarios, and export verified
reports or privacy-minimized support bundles. Baseline/SSL comparison is limited
to evaluation sessions because live mode intentionally performs one generation.
The Workbench is a tester product layer over the existing runtime; it is not a
second Validation Gate and does not turn ordinary tester observations into
scientific evidence.
'''
          new_block = '''The Workbench is a local, single-user chat surface for testing Shadow Seed
Learning without writing Python code or authoring benchmark inputs:

```bash
pip install -e ".[workbench]"
shadowseed doctor
shadowseed init
shadowseed workbench
```

The supported native server binds to `127.0.0.1` by default. A newly created
ordinary chat uses the product-oriented `live` runtime and the evidence-backed
Gate policy. The tester chooses a model and chats normally. For any message they
may enable **Compare this message with SSL off**; the Workbench then generates a
paired no-SSL control from the same pre-turn visible history and model
configuration before executing the real live turn. The control is comparison
data only: it does not enter candidate detection, recurrence, the Gate, or later
conversation history. A textual difference is attributable to SSL only when an
authorized seed actually surfaced on the real turn.

Historical `evaluation` sessions, authored baseline fixtures, scenario JSON and
benchmark outputs remain available for research and regression under Advanced;
they are not prerequisites for ordinary testing. Seed inspection, independently
verified support, audit-only feedback and verified exports remain available as
secondary tools. The Workbench is a product surface over the existing runtime;
it is not a second Validation Gate and does not turn ordinary tester observations
into scientific evidence.
'''
          if text.count(old_block) == 1:
              text = text.replace(old_block, new_block)
          elif old_block not in text and 'Compare this message with SSL off' in text:
              pass
          else:
              raise SystemExit('unexpected README Workbench block state')
          if 'Baseline/SSL comparison is limited' in text:
              raise SystemExit('obsolete README claim remains')
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Install Workbench stack
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          GRADIO_ANALYTICS_ENABLED: 'False'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,workbench]'
      - name: Verify Workbench and product contracts
        env:
          GRADIO_ANALYTICS_ENABLED: 'False'
        run: |
          ruff check src/shadowseed/application src/shadowseed/workbench tests/test_workbench_*.py tests/test_chat_first_product.py tests/test_chat_product_language.py
          pytest -q tests/test_workbench_*.py tests/test_chat_first_product.py tests/test_chat_product_language.py
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from shadowseed.workbench.app import build_app
          with tempfile.TemporaryDirectory() as tmp:
              assert build_app(Path(tmp) / 'workspace') is not None
          print('headless Workbench build OK')
          PY
          git diff --check
          grep -F 'Compare this message with SSL off' README.md
          ! grep -F 'Baseline/SSL comparison is limited' README.md
      - name: Commit verified materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/shadowseed/workbench/app.py
          git diff --cached --check
          git commit -m 'Finalize chat-first Workbench compatibility'
          git pull --rebase origin agent/chat-first-ssl-product
          git push origin HEAD:agent/chat-first-ssl-product
