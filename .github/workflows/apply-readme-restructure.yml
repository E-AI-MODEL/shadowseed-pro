name: Apply README progressive disclosure

on:
  push:
    branches:
      - agent/restructure-readme
    paths:
      - .github/workflows/apply-readme-restructure.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restructure-readme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write README and regression guard
        shell: bash
        env:
          README_GZ_B64: 
          TEST_GZ_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('README.md').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['README_GZ_B64']))
          )
          Path('tests/test_claim_boundaries.py').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['TEST_GZ_B64']))
          )

          workflow = Path('.github/workflows/apply-readme-restructure.yml')
          workflow.unlink()
          PY

      - name: Validate documentation changes
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          ruff check .
          pytest -q

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_claim_boundaries.py .github/workflows/apply-readme-restructure.yml
          git commit -m "Restructure README for progressive disclosure"
          git push origin HEAD:agent/restructure-readme
