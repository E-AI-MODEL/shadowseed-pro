name: Standalone Workbench

on:
  pull_request:
    paths:
      - "src/shadowseed/**"
      - "tests/test_workbench_*.py"
      - "tests/test_standalone_license_packaging.py"
      - "scripts/build_standalone.py"
      - "scripts/pyinstaller_hooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - ".gitattributes"
      - "docs/workbench/**"
      - ".github/workflows/standalone-workbench.yml"
      - ".github/workflows/release-workbench.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADIO_ANALYTICS_ENABLED: "False"
  PYTHONUNBUFFERED: "1"

jobs:
  quality-gate:
    name: Product quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Install locked test and Workbench stack
        run: uv sync --locked --extra test --extra workbench
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Full repository tests and branch coverage
        run: >-
          uv run --no-sync python -m pytest -q
          --cov=shadowseed --cov=shadowseed_agent --cov-branch
          --cov-report=term-missing --cov-fail-under=80
      - name: Standalone launcher and license tests
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_workbench_standalone.py
          tests/test_standalone_license_packaging.py
      - name: Checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  build:
    name: ${{ matrix.label }} standalone
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: standalone-linux
          - os: windows-latest
            label: Windows
            artifact: standalone-windows
          - os: macos-latest
            label: macOS
            artifact: standalone-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Install locked Workbench and frozen-build tooling
        run: uv sync --locked --extra workbench --extra standalone-build
      - name: Build and execute frozen self-test
        env:
          SHADOWSEED_SOURCE_SHA: ${{ github.sha }}
        run: uv run --no-sync python scripts/build_standalone.py --output-dir release-assets
      - name: Validate release manifest
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          manifests = list(root.glob("*.manifest.json"))
          archives = [p for p in root.iterdir() if p.is_file() and not p.name.endswith(".manifest.json")]
          assert len(manifests) == 1, manifests
          assert len(archives) == 1, archives
          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          archive = root / manifest["archive"]
          assert archive == archives[0]
          assert manifest["source_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["self_contained_python_runtime"] is True
          assert manifest["loopback_only_default"] is True
          assert manifest["model_weights_bundled"] is False
          assert manifest["self_test"]["frozen"] is True
          assert manifest["self_test"]["runtime_mode"] == "live"
          assert manifest["license_identifier"] == "PolyForm-Noncommercial-1.0.0"
          assert manifest["license_file"]
          expected_license = hashlib.sha256(Path("LICENSE").read_bytes()).hexdigest()
          assert manifest["license_sha256"] == expected_license
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == manifest["archive_sha256"]
          print(json.dumps(manifest, indent=2, sort_keys=True))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
