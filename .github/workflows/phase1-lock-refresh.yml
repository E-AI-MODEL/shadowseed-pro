name: Phase 1 lock refresh

# Temporary PR-only helper. Remove before merge.
on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/phase1-lock-refresh.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Resolve lock from project policy
        run: uv lock
      - name: Verify lock changed when project metadata changed
        shell: bash
        run: |
          set -euo pipefail
          test -f uv.lock
          git diff --check -- uv.lock
      - name: Upload refreshed lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase1-refreshed-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
