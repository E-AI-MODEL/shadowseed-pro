name: Phase 1 lock refresh

# Temporary branch-only helper. Remove before merge.
on:
  push:
    branches:
      - production/phase-1-supply-chain-guardrails
    paths:
      - pyproject.toml
      - .github/workflows/phase1-lock-refresh.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production/phase-1-supply-chain-guardrails
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Resolve lock from project policy
        run: uv lock
      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --check
          git commit -m "Refresh Phase 1 dependency lock"
          git pull --rebase origin production/phase-1-supply-chain-guardrails
          git push origin HEAD:production/phase-1-supply-chain-guardrails
