name: Clean contradiction extraction formatting

on:
  push:
    branches:
      - refactor/extract-contradictions
    paths:
      - .github/workflows/cleanup-contradiction-extraction.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-contradictions
          fetch-depth: 0
      - name: Remove trailing whitespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "src/shadowseed/contradictions.py",
              "src/shadowseed/gate/contradictions.py",
              "src/shadowseed/manager.py",
              "tests/test_contradictions_extraction.py",
          ):
              path = Path(name)
              lines = path.read_text().splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n")
          Path(".github/workflows/cleanup-contradiction-extraction.yml").unlink()
          PY
          ruff check .
          pytest -q
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "EAI"
          git config user.email "vis@emmauscollege.nl"
          git add \
            src/shadowseed/contradictions.py \
            src/shadowseed/gate/contradictions.py \
            src/shadowseed/manager.py \
            tests/test_contradictions_extraction.py \
            .github/workflows/cleanup-contradiction-extraction.yml
          git commit -m "Clean contradiction extraction formatting"
          git push origin HEAD:refactor/extract-contradictions
