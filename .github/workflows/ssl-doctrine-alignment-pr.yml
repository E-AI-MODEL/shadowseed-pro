name: Research - SSL doctrine alignment PR materialization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ssl-doctrine-alignment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    if: github.head_ref == 'agent/ssl-doctrine-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out alignment branch
        uses: actions/checkout@v4
        with:
          ref: agent/ssl-doctrine-alignment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize reviewed runtime changes
        run: python tools/materialize_ssl_doctrine_alignment.py

      - name: Install test and Workbench dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test,workbench]"

      - name: Run doctrine and focused regressions
        run: >-
          pytest -q
          tests/test_ssl_doctrine_alignment.py
          tests/test_live_runtime.py
          tests/test_gate_signal_routing.py
          tests/test_surfacing.py
          tests/test_atomic_seed_rules.py
          tests/test_workbench_*.py

      - name: Run full branch-coverage suite
        run: >-
          pytest -q
          --cov=shadowseed
          --cov=shadowseed_agent
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Run Ruff and whitespace checks
        run: |
          ruff check .
          git diff --check

      - name: Build package
        run: python -m build

      - name: Clean wheel install and CLI smoke
        run: |
          python -m venv /tmp/ssl-alignment-wheel
          /tmp/ssl-alignment-wheel/bin/python -m pip install --upgrade pip
          /tmp/ssl-alignment-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ssl-alignment-wheel/bin/shadowseed --help
          /tmp/ssl-alignment-wheel/bin/python -c "import shadowseed, shadowseed_agent; print('clean wheel import OK')"

      - name: Commit verified materialization to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/shadowseed/chat.py \
            src/shadowseed/benchmark/live_session_measurement.py \
            src/shadowseed/intake.py \
            src/shadowseed/core_config.py \
            src/shadowseed/surfacing.py \
            src/shadowseed/models.py \
            src/shadowseed/gate/runtime_adapter.py \
            src/shadowseed/storage/sqlite.py \
            docs/architecture/overview.md \
            docs/architecture/gate-contracts.md \
            docs/architecture/adr/ADR-001-validation-gate-authority.md \
            docs/workbench/README.md
          git diff --cached --check
          git commit -m "Align runtime with SSL doctrine ADRs"
          git push origin HEAD:agent/ssl-doctrine-alignment
