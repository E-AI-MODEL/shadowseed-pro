name: Phase 1 lock bootstrap

# Temporary Phase 1 bootstrap. Remove before merge after the final uv.lock is committed.
on:
  push:
    branches:
      - production/phase-1-supply-chain-guardrails
    paths:
      - pyproject.toml
      - .github/workflows/phase1-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production/phase-1-supply-chain-guardrails
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.14"
      - name: Resolve universal project lock
        run: uv lock
      - name: Commit lock if it changed
        shell: bash
        run: |
          set -euo pipefail
          if test -f uv.lock && git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --check
          git commit -m "Lock Phase 1 Python dependencies"
          git push origin HEAD:production/phase-1-supply-chain-guardrails
