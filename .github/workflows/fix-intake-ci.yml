name: Fix intake CI

on:
  push:
    branches:
      - refactor/extract-intake
    paths:
      - .github/scripts/fix_intake_ci.py
      - .github/workflows/fix-intake-ci.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-intake
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix test ownership expectations
        run: |
          python .github/scripts/fix_intake_ci.py
          python -m compileall -q src tests
      - name: Commit CI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align intake tests with extracted ownership"
          git push origin HEAD:refactor/extract-intake
