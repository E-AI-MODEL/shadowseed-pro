name: Cancel stale release runs

on:
  push:
    branches:
      - "release/**"

permissions:
  actions: write
  contents: read

concurrency:
  group: stale-release-cleanup-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: macos-latest
    steps:
      - name: Cancel older runs for this release branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs?branch=$BRANCH&per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting") and .head_sha != env.CURRENT_SHA) | .id' \
            | sort -u \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Cancelling stale run $run_id"
                gh api -X POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null || true
              done
