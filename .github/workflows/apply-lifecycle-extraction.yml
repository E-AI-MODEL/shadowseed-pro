name: Render lifecycle extraction

on:
  push:
    branches:
      - refactor/extract-lifecycle
    paths:
      - .github/scripts/apply_lifecycle_extraction.py
      - .github/workflows/apply-lifecycle-extraction.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render lifecycle extraction
        run: |
          python .github/scripts/apply_lifecycle_extraction.py
          python -m compileall -q src tests
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-extraction
          path: |
            README.md
            docs/architecture/overview.md
            src/shadowseed/lifecycle.py
            src/shadowseed/manager.py
            tests/test_gate_boundary_completion.py
            tests/test_lifecycle_extraction.py
