name: Apply vector workflow extraction

on:
  push:
    branches:
      - refactor/extract-vector-workflows
    paths:
      - .github/scripts/apply_vector_workflows_extraction.py
      - .github/workflows/apply-vector-workflows-extraction.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-vector-workflows
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply vector workflow extraction
        run: |
          python .github/scripts/apply_vector_workflows_extraction.py
          python -m compileall -q src tests
      - name: Commit vector workflow extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract vector and constellation workflows"
          git push origin HEAD:refactor/extract-vector-workflows
