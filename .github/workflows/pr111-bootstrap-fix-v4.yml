name: PR 111 bootstrap fix v4

on:
  push:
    branches:
      - fix/production-local-integrity-guards
    paths:
      - .github/workflows/pr111-bootstrap-fix-v4.yml

permissions:
  contents: write

env:
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/production-local-integrity-guards
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.14"
      - name: Apply corrected protected bootstrap patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/pr111-bootstrap-fix-v3.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Sync locked test environment"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])

          script = script.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\nfrom textwrap import indent\n',
              1,
          )
          script = script.replace(
              "marker_block = r'''    def _ensure_durable_directory",
              "marker_block = indent(r'''def _ensure_durable_directory",
              1,
          )
          script = script.replace(
              "\n'''\ntext = text[:start] + marker_block + text[end:]",
              "\n''', '    ')\ntext = text[:start] + marker_block + text[end:]",
              1,
          )
          script = script.replace(
              "bind_block = '''    def bind_production(",
              "bind_block = indent('''def bind_production(",
              1,
          )
          script = script.replace(
              "\n'''\ntext = text[:start] + bind_block + text[end:]",
              "\n''', '    ')\ntext = text[:start] + bind_block + text[end:]",
              1,
          )
          script = script.replace(
              "genesis_block = '''    def _create_production_genesis(",
              "genesis_block = indent('''def _create_production_genesis(",
              1,
          )
          script = script.replace(
              "\n'''\ntext = text[:start] + genesis_block + text[end:]",
              "\n''', '    ')\ntext = text[:start] + genesis_block + text[end:]",
              1,
          )

          required = (
              "marker_block = indent(r'''def _ensure_durable_directory",
              "bind_block = indent('''def bind_production(",
              "genesis_block = indent('''def _create_production_genesis(",
          )
          if not all(token in script for token in required):
              raise SystemExit('corrected indentation patch guard not satisfied')
          compile(script, '<pr111-bootstrap-patch>', 'exec')
          namespace = {'__name__': '__main__'}
          exec(compile(script, '<pr111-bootstrap-patch>', 'exec'), namespace, namespace)
          PY
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run targeted regressions
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Lint changed Python files
        run: >-
          uv run --no-sync ruff check
          src/shadowseed/storage/sqlite.py
          src/shadowseed/storage/integrity.py
          src/shadowseed/application/operations.py
          tests/test_production_persistence_phase3.py
          tests/test_gate_boundary_completion.py
          tests/test_production_operations_phase4.py
      - name: Commit tested code only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/storage/sqlite.py tests/test_production_persistence_phase3.py
          git commit -m "fix: bind bootstrap recovery to durable protected state"
          git push origin HEAD:fix/production-local-integrity-guards
