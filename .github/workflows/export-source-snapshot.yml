name: Export source snapshot

on:
  push:
    branches:
      - agent/workbench-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude=.git -czf /tmp/shadowseed-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: shadowseed-source-snapshot
          path: /tmp/shadowseed-source.tar.gz
          retention-days: 1
