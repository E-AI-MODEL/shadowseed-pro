name: Fix Gradio 6 Workbench API

on:
  push:
    branches: [feature/workbench-ui]
    paths: [.github/workflows/fix-gradio6-workbench.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workbench-ui
          fetch-depth: 0
      - name: Remove obsolete Chatbot type parameter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/shadowseed/workbench/app.py")
          text = path.read_text(encoding="utf-8")
          old = 'gr.Chatbot(label="Conversation", type="messages", height=460)'
          new = 'gr.Chatbot(label="Conversation", height=460)'
          if text.count(old) != 1:
              raise SystemExit(f"expected Chatbot marker once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-gradio6-workbench.yml
          python -m compileall -q src/shadowseed/workbench
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/workbench/app.py .github/workflows/fix-gradio6-workbench.yml
          git commit -m "Use Gradio 6 message-based Chatbot API"
          git push origin HEAD:feature/workbench-ui
