name: Preserve contradiction facade call paths

on:
  push:
    branches:
      - refactor/extract-contradictions
    paths:
      - .github/workflows/preserve-contradiction-facade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-contradictions
          fetch-depth: 0
      - name: Patch manager facade delegation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/shadowseed/manager.py")
          source = path.read_text()

          replacements = (
              (
                  "        return self._contradictions.state_for(self._seeds[seed_id]).blocking\n",
                  "        return self._contradiction_state(self._seeds[seed_id]).blocking\n",
              ),
              (
                  "            resolved_at=self._now_iso,\n        )\n",
                  "            resolved_at=self._now_iso,\n"
                  "            open_records=self.open_contradictions(seed_id),\n"
                  "        )\n",
              ),
              (
                  "        return self._contradictions.migrate_legacy(\n"
                  "            self._seeds.values(),\n"
                  "            created_at=self._now_iso,\n"
                  "        )\n",
                  "        return self._contradictions.migrate_legacy(\n"
                  "            self._seeds.values(),\n"
                  "            records_for=self.contradictions_for,\n"
                  "            open_record=self._open_contradiction_record,\n"
                  "        )\n",
              ),
              (
                  "            \"contradiction_records\": self._contradictions.to_dicts(),\n",
                  "            \"contradiction_records\": [\n"
                  "                item.to_dict() for item in self.contradiction_records\n"
                  "            ],\n",
              ),
          )
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"manager replacement not found: {old!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          Path(".github/workflows/preserve-contradiction-facade.yml").unlink()
          PY
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
          ruff check .
          pytest -q
          python -m build
      - name: Commit facade preservation
        shell: bash
        run: |
          git config user.name "EAI"
          git config user.email "vis@emmauscollege.nl"
          git add src/shadowseed/manager.py .github/workflows/preserve-contradiction-facade.yml
          git commit -m "Preserve contradiction facade call paths"
          git push origin HEAD:refactor/extract-contradictions
