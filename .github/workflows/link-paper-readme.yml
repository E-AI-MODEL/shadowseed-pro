name: Update paper links

on:
  push:
    branches:
      - agent/link-shadowseed-paper

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply README updates
        run: python .github/update-paper-readme.py
      - name: Commit clean result
        run: |
          rm -f .github/update-paper-readme.py .github/workflows/link-paper-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md paper/README.md .github/update-paper-readme.py .github/workflows/link-paper-readme.yml
          git diff --cached --check
          git commit -m "Link research paper from README"
          git push origin HEAD:agent/link-shadowseed-paper
