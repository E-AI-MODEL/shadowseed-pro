name: Research - One-shot six-case raw A/B integrity audit (offline)

# No provider secrets. Re-fetch an immutable existing Action artifact.
# Never rerun the failed/partial 67-call experiment.
on:
  push:
    branches:
      - research/g0-multicase-real-ab-20261026
    paths:
      - .github/workflows/g0-multicase-real-ab-audit-offline.yml

permissions:
  contents: read
  actions: read

jobs:
  exact-archive-audit:
    if: github.event.before == '481263ad9b355a40738b6eb0a1c9f2c465a8b621' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.1.4
      - name: Install locked research environment
        run: |
          uv sync --locked --extra test
          uv pip install --python .venv/bin/python --no-deps -e ./research
          mkdir -p research-artifacts/multicase-audit/source
      - name: No-network auditor negative/regression tests
        run: |
          uv run --no-sync python -m pytest -q research/tests/test_g0_multicase_ab_integrity.py -x
      - name: Fetch original 67-call partial artifact (not a new model run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40402783698 --repo E-AI-MODEL/shadowseed-pro \
            --name multicase-real-ab-raw-owner-40402783698 \
            --dir research-artifacts/multicase-audit/source
          test -s research-artifacts/multicase-audit/source/observed.json
          echo "b56f03d9fe7a18011812db7d88e7b62b5b63b9724f6e2d3e77dad4fc8876e505  research-artifacts/multicase-audit/source/observed.json" | sha256sum -c -
      - name: Check original six case census, exact paired hashes, and all fail/no-birth classes
        run: |
          uv run --no-sync python research/scripts/g0_multicase_ab_integrity.py \
            --observed research-artifacts/multicase-audit/source/observed.json \
            --fixture research/fixtures/g0_multicase_real_ab_v1.json \
            --expected-observed-sha256 b56f03d9fe7a18011812db7d88e7b62b5b63b9724f6e2d3e77dad4fc8876e505 \
            --output research-artifacts/multicase-audit/summary.json
      - name: Preserve only no-secret source and method summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multicase-real-ab-integrity-${{ github.run_id }}
          path: research-artifacts/multicase-audit/summary.json
          if-no-files-found: warn
          retention-days: 30
