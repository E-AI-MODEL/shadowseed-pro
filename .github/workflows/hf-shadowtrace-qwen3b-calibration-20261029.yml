name: Research - HF Qwen2.5-3B Shadow Trace calibration (one shot)
on:
  push:
    branches:
      - research/hf-shadowtrace-3b-calibration-20261029
    paths:
      - research/scripts/hf_shadowtrace_qwen3b_calibration_20261029.py
      - .github/workflows/hf-shadowtrace-qwen3b-calibration-20261029.yml
permissions:
  contents: read
jobs:
  shadowtrace-3b-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SHADOWTRACE_TURNS: "4"
      SHADOWTRACE_OUT: ${{ github.workspace }}/output/shadowtrace_qwen3b_calibration.json
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU-only torch
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install unchanged Shadowseed source and HF model adapters
        run: |
          python -m pip install -e . "sentence-transformers>=2.7" "transformers>=4.51,<5" "huggingface_hub>=0.35,<1"
      - name: Verify original Shadowseed pipeline and research script
        run: |
          python -m py_compile research/scripts/hf_shadowtrace_qwen3b_calibration_20261029.py
          python -c "from shadowseed.engine import ShadowseedEngine; from shadowseed.adapters.models import HFTransformersBackend; from shadowseed.detection.model_detector import HFTransformersDetectorBackend; print('source imports OK')"
      - name: Run bounded 3B longitudinal instrument calibration
        run: |
          python research/scripts/hf_shadowtrace_qwen3b_calibration_20261029.py
      - name: Preserve complete synthetic prompts, answers and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-shadowtrace-qwen3b-calibration-raw-20261029
          path: output/shadowtrace_qwen3b_calibration.json
          retention-days: 14
          if-no-files-found: warn
