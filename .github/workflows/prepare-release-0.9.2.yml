name: Prepare 0.9.2 release repair

on:
  push:
    branches:
      - release/0.9.2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: E-AI-MODEL/shadowseed-pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.9.2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.14"
      - name: Remove malformed manual v0.9.2 release and tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.2 >/dev/null 2>&1; then
            gh release delete v0.9.2 --cleanup-tag --yes
          elif gh api repos/E-AI-MODEL/shadowseed-pro/git/ref/tags/v0.9.2 >/dev/null 2>&1; then
            gh api -X DELETE repos/E-AI-MODEL/shadowseed-pro/git/refs/tags/v0.9.2
          fi
          if gh release view v0.9.2 >/dev/null 2>&1; then
            echo "v0.9.2 release still exists" >&2
            exit 1
          fi
          if gh api repos/E-AI-MODEL/shadowseed-pro/git/ref/tags/v0.9.2 >/dev/null 2>&1; then
            echo "v0.9.2 tag still exists" >&2
            exit 1
          fi
      - name: Refresh lock for 0.9.2
        run: uv lock
      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "Refresh lock for 0.9.2"
          git push origin HEAD:release/0.9.2
