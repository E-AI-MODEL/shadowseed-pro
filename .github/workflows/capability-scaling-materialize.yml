name: Research - capability scaling harness materialization

on:
  push:
    branches:
      - agent/post-alignment-capability-scaling
    paths:
      - .github/workflows/capability-scaling-materialize.yml

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODULE_B64: 
      TEST_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-alignment-capability-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Materialize reviewed harness and tests
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          targets = {
              "src/shadowseed/benchmark/capability_scaling.py": os.environ["MODULE_B64"],
              "tests/test_capability_scaling.py": os.environ["TEST_B64"],
          }
          for target, encoded in targets.items():
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
      - name: Run focused capability and doctrine regressions
        run: |
          pytest -q \
            tests/test_capability_scaling.py \
            tests/test_ssl_doctrine_alignment.py \
            tests/test_live_runtime.py \
            tests/test_point_of_use.py
      - name: Run full branch-coverage suite
        run: |
          pytest -q \
            --cov=shadowseed \
            --cov=shadowseed_agent \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=80
      - name: Run static and whitespace checks
        run: |
          ruff check .
          git diff --check
          python -m shadowseed.benchmark.capability_scaling --help
      - name: Build package
        run: python -m build
      - name: Commit only after verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/benchmark/capability_scaling.py tests/test_capability_scaling.py
          git diff --cached --check
          git commit -m "Add post-alignment capability scaling harness"
          git push origin HEAD:agent/post-alignment-capability-scaling
