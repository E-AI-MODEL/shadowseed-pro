name: Web Client CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "src/shadowseed_webapi/**"
      - "tests/test_webapi_service.py"
      - ".github/workflows/web-client-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/shadowseed_webapi/**"
      - "tests/test_webapi_service.py"
      - ".github/workflows/web-client-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --ignore-scripts
      - name: Build web product client
        working-directory: apps/web
        run: npm run build

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Test web API contract
        run: uv run --no-sync python -m pytest -q tests/test_webapi_service.py
