name: Materialize paper sources

on:
  push:
    branches:
      - agent/add-shadowseed-paper
    paths:
      - .github/paper-main.part00
      - .github/paper-main.part01
      - .github/paper-main.part02
      - .github/paper-main.part03
      - .github/paper-main.part04
      - .github/workflows/materialize-paper.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and verify canonical paper sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper
          cat \
            .github/paper-main.part00 \
            .github/paper-main.part01 \
            .github/paper-main.part02 \
            .github/paper-main.part03 \
            .github/paper-main.part04 \
            > paper/main.tex

          echo "3de113632cb43e5e7d887a22c76ad2afd94fd6b0c4c3a5d965e93aa83102194b  paper/main.tex" | sha256sum -c -
          echo "eb9368ccf618e89b26482ef6f6ea3cfc7b058bab3298f6ef46187111c738b482  paper/references.bib" | sha256sum -c -
          echo "4551b0a486aaa5245e50e12856c806958206ffa2f5957de06b33fd1651daff55  paper/README.md" | sha256sum -c -

          rm -f \
            .github/paper-src.b64 \
            .github/paper-src.part* \
            .github/paper-main.part* \
            .github/workflows/materialize-paper.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github paper
          git diff --cached --check
          git commit -m "Add Shadowseed paper sources"
          git push origin HEAD:agent/add-shadowseed-paper
