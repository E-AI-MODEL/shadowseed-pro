name: Temporary 0.7.0 lock generation

on:
  push:
    branches: ["chore/release-0.7.0"]
    paths:
      - ".github/workflows/release-version-bump-temp.yml"

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'E-AI-MODEL/shadowseed-pro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/release-0.7.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Set exact project version
        shell: python
        run: |
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = 'version = "0.6.0"'
          new = 'version = "0.7.0"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one {old!r} record")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Regenerate and verify lock
        run: |
          uv lock
          uv lock --check
          python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          assert project["project"]["version"] == "0.7.0"
          matches = [
              package for package in lock.get("package", [])
              if package.get("name") == "shadowseed"
          ]
          if len(matches) != 1 or matches[0].get("version") != "0.7.0":
              raise SystemExit(f"unexpected shadowseed lock record: {matches!r}")
          PY
      - name: Remove temporary generator and commit final metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-version-bump-temp.yml
          git add pyproject.toml uv.lock
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare 0.7.0 production-local candidate"
          git push origin HEAD:chore/release-0.7.0
