name: Apply scenario resume UI

on:
  push:
    branches: [fix/workbench-0.4.1-review-followups]
    paths: [.github/workflows/apply-scenario-resume-ui.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workbench-0.4.1-review-followups
          fetch-depth: 0
      - name: Apply exact UI patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/shadowseed/workbench/app.py")
          text = path.read_text(encoding="utf-8")

          old_handler = '''    def run_scenario(scenario_json: str, external_confirmed: bool):\n        try:\n            result = ctl.run_scenario(\n                scenario_json,\n                external_confirmed=external_confirmed,\n            )\n            session_id = str(result["session_id"])\n            return (\n                result,\n                f"Scenario completed into resumable session `{session_id}`.",\n                dropdown_update(session_id),\n            )\n        except Exception as exc:\n            raise gr.Error(str(exc)) from exc\n\n'''
          new_handler = '''    def scenario_status(result: dict[str, Any]) -> str:\n        session_id = str(result["session_id"])\n        if result.get("complete"):\n            return (\n                f"Scenario completed: **{result['completed']}/{result['total']}** questions "\n                f"in resumable session `{session_id}`."\n            )\n        return (\n            f"Scenario paused after **{result['completed']}/{result['total']}** completed "\n            f"questions. Failure: `{result.get('error') or 'unknown error'}`. "\n            f"Resume from index **{result['next_at']}** to retry the failed question without "\n            "replaying completed turns."\n        )\n\n    def run_scenario(scenario_json: str, external_confirmed: bool):\n        try:\n            result = ctl.run_scenario(\n                scenario_json,\n                external_confirmed=external_confirmed,\n            )\n            session_id = str(result["session_id"])\n            return (\n                result,\n                scenario_status(result),\n                dropdown_update(session_id),\n                int(result["next_at"]),\n            )\n        except Exception as exc:\n            raise gr.Error(str(exc)) from exc\n\n    def resume_scenario(\n        scenario_json: str,\n        session_id: str | None,\n        start_at: float,\n        external_confirmed: bool,\n    ):\n        if not session_id:\n            raise gr.Error("Select the partial scenario session first.")\n        try:\n            result = ctl.resume_scenario(\n                scenario_json,\n                session_id,\n                start_at=int(start_at),\n                external_confirmed=external_confirmed,\n            )\n            return (\n                result,\n                scenario_status(result),\n                dropdown_update(session_id),\n                int(result["next_at"]),\n            )\n        except Exception as exc:\n            raise gr.Error(str(exc)) from exc\n\n'''
          if text.count(old_handler) != 1:
              raise SystemExit(f"scenario handler marker count={text.count(old_handler)}")
          text = text.replace(old_handler, new_handler, 1)

          old_ui = '''            with gr.Row():\n                scenario_parse = gr.Button("Validate")\n                scenario_run = gr.Button("Run scenario", variant="primary")\n            scenario_result = gr.JSON(label="Scenario")\n            scenario_status = gr.Markdown()\n            scenario_session = gr.Dropdown(label="Created session", choices=initial_sessions)\n            scenario_parse.click(fn=parse_scenario, inputs=scenario_json, outputs=scenario_result)\n            scenario_run.click(\n                fn=run_scenario,\n                inputs=[scenario_json, scenario_external_confirm],\n                outputs=[scenario_result, scenario_status, scenario_session],\n            )\n'''
          new_ui = '''            with gr.Row():\n                scenario_parse = gr.Button("Validate")\n                scenario_run = gr.Button("Run new scenario", variant="primary")\n                scenario_resume = gr.Button("Resume partial scenario")\n            scenario_result = gr.JSON(label="Scenario")\n            scenario_status_output = gr.Markdown()\n            scenario_session = gr.Dropdown(label="Scenario session", choices=initial_sessions)\n            scenario_resume_at = gr.Number(\n                label="Resume index",\n                value=0,\n                precision=0,\n                info="Filled automatically after a partial run; persisted progress is authoritative.",\n            )\n            scenario_parse.click(fn=parse_scenario, inputs=scenario_json, outputs=scenario_result)\n            scenario_run.click(\n                fn=run_scenario,\n                inputs=[scenario_json, scenario_external_confirm],\n                outputs=[\n                    scenario_result,\n                    scenario_status_output,\n                    scenario_session,\n                    scenario_resume_at,\n                ],\n            )\n            scenario_resume.click(\n                fn=resume_scenario,\n                inputs=[\n                    scenario_json,\n                    scenario_session,\n                    scenario_resume_at,\n                    scenario_external_confirm,\n                ],\n                outputs=[\n                    scenario_result,\n                    scenario_status_output,\n                    scenario_session,\n                    scenario_resume_at,\n                ],\n            )\n'''
          if text.count(old_ui) != 1:
              raise SystemExit(f"scenario UI marker count={text.count(old_ui)}")
          text = text.replace(old_ui, new_ui, 1)

          old_intro = '''                "Import a JSON scenario. Each imported run becomes a normal saved session that can "\n                "be resumed from the Session tab."\n'''
          new_intro = '''                "Import a JSON scenario. A batch backend failure preserves completed turns and "\n                "returns the exact resume position, so retrying does not replay earlier calls. "\n                "The resulting session also remains available in the Session tab."\n'''
          if text.count(old_intro) != 1:
              raise SystemExit(f"scenario intro marker count={text.count(old_intro)}")
          text = text.replace(old_intro, new_intro, 1)

          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/apply-scenario-resume-ui.yml
          python -m compileall -q src/shadowseed/workbench
      - name: Commit normal source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/workbench/app.py .github/workflows/apply-scenario-resume-ui.yml
          git commit -m "Expose resumable scenario batches in Workbench UI"
          git push origin HEAD:fix/workbench-0.4.1-review-followups
