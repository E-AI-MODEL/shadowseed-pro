name: Apply post-merge review follow-ups

on:
  push:
    branches:
      - fix/post-merge-review-followups
    paths:
      - .github/scripts/apply_post_merge_review_followups.py
      - .github/workflows/apply-post-merge-review-followups.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-merge-review-followups
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python .github/scripts/apply_post_merge_review_followups.py
      - name: Run focused validation
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          ruff check src/shadowseed_agent/agent_contract.py tests/test_manager_modularization_complete.py tests/test_point_of_use.py tests/test_claim_boundaries.py
          pytest -q tests/test_manager_modularization_complete.py tests/test_point_of_use.py tests/test_claim_boundaries.py tests/test_agent_safety_contract.py
      - name: Commit fixes and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_post_merge_review_followups.py .github/workflows/apply-post-merge-review-followups.yml
          git add README.md docs/architecture/overview.md docs/architecture/lifecycle-and-gate.md src/shadowseed_agent/agent_contract.py tests/test_manager_modularization_complete.py tests/test_point_of_use.py tests/test_claim_boundaries.py
          git commit -m 'Address post-merge review follow-ups'
          git push origin HEAD:fix/post-merge-review-followups
