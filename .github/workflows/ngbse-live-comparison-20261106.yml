name: Research - live NGBSE three-arm comparison (bounded)

# This workflow uses the existing research-only OpenAI key environment.
# Shadowseed Pro itself is never imported or modified by this experiment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ngbse-live-comparison-20261106
  cancel-in-progress: false

jobs:
  pinned-offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact NGBSE research revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: E-AI-MODEL/NGBSE20.1
          ref: c28e974f14309b76df66bbfc6c93008e49fc4597
          path: ngbse
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install -e ./ngbse
      - run: python ngbse/research/ngbse_quality/run_three_arm.py --preflight

  bounded-live-evaluation:
    needs: pinned-offline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: OpenAI key
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_DISABLE_SHARE_EMAIL: "1"
      PROMPTFOO_CACHE_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      NGBSE_QUALITY_ANSWERS_FILE: ${{ github.workspace }}/research-artifacts/ngbse-quality-v1/answers.json
    steps:
      - name: Checkout exact NGBSE research revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: E-AI-MODEL/NGBSE20.1
          ref: c28e974f14309b76df66bbfc6c93008e49fc4597
          path: ngbse
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Require protected API key, never print it
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Research key unavailable; no model calls sent"
            exit 1
          fi
      - name: Install comparison dependencies
        run: |
          python -m pip install -e ./ngbse
          python -m pip install 'openai>=2,<4'
      - name: Run capped 6 dossiers x 3 actual model arms
        run: |
          python ngbse/research/ngbse_quality/run_three_arm.py \
            --output research-artifacts/ngbse-quality-v1
      - name: Promptfoo checks on real stored responses; no repeated model calls
        run: |
          npx --yes promptfoo@0.125.1 eval \
            --config ngbse/research/ngbse_quality/promptfooconfig.yaml \
            --output research-artifacts/ngbse-quality-v1/promptfoo-results.json \
            --no-cache
      - name: Upload receipts and blind review; no private arm mapping
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ngbse-real-model-blind-review-and-receipts
          path: |
            research-artifacts/ngbse-quality-v1/provider_events.jsonl
            research-artifacts/ngbse-quality-v1/summary.json
            research-artifacts/ngbse-quality-v1/answers.json
            research-artifacts/ngbse-quality-v1/blind_review.csv
            research-artifacts/ngbse-quality-v1/promptfoo-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload arm mapping separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ngbse-private-arm-map
          path: research-artifacts/ngbse-quality-v1/PRIVATE_MAPPING.json
          if-no-files-found: warn
          retention-days: 14
