name: Temporary 0.11.1 lock refresh

on:
  push:
    branches:
      - hotfix/0.11.1-ollama-embedding-compat

permissions:
  contents: write

concurrency:
  group: temp-0111-lock-refresh
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/0.11.1-ollama-embedding-compat
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.14"
      - name: Refresh lock from 0.11.1 metadata
        run: uv lock
      - name: Commit lock only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock for 0.11.1"
          git push origin HEAD:hotfix/0.11.1-ollama-embedding-compat
