name: Harden intake extraction

on:
  push:
    branches:
      - refactor/extract-intake
    paths:
      - .github/workflows/harden-intake-extraction.yml
      - .github/scripts/harden_intake_extraction.py

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-intake
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve manager extension points
        run: |
          python .github/scripts/harden_intake_extraction.py
          python -m compileall -q src tests
      - name: Commit compatibility hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve intake extension-point compatibility"
          git push origin HEAD:refactor/extract-intake
