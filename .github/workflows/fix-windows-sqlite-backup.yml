name: Fix Windows SQLite backup handle lifecycle

on:
  push:
    branches: [feature/workbench-release]
    paths: [.github/workflows/fix-windows-sqlite-backup.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workbench-release
          fetch-depth: 0
      - name: Apply exact backup resource fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/shadowseed/storage/sqlite.py")
          text = path.read_text(encoding="utf-8")
          old = '''        with self._connect() as source, sqlite3.connect(temporary) as destination_db:\n            source.backup(destination_db)\n        os.replace(temporary, target)\n        return target\n'''
          new = '''        source = self._connect()\n        destination_db = sqlite3.connect(temporary)\n        try:\n            source.backup(destination_db)\n            destination_db.commit()\n        finally:\n            destination_db.close()\n            source.close()\n        os.replace(temporary, target)\n        return target\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected backup marker once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-windows-sqlite-backup.yml
          python -m compileall -q src/shadowseed/storage
      - name: Commit normal source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowseed/storage/sqlite.py .github/workflows/fix-windows-sqlite-backup.yml
          git commit -m "Close SQLite backup handles before atomic replace"
          git push origin HEAD:feature/workbench-release
