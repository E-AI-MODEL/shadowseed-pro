name: Research - Offline Step 1 Gap Birth Audit

# RESEARCH FIXTURES ONLY. No hosted model, no H-Neurons, no credentials.
# Only investigator-authored texts and canonical product code are executed.
on:
  pull_request:
    branches:
      - main
    paths:
      - "research/src/shadowseed_research/benchmark/step1_gap_birth_instrument.py"
      - "research/tests/test_step1_gap_birth_instrument.py"
      - "research/fixtures/step1_gap_birth_recorded_v0.json"
      - ".github/workflows/step1-gap-birth-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorded-pipeline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.1.4
      - name: Install locked local research environment
        run: |
          uv sync --locked --extra test
          uv pip install --python .venv/bin/python --no-deps -e ./research
      - name: Run canonical pipeline instrument tests without a model
        run: uv run --no-sync python -m pytest -q research/tests/test_step1_gap_birth_instrument.py
      - name: Produce raw recorded gap-to-seed audit
        run: |
          uv run --no-sync python -m shadowseed_research.benchmark.step1_gap_birth_instrument \
            --fixture research/fixtures/step1_gap_birth_recorded_v0.json \
            --output research-artifacts/step1-gap-birth-recorded.json
      - name: Require explicit zero-provider, non-efficacy manifest
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research-artifacts/step1-gap-birth-recorded.json")
          record = json.loads(p.read_text(encoding="utf-8"))
          assert record["status"] == "offline_recorded_product_pipeline_mechanics_only"
          assert record["claimed_efficacy"] is False
          assert record["model_calls"] == record["hosted_embedding_calls"] == 0
          assert record["no_network"] is True
          assert len(record["runs"]) == 2
          assert all(len(r["turns"]) == 4 for r in record["runs"])
          assert all(r["total_influence_records"] == 0 for r in record["runs"])
          print("OFFLINE only. Two canonical sessions, eight scripted detector turns.")
          PY
      - name: Upload raw scripted provenance and seed lifecycle records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step1-gap-birth-recorded-${{ github.run_id }}
          path: research-artifacts/step1-gap-birth-recorded.json
          if-no-files-found: error
          retention-days: 30
