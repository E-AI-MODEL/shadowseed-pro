name: Research - Anchor-tail live pilot 2026-11-05

# One-time trigger on isolated research branch, max $0.50 reserved by runner.
on:
  push:
    branches:
      - research/anchor-tail-live-pilot-20261105
    paths:
      - .github/workflows/anchor-tail-live-20261105.yml

permissions:
  contents: read

concurrency:
  group: anchor-tail-live-20261105
  cancel-in-progress: false

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify experiment before any external calls
        run: |
          python -m py_compile research/scripts/anchor_tail_live_20261105.py
          python research/scripts/anchor_tail_live_20261105.py --preflight
  paid-pilot:
    needs: offline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: OpenAI key
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Confirm secure OpenAI Environment binding
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_KEY is unavailable. No model calls."
            exit 1
          fi
      - name: Install API SDK
        run: python -m pip install --disable-pip-version-check "openai>=2,<4"
      - name: Run real GPT-4.1 probability and anchor trial
        run: |
          python research/scripts/anchor_tail_live_20261105.py --out research-artifacts/anchor-tail-20261105
      - name: Preserve results including partial data, never secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anchor-tail-20261105
          path: research-artifacts/anchor-tail-20261105/
          if-no-files-found: warn
          retention-days: 30
