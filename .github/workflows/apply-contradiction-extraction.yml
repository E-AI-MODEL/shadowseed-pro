name: Apply contradiction extraction

on:
  push:
    branches:
      - refactor/extract-contradictions
    paths:
      - .github/workflows/apply-contradiction-extraction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-contradictions
          fetch-depth: 0

      - name: Extract contradiction domain
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          component = r'''"""Contradiction record collection, state derivation, and lifecycle workflows.

          The record contract itself remains in :mod:`shadowseed.gate.contradictions`.
          This module owns the mutable collection, identifier sequence, blocking-state
          derivation, formal resolution, migration, and persistence helpers.  The core
          manager exposes compatibility facade methods and retains authority/Gate
          orchestration.
          """

          from __future__ import annotations

          from collections.abc import Callable, Iterable, Sequence
          from typing import Any

          from shadowseed.gate.contradictions import ContradictionRecord, ContradictionStatus
          from shadowseed.gate.events import ContradictionState
          from shadowseed.models import ShadowSeed


          class ContradictionDomain:
              """Canonical mutable state and workflows for seed contradictions."""

              def __init__(
                  self,
                  records: Iterable[ContradictionRecord] | None = None,
                  *,
                  sequence: int = 0,
              ) -> None:
                  self.records: list[ContradictionRecord] = list(records or ())
                  self._sequence = max(0, int(sequence))
                  self._sync_sequence()

              @property
              def sequence(self) -> int:
                  return self._sequence

              @sequence.setter
              def sequence(self, value: int) -> None:
                  self._sequence = max(0, int(value))

              @staticmethod
              def _sequence_from_id(contradiction_id: str) -> int | None:
                  try:
                      return int(contradiction_id.rsplit("::", 1)[1])
                  except (IndexError, ValueError):
                      return None

              def _sync_sequence(self) -> None:
                  known = (
                      value
                      for record in self.records
                      if (value := self._sequence_from_id(record.contradiction_id)) is not None
                  )
                  self._sequence = max((self._sequence, *known))

              def replace_records(self, records: Iterable[ContradictionRecord]) -> None:
                  self.records = list(records)
                  self._sync_sequence()

              def contradictions_for(self, seed_id: str) -> list[ContradictionRecord]:
                  """Return all records for ``seed_id`` in creation order."""

                  return [record for record in self.records if record.seed_id == seed_id]

              def open_for(self, seed_id: str) -> list[ContradictionRecord]:
                  """Return unresolved records that currently block ``seed_id``."""

                  return [
                      record
                      for record in self.records
                      if record.seed_id == seed_id and record.is_blocking
                  ]

              def state_for(self, seed: ShadowSeed) -> ContradictionState:
                  """Derive canonical blocking state, including the legacy scalar fallback."""

                  records = self.contradictions_for(seed.id)
                  if records:
                      open_count = sum(1 for record in records if record.is_blocking)
                      return ContradictionState(
                          blocking=open_count > 0,
                          open_count=open_count,
                          score=seed.contradiction_score,
                      )
                  legacy_blocking = seed.contradiction_score > 0.0
                  return ContradictionState(
                      blocking=legacy_blocking,
                      open_count=1 if legacy_blocking else 0,
                      score=seed.contradiction_score,
                  )

              def open(
                  self,
                  seed: ShadowSeed,
                  *,
                  reason: str,
                  source_ref: str | None,
                  strength: float,
                  created_at: str,
              ) -> ContradictionRecord:
                  """Create and append one open contradiction record."""

                  self._sync_sequence()
                  self._sequence += 1
                  record = ContradictionRecord(
                      contradiction_id=f"contra::{seed.id}::{self._sequence:06d}",
                      seed_id=seed.id,
                      reason=reason,
                      source_ref=source_ref,
                      strength=max(0.0, min(1.0, strength)),
                      lifecycle_state=ContradictionStatus.OPEN,
                      created_at=created_at,
                  )
                  self.records.append(record)
                  return record

              def resolve(
                  self,
                  seed_id: str,
                  *,
                  basis: str,
                  contradiction_id: str | None = None,
                  superseded: bool = False,
                  withdrawn: bool = False,
                  resolved_at: Callable[[], str],
              ) -> list[ContradictionRecord]:
                  """Formally close selected open records and return the changed records."""

                  open_records = self.open_for(seed_id)
                  if contradiction_id is not None:
                      open_records = [
                          record
                          for record in open_records
                          if record.contradiction_id == contradiction_id
                      ]
                  if not open_records:
                      raise ValueError(f"no open contradiction to resolve for seed '{seed_id}'")
                  for record in open_records:
                      record.resolve(
                          basis,
                          superseded=superseded,
                          withdrawn=withdrawn,
                          resolved_at=resolved_at(),
                      )
                  return open_records

              def migrate_legacy(
                  self,
                  seeds: Iterable[ShadowSeed],
                  *,
                  created_at: Callable[[], str],
              ) -> list[ContradictionRecord]:
                  """Create records for positive legacy scalars that lack records."""

                  created: list[ContradictionRecord] = []
                  for seed in seeds:
                      if seed.contradiction_score > 0.0 and not self.contradictions_for(seed.id):
                          created.append(
                              self.open(
                                  seed,
                                  reason="migrated from legacy contradiction_score",
                                  source_ref="legacy_migration",
                                  strength=min(1.0, seed.contradiction_score),
                                  created_at=created_at(),
                              )
                          )
                  return created

              def to_dicts(self) -> list[dict[str, Any]]:
                  """Serialize records without changing their historical shape."""

                  return [record.to_dict() for record in self.records]

              @classmethod
              def from_dicts(
                  cls,
                  data: Sequence[dict[str, Any]],
              ) -> "ContradictionDomain":
                  """Restore records and continue identifiers after the highest sequence."""

                  return cls(ContradictionRecord.from_dict(item) for item in data)


          __all__ = [
              "ContradictionDomain",
              "ContradictionRecord",
              "ContradictionStatus",
          ]
          '''

          tests = r'''"""Regression tests for the contradiction-domain extraction."""

          from __future__ import annotations

          import numpy as np

          from shadowseed import manager as manager_module
          from shadowseed.contradictions import ContradictionDomain
          from shadowseed.gate.contradictions import ContradictionRecord, ContradictionStatus
          from shadowseed.manager import SSLManager
          from shadowseed.models import ShadowSeed


          def _embedding(_text: str) -> np.ndarray:
              return np.array([1.0, 0.0, 0.0])


          def _seed(seed_id: str = "seed-1") -> ShadowSeed:
              return ShadowSeed(id=seed_id, text="a seed", embedding=_embedding("a seed"))


          def test_domain_roundtrip_preserves_payload_and_identifier_sequence() -> None:
              domain = ContradictionDomain()
              seed = _seed()
              first = domain.open(
                  seed,
                  reason="first",
                  source_ref="reviewer-a",
                  strength=0.25,
                  created_at="2026-08-01T00:00:00",
              )
              second = domain.open(
                  seed,
                  reason="second",
                  source_ref=None,
                  strength=0.75,
                  created_at="2026-08-02T00:00:00",
              )
              first.resolve("superseded evidence", resolved_at="2026-08-03T00:00:00")

              payload = domain.to_dicts()
              restored = ContradictionDomain.from_dicts(payload)
              third = restored.open(
                  seed,
                  reason="third",
                  source_ref="reviewer-b",
                  strength=1.0,
                  created_at="2026-08-04T00:00:00",
              )

              assert restored.to_dicts()[:2] == payload
              assert second.contradiction_id.endswith("000002")
              assert third.contradiction_id.endswith("000003")


          def test_manager_facade_uses_one_canonical_record_collection() -> None:
              manager = SSLManager(embedding_fn=_embedding)
              seed_id = manager.add_or_update_seed("a seed")
              record = manager._open_contradiction_record(
                  manager.seeds[seed_id],
                  reason="counterexample",
                  source_ref="reviewer-a",
                  strength=0.5,
              )

              assert manager.contradiction_records is manager._contradictions.records
              assert manager.open_contradictions(seed_id) == [record]
              assert manager.contradictions_for(seed_id) == [record]
              assert manager.is_blocking_contradiction(seed_id) is True

              event = manager.resolve_contradiction(seed_id, basis="independent replication")
              assert event.decision.value == "contradiction_resolved"
              assert manager.open_contradictions(seed_id) == []
              assert record.lifecycle_state is ContradictionStatus.RESOLVED


          def test_assigning_legacy_manager_record_list_restores_domain_sequence() -> None:
              manager = SSLManager(embedding_fn=_embedding)
              seed_id = manager.add_or_update_seed("a seed")
              restored = ContradictionRecord(
                  contradiction_id=f"contra::{seed_id}::000004",
                  seed_id=seed_id,
                  reason="restored",
              )

              manager.contradiction_records = [restored]
              created = manager._open_contradiction_record(
                  manager.seeds[seed_id],
                  reason="new",
                  source_ref=None,
                  strength=1.0,
              )

              assert manager.contradiction_records[0] is restored
              assert created.contradiction_id.endswith("000005")
              assert manager._contradiction_sequence == 5


          def test_manager_export_keeps_exact_contradiction_record_shape() -> None:
              manager = SSLManager(embedding_fn=_embedding)
              seed_id = manager.add_or_update_seed("a seed")
              record = manager._open_contradiction_record(
                  manager.seeds[seed_id],
                  reason="counterexample",
                  source_ref="source-1",
                  strength=0.4,
              )

              assert manager.to_dict()["contradiction_records"] == [record.to_dict()]
              assert list(record.to_dict()) == [
                  "contradiction_id",
                  "seed_id",
                  "reason",
                  "source_ref",
                  "strength",
                  "status",
                  "created_at",
                  "resolved_at",
                  "resolution_basis",
              ]


          def test_manager_wildcard_import_compatibility_is_preserved() -> None:
              namespace: dict[str, object] = {}
              exec("from shadowseed.manager import *", namespace)

              assert namespace["ContradictionRecord"] is ContradictionRecord
              assert namespace["ContradictionStatus"] is ContradictionStatus
              assert namespace["GateDecision"] is manager_module.GateDecision
              assert "ContradictionDomain" not in namespace
          '''

          def replace_method(source: str, name: str, replacement: str) -> str:
              tree = ast.parse(source)
              manager = next(
                  node
                  for node in tree.body
                  if isinstance(node, ast.ClassDef) and node.name == "SSLManager"
              )
              method = next(
                  node
                  for node in manager.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == name
              )
              lines = source.splitlines(keepends=True)
              return (
                  "".join(lines[: method.lineno - 1])
                  + replacement.strip("\n")
                  + "\n"
                  + "".join(lines[method.end_lineno :])
              )

          manager_path = Path("src/shadowseed/manager.py")
          source = manager_path.read_text()
          source = source.replace(
              "from shadowseed.core_config import SSLCoreConfig\n",
              "from shadowseed.contradictions import ContradictionDomain as _ContradictionDomain\n"
              "from shadowseed.core_config import SSLCoreConfig\n",
              1,
          )
          source = source.replace(
              "        # Explicit contradiction records (#13). Blocking state is derived from\n"
              "        # unresolved records; contradiction_score is kept for compatibility.\n"
              "        self.contradiction_records: list[ContradictionRecord] = []\n"
              "        self._contradiction_sequence = 0\n",
              "        # Canonical contradiction collection and lifecycle workflows. Public\n"
              "        # manager attributes and methods below remain compatibility facades.\n"
              "        self._contradictions = _ContradictionDomain()\n",
              1,
          )
          source = source.replace(
              "DEFAULT_CONFIG = SSLCoreConfig()\n",
              "DEFAULT_CONFIG = SSLCoreConfig()\n"
              "# Keep the historical manager wildcard-import surface without making the new\n"
              "# domain component another implicit manager export.\n"
              "_CONTRADICTION_STATUS_COMPAT = ContradictionStatus\n",
              1,
          )

          source = replace_method(
              source,
              "open_contradictions",
              r'''
              @property
              def contradiction_records(self) -> list[ContradictionRecord]:
                  """Historical mutable record list, backed by the canonical domain."""

                  return self._contradictions.records

              @contradiction_records.setter
              def contradiction_records(self, records: Iterable[ContradictionRecord]) -> None:
                  self._contradictions.replace_records(records)

              @property
              def _contradiction_sequence(self) -> int:
                  """Compatibility view of the domain-owned identifier sequence."""

                  return self._contradictions.sequence

              @_contradiction_sequence.setter
              def _contradiction_sequence(self, value: int) -> None:
                  self._contradictions.sequence = value

              def open_contradictions(self, seed_id: str) -> list[ContradictionRecord]:
                  """Unresolved (blocking) contradiction records for a seed."""

                  return self._contradictions.open_for(seed_id)
              ''',
          )
          source = replace_method(
              source,
              "contradictions_for",
              r'''
              def contradictions_for(self, seed_id: str) -> list[ContradictionRecord]:
                  """All contradiction records for a seed, in creation order."""

                  return self._contradictions.contradictions_for(seed_id)
              ''',
          )
          source = replace_method(
              source,
              "is_blocking_contradiction",
              r'''
              def is_blocking_contradiction(self, seed_id: str) -> bool:
                  """Canonical blocking state for a seed (derived from records, with the
                  legacy scalar as fallback). This is the value point-of-use decisions
                  should consult rather than reading contradiction_score directly."""

                  return self._contradictions.state_for(self._seeds[seed_id]).blocking
              ''',
          )
          source = replace_method(
              source,
              "_contradiction_state",
              r'''
              def _contradiction_state(self, seed: ShadowSeed) -> ContradictionState:
                  """Derive the blocking-contradiction snapshot.

                  Blocking state comes from unresolved records. Seeds that predate the
                  record model (a positive scalar but no records) are treated as carrying
                  one legacy open contradiction, so migration is lossless.
                  """

                  return self._contradictions.state_for(seed)
              ''',
          )
          source = replace_method(
              source,
              "_open_contradiction_record",
              r'''
              def _open_contradiction_record(
                  self,
                  seed: ShadowSeed,
                  *,
                  reason: str,
                  source_ref: str | None,
                  strength: float,
              ) -> ContradictionRecord:
                  return self._contradictions.open(
                      seed,
                      reason=reason,
                      source_ref=source_ref,
                      strength=strength,
                      created_at=self._now_iso(),
                  )
              ''',
          )
          source = replace_method(
              source,
              "resolve_contradiction",
              r'''
              def resolve_contradiction(
                  self,
                  seed_id: str,
                  *,
                  basis: str,
                  contradiction_id: str | None = None,
                  superseded: bool = False,
                  withdrawn: bool = False,
                  resolver: str = "human",
              ) -> GateEvent:
                  """Gate-controlled contradiction recovery.

                  Marks the seed's open contradiction record(s) as resolved (or superseded
                  / withdrawn) with a recorded ``basis``, then — if no blocking record
                  remains — clears the blocking scalar through the authority path. This
                  only *unblocks* the seed; authority is not restored here. Recovery still
                  requires revalidation (a subsequent signal submission) under the active
                  policy, which is what actually raises weight again.

                  Recurrence alone can never reach this method: resolution is an explicit,
                  separately-recorded action with a mandatory basis.
                  """

                  seed = self._seeds[seed_id]
                  if seed.status == SeedStatus.EXPIRED:
                      raise ValueError(
                          "expired seeds cannot recover through contradiction resolution"
                      )

                  status_before = seed.status.value
                  weight_before = seed.weight
                  contradiction_before = self._contradiction_state(seed)
                  self._contradictions.resolve(
                      seed_id,
                      basis=basis,
                      contradiction_id=contradiction_id,
                      superseded=superseded,
                      withdrawn=withdrawn,
                      resolved_at=self._now_iso,
                  )
                  # If nothing blocking remains, clear the scalar so the point-of-use
                  # contract and the policies stop treating the seed as contradicted.
                  if not self.open_contradictions(seed_id):
                      self._set_authority(seed, contradiction_score=0.0)
                  self._touch_seed(seed)
                  signal = ValidationSignal(
                      kind=SignalKind.CONTRADICTION_RESOLUTION,
                      direction=SignalDirection.SUPPORT,
                      strength=1.0,
                      source_ref=resolver,
                      reason=basis,
                  )
                  return self._record_gate_event(
                      seed,
                      GateDecision.CONTRADICTION_RESOLVED,
                      [signal],
                      policy_id="contradiction_resolution",
                      status_before=status_before,
                      weight_before=weight_before,
                      contradiction_before=contradiction_before,
                      reason=f"resolved by {resolver}: {basis}",
                  )
              ''',
          )
          source = replace_method(
              source,
              "migrate_legacy_contradictions",
              r'''
              def migrate_legacy_contradictions(self) -> list[ContradictionRecord]:
                  """Create an open record for any seed with a legacy scalar but no records.

                  Idempotent: seeds that already have records are left untouched. Returns
                  the records created, for logging or tests.
                  """

                  return self._contradictions.migrate_legacy(
                      self._seeds.values(),
                      created_at=self._now_iso,
                  )
              ''',
          )
          source = source.replace(
              '"contradiction_records": [item.to_dict() for item in self.contradiction_records],',
              '"contradiction_records": self._contradictions.to_dicts(),',
              1,
          )
          manager_path.write_text(source)

          Path("src/shadowseed/contradictions.py").write_text(component)
          Path("tests/test_contradictions_extraction.py").write_text(tests)

          gate_path = Path("src/shadowseed/gate/contradictions.py")
          gate_text = gate_path.read_text().replace(
              "    the resolution metadata. The manager owns creation and resolution.\n",
              "    the resolution metadata. The contradiction domain owns creation and\n"
              "    resolution; the manager exposes the compatibility facade.\n",
              1,
          )
          gate_path.write_text(gate_text)

          Path(".github/workflows/inspect-contradictions.yml").unlink()
          Path(".github/workflows/apply-contradiction-extraction.yml").unlink()
          PY

      - name: Validate extraction
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
          ruff check .
          pytest -q
          python -m build

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "EAI"
          git config user.email "vis@emmauscollege.nl"
          git add \
            src/shadowseed/contradictions.py \
            src/shadowseed/gate/contradictions.py \
            src/shadowseed/manager.py \
            tests/test_contradictions_extraction.py \
            .github/workflows/inspect-contradictions.yml \
            .github/workflows/apply-contradiction-extraction.yml
          git commit -m "Extract contradiction domain"
          git push origin HEAD:refactor/extract-contradictions
