name: Temporary - lock refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-lock-refresh.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.14"
      - name: Regenerate lock and print the patch
        run: |
          uv lock
          git diff uv.lock > /tmp/uv-lock.patch
          echo "PATCH_B64_BEGIN"
          base64 -w0 /tmp/uv-lock.patch
          echo
          echo "PATCH_B64_END"
