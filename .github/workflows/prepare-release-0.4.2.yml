name: Prepare release 0.4.2 metadata

on:
  push:
    branches: [agent/release-0.4.2]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.2
          fetch-depth: 0
      - name: Align visible release metadata
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = '<img alt="Repository version 0.4.1" src="https://img.shields.io/badge/repository-0.4.1-2f6f5e">'
          new = '<img alt="Repository version 0.4.2" src="https://img.shields.io/badge/repository-0.4.2-2f6f5e">'
          if old not in text:
              raise SystemExit("expected 0.4.1 README badge not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old = "## Unreleased - Authority and retrieval hardening"
          new = "## 0.4.2 - 2026-08-15 - Authority and retrieval hardening"
          if old not in text:
              raise SystemExit("expected authority hardening changelog heading not found")
          changelog.write_text(text.replace(old, new, 1), encoding="utf-8")

          project = Path("pyproject.toml").read_text(encoding="utf-8")
          if 'version = "0.4.2"' not in project:
              raise SystemExit("pyproject version is not 0.4.2")
          if not Path("docs/workbench/release-0.4.2.md").is_file():
              raise SystemExit("0.4.2 release notes are missing")

          Path(".github/workflows/prepare-release-0.4.2.yml").unlink()
      - name: Commit metadata and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md .github/workflows/prepare-release-0.4.2.yml
          git commit -m "Align 0.4.2 release metadata"
          git push origin HEAD:agent/release-0.4.2
