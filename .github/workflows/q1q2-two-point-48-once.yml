name: Research - two-moment 48-call encrypted one-shot

# Exactly one first push may run a paid test. A workflow edit or rerun cannot
# silently restart the study. No production code or release is touched.
on:
  push:
    branches:
      - research/q1q2-two-point-48-20261028
    paths:
      - .github/workflows/q1q2-two-point-48-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: research-two-point-48-20261028
  cancel-in-progress: false

jobs:
  source-and-code-preflight:
    if: ${{ github.event.before == 'c2cfb97b1c4069f60ce304091f782d3392b9351b' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the exact proposed research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Retrieve and checksum original Actions observed.json
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, os, urllib.request, zipfile
          from pathlib import Path
          url = "https://api.github.com/repos/E-AI-MODEL/shadowseed-pro/actions/artifacts/12754935105/zip"
          req = urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
              "User-Agent":"shadowseed-two-point/1",
              "Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=35) as r:
              raw = r.read(4000000)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              data = z.read("observed.json")
          assert hashlib.sha256(data).hexdigest()=="0a5094e38ab2fdcf8c68dc8d6a3c75d29eeffd49e1f6c8e138589ed73ca36bbf"
          p = Path(os.environ["RUNNER_TEMP"])/"observed.json"
          p.write_bytes(data)
          print("Pinned source verified. No original content printed.")
          PY
      - name: Check original candidate provenance and exercise all 48 calls with mocked provider
        env:
          LOCAL_OBSERVED: ${{ runner.temp }}/observed.json
        shell: bash
        run: |
          python -m unittest -q research.tests.test_q1q2_two_point_48
          python -m research.scripts.q1q2_two_point_48 \
            --observed "$LOCAL_OBSERVED" \
            --output "$RUNNER_TEMP/dry-run" --dry-run
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"dry-run/plan.json").read_text())
          assert (p["planned_calls"],p["independent_cases"],p["research_moments"]) == (48,1,2)
          assert not p["product_Gate_promotion_tested"]
          assert p["human_reviews_completed"]==0
          print("PREFLIGHT PASS: exact original source, all controls, no API key")
          PY

  paid-exploratory:
    needs: source-and-code-preflight
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: OpenAI key
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
    steps:
      - name: Checkout source, never persist GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Require existing protected key without printing
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::Missing scoped OPENAI_KEY; zero paid calls"; exit 1; }
          openssl version
      - name: Run bounded 24 tracks x two model calls, no retries
        id: live
        shell: bash
        run: |
          set +e
          python -m research.scripts.q1q2_two_point_48 --output "$RUNNER_TEMP/q1q2-48"
          code=$?
          echo "research_return_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal all raw response text and owner mapping with author public key
        if: always()
        shell: bash
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/sealed"
          work="$RUNNER_TEMP/q1q2-48"
          if [ ! -f "$work/observed-owner.json" ]; then
            echo "No model output to encrypt"
            exit 0
          fi
          if [ ! -f "$work/blind-human-review.json" ]; then
            printf '{"groups":[],"human_reviews_completed":0,"status":"partial"}\n' > "$work/blind-human-review.json"
          fi
          if [ ! -f "$work/owner-unblind.json" ]; then
            printf '{"unblind":[],"owner_only":true,"status":"partial"}\n' > "$work/owner-unblind.json"
          fi
          tar -czf "$RUNNER_TEMP/raw-owner.tar.gz" -C "$work" \
            observed-owner.json blind-human-review.json owner-unblind.json plan.json
          openssl rand -hex 32 > "$RUNNER_TEMP/key.secret"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/raw-owner.tar.gz" \
            -out "$RUNNER_TEMP/sealed/private-payload.aes" \
            -pass "file:$RUNNER_TEMP/key.secret"
          openssl pkeyutl -encrypt -pubin \
            -inkey research/keys/two-point-20261028-public.pem \
            -in "$RUNNER_TEMP/key.secret" \
            -out "$RUNNER_TEMP/sealed/aes-key.rsa-oaep" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          (cd "$RUNNER_TEMP/sealed" && sha256sum private-payload.aes aes-key.rsa-oaep > SHA256SUMS)
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          o=json.loads((p/"q1q2-48/observed-owner.json").read_text())
          summary=dict(study="q1q2-two-point-48-exploratory",
              source_sha256=o["source_sha256"],
              attempted_calls=o["attempted_calls"],
              successful_calls=o["successful_calls"],
              reported_tokens=o["reported_tokens"],
              status=o["status"],
              completed_human_reviews=0,
              raw_owner_text_public=False,
              independent_case_count=1,
              estimated_effect_size=None)
          (p/"sealed/public-status.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary))
          PY
          rm -f "$RUNNER_TEMP/raw-owner.tar.gz" "$RUNNER_TEMP/key.secret"
          rm -f "$work/observed-owner.json" "$work/blind-human-review.json" "$work/owner-unblind.json"
      - name: Upload encrypted owner-only data, never plaintext (7-day expiry)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q1q2-48-encrypted-owner-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: warn
          retention-days: 7
      - name: Mark incomplete or blocked study as incomplete
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.live.outputs.research_return_code }}
        run: |
          if [ "$CODE" != "0" ]; then
            echo "::error::Study incomplete or blocked. Do not interpret as treatment null."
            exit 1
          fi
