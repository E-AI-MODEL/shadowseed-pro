name: Temporary - materialize observation-scoped recurrence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/observation-recurrence-materialize.yml
      - src/shadowseed/recurrence_clustering.py
      - tests/test_observation_scoped_recurrence.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observation-scoped-recurrence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire observation refs into canonical callers and replay state
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('src/shadowseed/chat.py')
          text = chat.read_text(encoding='utf-8')

          old_add = 'self.clusterer.add(seed.text, seed.embedding)'
          new_add = 'self.clusterer.add(seed.text, seed.embedding, observation_ref=f"turn:{turn}")'
          if text.count(old_add) != 2:
              raise SystemExit(f'chat.py expected 2 cluster add callsites, found {text.count(old_add)}')
          text = text.replace(old_add, new_add)

          old_bump = 'self.clusterer.bump(cluster_id)'
          new_bump = 'self.clusterer.bump(cluster_id, observation_ref=f"turn:{turn}")'
          if text.count(old_bump) != 2:
              raise SystemExit(f'chat.py expected 2 cluster bump callsites, found {text.count(old_bump)}')
          text = text.replace(old_bump, new_bump)

          old_serialize = '                "members": [list(items) for items in self.clusterer.members],\n'
          new_serialize = old_serialize + (
              '                "seen_observation_refs": [\n'
              '                    sorted(items) for items in self.clusterer.seen_observation_refs\n'
              '                ],\n'
          )
          if text.count(old_serialize) != 1:
              raise SystemExit('chat.py cluster serialization anchor changed')
          text = text.replace(old_serialize, new_serialize)

          old_restore = (
              '            clusterer.members = [list(items) for items in cluster_state.get("members", [])]\n'
              '            session.clusterer = clusterer\n'
          )
          new_restore = (
              '            clusterer.members = [list(items) for items in cluster_state.get("members", [])]\n'
              '            raw_seen_refs = cluster_state.get("seen_observation_refs")\n'
              '            if raw_seen_refs is None:\n'
              '                # Historical snapshots predate observation-scoped recurrence.\n'
              '                # Preserve their stored recurrence count and start tracking refs\n'
              '                # only for future observations after restoration.\n'
              '                clusterer.seen_observation_refs = [set() for _ in clusterer.centroids]\n'
              '            else:\n'
              '                clusterer.seen_observation_refs = [\n'
              '                    {str(ref) for ref in items} for items in raw_seen_refs\n'
              '                ]\n'
              '                if len(clusterer.seen_observation_refs) != len(clusterer.centroids):\n'
              '                    raise ValueError("invalid cluster observation-ref state")\n'
              '            session.clusterer = clusterer\n'
          )
          if text.count(old_restore) != 1:
              raise SystemExit('chat.py cluster restore anchor changed')
          text = text.replace(old_restore, new_restore)
          chat.write_text(text, encoding='utf-8')

          suite = Path('src/shadowseed/benchmark/ssl_session_suite.py')
          text = suite.read_text(encoding='utf-8')
          old_add = 'cid = clusterer.add(seed.text, seed.embedding)'
          new_add = (
              'cid = clusterer.add(\n'
              '                            seed.text,\n'
              '                            seed.embedding,\n'
              '                            observation_ref=f"{conv[\'id\']}:turn:{t}",\n'
              '                        )'
          )
          if text.count(old_add) != 1:
              raise SystemExit(f'ssl_session_suite expected 1 cluster add callsite, found {text.count(old_add)}')
          text = text.replace(old_add, new_add)

          old_bump = 'clusterer.bump(cid)'
          new_bump = 'clusterer.bump(cid, observation_ref=f"{conv[\'id\']}:turn:{t}")'
          if text.count(old_bump) != 1:
              raise SystemExit(f'ssl_session_suite expected 1 cluster bump callsite, found {text.count(old_bump)}')
          text = text.replace(old_bump, new_bump)
          suite.write_text(text, encoding='utf-8')
          PY

      - name: Install test stack
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run recurrence and runtime regressions
        run: |
          pytest -q \
            tests/test_observation_scoped_recurrence.py \
            tests/test_recurrence_clustering.py \
            tests/test_live_runtime.py \
            tests/test_shadow_chat.py \
            tests/test_chat_first_product.py

      - name: Run complete repository quality gate
        run: |
          ruff check .
          pytest -q --cov=shadowseed --cov=shadowseed_agent --cov-branch --cov-report=term-missing --cov-fail-under=80
          git diff --check

      - name: Commit only verified runtime wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shadowseed/chat.py src/shadowseed/benchmark/ssl_session_suite.py
          git diff --cached --check
          git commit -m 'Scope semantic recurrence to detector observations'
          git push origin HEAD:agent/observation-scoped-recurrence
