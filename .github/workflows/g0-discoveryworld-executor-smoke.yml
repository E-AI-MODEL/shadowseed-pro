name: Research - G0 DiscoveryWorld Offline Executor Smoke

# External simulator API preflight ONLY, not a model experiment or G0 approval.
# The upstream public source is pinned to a full commit, and the PR workflow
# receives no model secrets, no write permission and no production credentials.
on:
  pull_request:
    branches:
      - main
    paths:
      - "research/scripts/g0_discoveryworld_smoke.py"
      - ".github/workflows/g0-discoveryworld-executor-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-discoveryworld-smoke-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  isolated-upstream-e1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      HF_TOKEN: ""
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out Shadowseed source without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned public simulator into separate directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: allenai/discoveryworld
          ref: fd591323920be0d3786ef350955de1945aa571e5
          path: external/discoveryworld
          persist-credentials: false

      - name: Confirm upstream revision exactly
        shell: bash
        run: |
          test "$(git -C external/discoveryworld rev-parse HEAD)" = "fd591323920be0d3786ef350955de1945aa571e5"
          test -f research/scripts/g0_discoveryworld_smoke.py
          test -f external/discoveryworld/discoveryworld/DiscoveryWorldAPI.py

      - name: Set up isolated Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned source into disposable runner
        run: |
          python -m pip install --no-input -e ./external/discoveryworld
          mkdir -p research-artifacts
          python -m pip freeze --all > research-artifacts/g0-discoveryworld-dependency-freeze.txt

      - name: Run two independent simulations, no language-model client
        run: |
          python research/scripts/g0_discoveryworld_smoke.py \
            --upstream-dir external/discoveryworld \
            --output research-artifacts/g0-discoveryworld-smoke.json

      - name: Require narrow, negative-claim evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(
              Path("research-artifacts/g0-discoveryworld-smoke.json").read_text(encoding="utf-8")
          )
          assert record["status"] == "offline_external_executor_interface_smoke_only"
          assert record["upstream_sha"] == "fd591323920be0d3786ef350955de1945aa571e5"
          assert record["hosted_model_calls"] == record["hosted_embedding_calls"] == 0
          assert record["shadowseed_product_mutations"] == 0
          assert record["claimed_q1_or_q2_efficacy"] is False
          assert record["g0_passed"] is False
          assert record["agent_originated_new_research_question_tested"] is False
          assert record["second_order_investigability_tested"] is False
          assert record["independent_evaluator_approval"] is False
          assert record["independent_method_reviewer_approval"] is False
          assert record["initial_agent_states_match"] is True
          assert record["identical_action_trajectories_match"] is True
          assert record["valid_action_was_executed"] is True
          assert record["invalid_action_was_rejected"] is True
          assert len(record["arms"]) == 2
          assert all(a["rendered_frame_count"] >= 1 for a in record["arms"])
          print("Verified: model-free E1 simulator API only. NO claim of Q1/Q2 or G0.")
          PY

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g0-discoveryworld-e1-smoke-${{ github.run_id }}
          path: |
            research-artifacts/g0-discoveryworld-smoke.json
            research-artifacts/g0-discoveryworld-dependency-freeze.txt
          if-no-files-found: error
          retention-days: 30
