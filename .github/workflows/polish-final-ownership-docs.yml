name: Polish final ownership wording

on:
  push:
    branches:
      - refactor/finalize-manager-modularization
    paths:
      - .github/scripts/polish_final_ownership_docs.py
      - .github/workflows/polish-final-ownership-docs.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finalize-manager-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Polish final ownership wording
        run: python .github/scripts/polish_final_ownership_docs.py
      - name: Commit wording cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish final runtime ownership docs"
          git push origin HEAD:refactor/finalize-manager-modularization
