name: Research - Possibility space first discriminating pilot

on:
  push:
    branches:
      - research/possibility-pilot-20261024
    paths:
      - experiments/possibility_space/**
      - .github/workflows/possibility-space-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: possibility-space-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Offline contract and negative controls
        working-directory: experiments/possibility_space
        run: |
          python -m unittest -v test_pilot
          python pilot.py selftest --output ../../pilot-artifacts/oracle-selftest.json
      - name: Bounded strong-model pilot, if a repository secret exists
        run: |
          python experiments/possibility_space/pilot.py run \
            --cases experiments/possibility_space/first_pilot_cases.json \
            --case-ids ARCHIVE LOGISTICS NEGATIVE \
            --model gpt-5 \
            --reasoning-effort low \
            --max-output-tokens 900 \
            --max-calls 24 \
            --output pilot-artifacts/model-pilot.json
      - name: Report actual status without leaking any credentials
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('pilot-artifacts')
          for name in ('oracle-selftest.json', 'model-pilot.json'):
              p = root/name
              if p.exists():
                  data = json.loads(p.read_text())
                  status = data.get('status')
                  calls = data.get('calls', data.get('model_calls', 0))
                  print(f'{name}: status={status}, model_calls={calls}')
                  if status == 'blocked_no_api_key':
                      print('::warning::Model pilot not run: repository-level OPENAI_API_KEY secret not available')
                  elif status in ('incomplete_live_error', 'completed_calls_with_incomplete_or_unparseable_output'):
                      print(f'::warning::Model pilot incomplete: {status}')
          PY
      - name: Upload results without modifying source or main
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: possibility-space-pilot-${{ github.run_id }}
          path: pilot-artifacts/
          if-no-files-found: warn
