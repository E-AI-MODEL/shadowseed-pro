name: NGBSE Proef 02 - two publications, matched excerpt-card A/B
on:
  push:
    branches:
      - research/ngbse-proef02-matched-20261107
    paths:
      - .github/workflows/ngbse-proef02-matched.yml
permissions:
  contents: read
concurrency:
  group: ngbse-proef02-matched-20261107
  cancel-in-progress: false
jobs:
  matched-llm-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: OpenAI key
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout frozen NGBSE experiment, no product code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: E-AI-MODEL/NGBSE20.1
          ref: 4ca3d3c8ebaef84ee69e808fddc562b969f3759f
          path: ngbse
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate both research scripts before any model call
        run: |
          python -m py_compile ngbse/research/second_output_ab/capture_sources.py
          python -m py_compile ngbse/research/second_output_ab/run_paired.py
      - name: Freeze the same published evidence cards for both arms
        run: |
          mkdir -p research-artifacts/proef02
          cp ngbse/research/second_output_ab/sources_frozen.json research-artifacts/proef02/sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research-artifacts/proef02/sources.json").read_text())
          assert len(d["cases"])==3 and set(d["papers"])=={"B","K"}
          assert all(len(p["paragraphs"])>=18 for p in d["papers"].values())
          assert all("not full text" in p["extraction_method"] for p in d["papers"].values())
          print("SOURCE_FROZEN",sum(len(p["paragraphs"]) for p in d["papers"].values()))
          PY
      - name: Verify protected provider key without printing it
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::No provider key; no model calls issued"
            exit 1
          fi
      - name: Install pinned minimum API client
        run: python -m pip install 'openai>=2,<4'
      - name: Run bounded equal-context two-arm pilot with no retries
        run: |
          python ngbse/research/second_output_ab/run_paired.py \
            --sources research-artifacts/proef02/sources.json \
            --out research-artifacts/proef02/paired
      - name: Preserve all primary evidence even if a call fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ngbse-proef02-actual-a-b-evidence
          path: research-artifacts/proef02/
          if-no-files-found: warn
          retention-days: 30
