version: 2
updates:
  # The production dependency closure is resolved from `uv.lock`, and CI enforces
  # `uv lock --check` / `uv sync --locked`. The `pip` ecosystem edits only
  # `pyproject.toml` and leaves `uv.lock` stale, which fails that gate on every
  # update; the `uv` ecosystem updates the manifest and the lockfile together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: actions
