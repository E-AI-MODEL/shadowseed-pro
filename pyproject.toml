[project]
name = "shadowseed"
version = "0.7.1"
description = "Auditable Shadow Seed Learning runtime and local tester"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.scripts]
shadowseed = "shadowseed.cli:main"
shadowseed-workbench = "shadowseed.workbench.standalone:main"

[project.optional-dependencies]
models = [
  "sentence-transformers>=2.7",
  # 4.51 is the floor for the curated dropdown: Qwen3 needs >=4.51 and
  # Phi-3.5-mini needs >=4.43. CI installs fresh, but a stale local env
  # satisfying an older floor would advertise models it cannot load.
  "transformers>=4.51",
  "torch>=2.2",
]
openai = [
  "openai>=1.40",
]
vector-faiss = [
  "faiss-cpu>=1.8",
]
vector-chroma = [
  "chromadb>=0.5",
]
vector = [
  "shadowseed[vector-faiss,vector-chroma]",
]
workbench = [
  "gradio>=6.0,<7",
  "httpx[socks]>=0.28.0,<1",
  # Product Workbench sessions default to live SSL. Real local-model chat
  # therefore needs a semantic embedder in the normal install rather than a
  # hidden second setup step.
  "sentence-transformers>=2.7",
  "transformers>=4.51",
  "torch>=2.2",
  # Hosted OpenAI is an explicit opt-in backend in the same product surface.
  # Credentials are still read from the environment and are never persisted.
  "openai>=1.40",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
build = [
  "build==1.5.0",
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
standalone-build = [
  "pyinstaller==6.15.0",
]
security = [
  "pip-audit==2.10.1",
]
dev = [
  "shadowseed[test,build,standalone-build,security,models,vector,openai,workbench]",
]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "==0.8.14"

# Workbench and model extras are CPU-first for the bounded local product.
# Linux and Windows use PyTorch's explicit CPU index; macOS falls back to PyPI,
# where the native macOS wheel is CPU/Metal capable and has no CUDA dependency set.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadowseed = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["shadowseed"]
branch = true
omit = [
  "tests/*",
  "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
