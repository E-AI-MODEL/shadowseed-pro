name: Research - R1 cross-language revision screen

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/revision-language-screen-once.yml

permissions:
  contents: write

concurrency:
  group: r1-cross-language-revision-screen
  cancel-in-progress: true

env:
  MODEL_ID: deepseek-r1:latest
  RUN_PATH: benchmarks/results/revision_role/deepseek-r1_cross_language.json

jobs:
  cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Shadowseed
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          echo "OLLAMA_VERSION=$(ollama --version 2>&1 | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Pull and fingerprint DeepSeek R1
        run: |
          ollama pull "$MODEL_ID"
          python - <<'PY'
          import json
          import os
          import urllib.request

          requested = os.environ["MODEL_ID"]
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags", timeout=30) as response:
              payload = json.load(response)
          match = next(
              (
                  model
                  for model in payload.get("models", [])
                  if model.get("name") == requested
                  or model.get("model") == requested
              ),
              None,
          )
          if match is None or not match.get("digest"):
              raise SystemExit(f"unable to resolve digest for {requested}: {payload}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODEL_DIGEST={match['digest']}\n")
          print("resolved model digest", match["digest"])
          PY

      - name: Run paired NL EN revision screen
        run: |
          mkdir -p "$(dirname "$RUN_PATH")"
          GITHUB_SHA="$(git rev-parse HEAD)" python scripts/run_revision_role_benchmark.py \
            --cases benchmarks/revision_role/cross_language_cases.json \
            --model-id "$MODEL_ID" \
            --model-revision "$MODEL_DIGEST" \
            --max-new-tokens 700 \
            --timeout 300 \
            --output "$RUN_PATH"

      - name: Verify paired result and add provenance
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["RUN_PATH"])
          report = json.loads(path.read_text(encoding="utf-8"))
          expected_head = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          assert report["artifact"] == "shadowseed-revision-role-screen-v1"
          assert report["shadowseed_source_ref"] == expected_head
          assert report["model_id"] == os.environ["MODEL_ID"]
          assert report["model_revision"] == os.environ["MODEL_DIGEST"]
          assert report["summary"]["cases"] == 4
          assert report["language_summary"]["nl"]["cases"] == 2
          assert report["language_summary"]["en"]["cases"] == 2
          assert len(report["pair_comparison"]) == 2
          assert {item["pair_id"] for item in report["pair_comparison"]} == {
              "industrial-revolution",
              "ml-production",
          }

          report["runtime_provenance"] = {
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "ollama_version": os.environ["OLLAMA_VERSION"],
              "model_digest": os.environ["MODEL_DIGEST"],
              "execution_note": (
                  "Paired language-quality screen on GitHub Linux CPU. Each NL/EN pair "
                  "keeps the task semantics and authored additions aligned. Absolute "
                  "latency is not representative of the user's laptop."
              ),
          }
          path.write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report["language_summary"], indent=2))
          print(json.dumps(report["pair_comparison"], indent=2))
          PY

      - name: Commit cross-language result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_PATH"
          git diff --cached --check
          git commit -m "Record R1 paired NL EN revision screen"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Upload cross-language result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1-cross-language-revision-screen
          path: ${{ env.RUN_PATH }}
